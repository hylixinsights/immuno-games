<script>
(function(){
  var jogo=null, t0=0, acumulado=0, enviado=false;
  function agora(){ return (window.performance&&performance.now)?performance.now():Date.now(); }
  function faixa(s){ if(s<30)return"menos-30s"; if(s<120)return"30s-2min"; if(s<300)return"2-5min"; if(s<600)return"5-10min"; if(s<1200)return"10-20min"; return"mais-20min"; }

  function pausar(){ if(jogo!==null){ acumulado+=agora()-t0; t0=agora(); } }
  function flush(motivo){ if(jogo===null||enviado) return; pausar(); var s=Math.round(acumulado/1000); if(s<3) return; enviado=true; imTrack("jogo_tempo",{jogo:jogo,duracao_seg:s,faixa:faixa(s),motivo:motivo}); }
  window.imFimPartida=function(){ flush("fim"); };
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="hidden") pausar(); else t0=agora(); });
  window.addEventListener("pagehide",function(){ flush("saiu"); });
})();
</script>

'use strict';
// =====================================================================
//  MEMÓRIA IMUNE v2 — núcleo: canvas nítido (devicePixelRatio), áudio, utilidades
// =====================================================================
const canvas=document.getElementById('game');
let ctx=canvas.getContext('2d'); // 'let': o guia desenha retratos trocando o contexto temporariamente
const GH=450;
// A altura lógica é fixa (450); a largura acompanha a proporção da tela (800–1100),
// para o jogo ocupar a tela inteira de um celular deitado sem faixas pretas.
function calcGW(){return Math.round(Math.min(1100,Math.max(800,GH*window.innerWidth/Math.max(1,window.innerHeight))));}
let GW=calcGW();
const PANEL_H=84,FIELD_H=GH-PANEL_H,BASE_X=80;
// Dispositivo de toque (celular/tablet): botões maiores, sem atalhos de teclado
const TOUCH=(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window)||navigator.maxTouchPoints>0&&!window.matchMedia('(pointer:fine)').matches;
let SCALE=1;          // pixels reais por unidade lógica
let CSSK=1;           // pixels CSS por unidade lógica
let UK=1;             // fator de interface: >1 em telas pequenas (letras e botões maiores)
let bgDirty=true;     // fundo pré-renderizado precisa ser refeito
let booted=false;    // true depois que todo o script carregou
function isPortrait(){return window.innerHeight>window.innerWidth;}
function resizeCanvas(){
  // no celular em retrato mostramos o aviso de girar e não mexemos na largura do campo
  if(!(TOUCH&&isPortrait())){const ng=calcGW();if(Math.abs(ng-GW)>=4){const old=GW;GW=ng;if(typeof onGWChange==='function')onGWChange(old);}}
  const ar=GW/GH,vw=window.innerWidth,vh=window.innerHeight;
  let w,h;
  if(vw/vh>ar){h=vh;w=h*ar;}else{w=vw;h=w/ar;}
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  canvas.style.marginTop=((vh-h)/2)+'px';
  CSSK=h/GH;UK=Math.max(1,Math.min(1.35,1.15/CSSK));
  const dpr=Math.min(TOUCH?2:2.5,window.devicePixelRatio||1);
  const s=Math.max(1,Math.min(TOUCH?2:3,w*dpr/GW));
  if(Math.abs(s-SCALE)>0.01||canvas.width!==Math.round(GW*s)){
    SCALE=s;canvas.width=Math.round(GW*SCALE);canvas.height=Math.round(GH*SCALE);bgDirty=true;
  }
  if(typeof onViewportChange==='function')onViewportChange();
}
window.addEventListener('resize',resizeCanvas);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resizeCanvas);
resizeCanvas();
const FPS=60,FT=1000/FPS;
let lastTS=0,accum=0;

// ---------- armazenamento seguro ----------
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsJSON(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}

// ---------- áudio suave ----------
const FONT='Fredoka, "Segoe UI", Arial, sans-serif';
if(document.fonts){document.fonts.load('700 32px Fredoka');document.fonts.load('500 14px Fredoka');}
let audioCtx=null,masterGain=null;
let muted=lsGet('imuno_mute','0')==='1';
function initAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
    masterGain=audioCtx.createGain();masterGain.gain.value=muted?0:0.7;masterGain.connect(comp);comp.connect(audioCtx.destination);}catch(e){return;}}
  if(audioCtx.state==='suspended')audioCtx.resume();
}
function toggleMute(){muted=!muted;lsSet('imuno_mute',muted?'1':'0');if(masterGain)masterGain.gain.value=muted?0:0.7;}
function tone(f,d,o={}){
  if(!audioCtx||!masterGain)return;
  try{const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),g=audioCtx.createGain(),lp=audioCtx.createBiquadFilter();
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+d);
    lp.type='lowpass';lp.frequency.value=o.cutoff||2400;
    const v=o.vol||0.05,a=o.attack||0.008;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0005,t+d);
    osc.connect(lp);lp.connect(g);g.connect(masterGain);osc.start(t);osc.stop(t+d+0.02);}catch(e){}
}
function chord(notes,d,o={},gap=0.07){notes.forEach((n,i)=>setTimeout(()=>tone(n,d,o),i*gap*1000));}
function noiseBurst(d,vol=0.05,cutoff=800){
  if(!audioCtx||!masterGain)return;
  try{const t=audioCtx.currentTime,len=Math.floor(audioCtx.sampleRate*d),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
    const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),lp=audioCtx.createBiquadFilter();src.buffer=buf;lp.type='lowpass';lp.frequency.value=cutoff;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0005,t+d);src.connect(lp);lp.connect(g);g.connect(masterGain);src.start(t);}catch(e){}
}
// limita sons muito repetidos (muitos acertos no mesmo quadro)
const sndGate={};
function gate(k,ms){const n=performance.now();if(sndGate[k]&&n-sndGate[k]<ms)return false;sndGate[k]=n;return true;}
function sndPlace(){tone(520,0.09,{slide:700,vol:0.04});}
function sndHit(){if(gate('hit',45))tone(230,0.05,{type:'triangle',vol:0.018});}
function sndKill(){if(gate('kill',40))tone(620,0.12,{slide:300,vol:0.04});}
function sndHurt(){noiseBurst(0.2,0.07,400);tone(90,0.3,{type:'triangle',slide:50,vol:0.06});}
function sndShoot(){if(gate('shoot',50))tone(1400,0.04,{slide:900,vol:0.014});}
function sndWin(){chord([523,659,784,1047,1319],0.35,{vol:0.05},0.09);}
function sndLose(){tone(300,0.5,{type:'triangle',slide:70,vol:0.06});noiseBurst(0.4,0.05,400);}
function sndSelect(){tone(700,0.05,{vol:0.025});}
function sndError(){tone(180,0.12,{type:'triangle',vol:0.035});}
function sndNet(){tone(260,0.3,{type:'triangle',slide:140,vol:0.04});}
function sndDegran(){if(gate('degran',60))noiseBurst(0.15,0.03,1500);}
function sndDiff(){chord([523,659,784],0.15,{vol:0.04});}
function sndWave(){tone(110,0.35,{type:'triangle',vol:0.06});noiseBurst(0.25,0.04,300);}
function sndPhago(){if(gate('phago',60))tone(200,0.15,{slide:320,vol:0.035});}
function sndCytokine(){chord([784,988,1175],0.12,{vol:0.04});}
function sndUpgrade(){chord([440,660,880,1320],0.18,{vol:0.045},0.05);}
function sndRecycle(){tone(660,0.18,{slide:260,vol:0.035});}
function sndCoin(){if(gate('coin',70))tone(1320,0.06,{vol:0.02});}
function sndCall(){tone(180,0.25,{type:'triangle',slide:360,vol:0.05});}

// ---------- utilidades ----------
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1);}
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}
function rnd(a,b){return a+Math.random()*(b-a);}
function easeOut(t){return 1-(1-t)*(1-t);}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();}
function hexToRGB(hex){return parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16);}
function rgba(hex,a){return 'rgba('+hexToRGB(hex)+','+a+')';}
function shade(col,amt){let r=parseInt(col.slice(1,3),16)+amt,g=parseInt(col.slice(3,5),16)+amt,b=parseInt(col.slice(5,7),16)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');}
// gerador pseudoaleatório com semente (fundos estáveis)
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function wrapLines(text,maxW){const ws=String(text).split(' ');const ls=[];let c='';for(const w of ws){const t=c?c+' '+w:w;if(ctx.measureText(t).width>maxW&&c){ls.push(c);c=w;}else c=t;}if(c)ls.push(c);return ls;}
// texto com contorno (legível sobre qualquer fundo)
function outlined(txt,x,y,fill,stroke='rgba(0,0,0,0.4)',lw=2){ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeText(txt,x,y);ctx.fillStyle=fill;ctx.fillText(txt,x,y);}
// letras pequenas crescem em telas pequenas (UK); títulos grandes quase não mudam
function fz(sz){return sz*(1+(UK-1)*clamp((20-sz)/10,0,1));}
function font(sz,w=600){return w+' '+fz(sz).toFixed(1)+'px '+FONT;}
function compact(){return UK>1.05;}
function inRect(x,y,r){return r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
// canvas auxiliar (cache de desenhos em alta resolução)
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}

function guideFind(id){for(const t of GUIDE_TABS){const e=GUIDE[t].entries.find(x=>x.id===id);if(e)return {tab:t,entry:e};}return null;}
// fases em que cada elemento aparece
function guideLevelsOf(id){const out=[];LEVELS.forEach((L,i)=>{const ens=new Set(L.staticEnemies.map(s=>s.type));L.waves.forEach(w=>w.enemies.forEach(g=>ens.add(g.type)));
  if(ens.has('BIOFILME'))ens.add('BACTERIA');if(ens.has('TUMOR'))ens.add('METASTASE');
  if(L.available.includes(id)||(L.cytokinesAvailable||[]).includes(id)||ens.has(id))out.push(i+1);});return out;}

const SPR={};let spritesReady=false;
function tintedCopy(img,w,h,color){const c=makeCanvas(w,h),g=c.getContext('2d');g.drawImage(img,0,0,w,h);g.globalCompositeOperation='source-in';g.fillStyle=color;g.fillRect(0,0,w,h);return c;}
function buildSprite(img,n){
  const fr=img.height,hw=Math.round(img.width/2),hh=Math.round(img.height/2);
  return {img,n,fr,hfr:hh,white:tintedCopy(img,hw,hh,'#ffffff'),black:tintedCopy(img,hw,hh,'#1a0010'),gold:tintedCopy(img,hw,hh,'#FFD54A')};
}
function loadSprites(cb){
  const keys=Object.keys(SPRITE_DATA.data);let left=keys.length;
  const done=()=>{if(--left===0){spritesReady=true;cb&&cb();}};
  for(const k of keys){const img=new Image();img.onload=()=>{try{SPR[k]=buildSprite(img,SPRITE_DATA.meta[k].n);}catch(e){}done();};img.onerror=done;img.src=SPRITE_DATA.data[k];}
}
// desenha um quadro do sprite centrado em (x,y); layer: null | 'white' | 'black' | 'gold'
function drawSpr(key,frame,x,y,size,alpha=1,layer=null){
  const s=SPR[key];
  if(!s){ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(x,y,size*0.35,0,Math.PI*2);ctx.fillStyle='#ccc';ctx.fill();ctx.globalAlpha=1;return;}
  const f=((frame%s.n)+s.n)%s.n;
  const prev=ctx.globalAlpha;ctx.globalAlpha=prev*alpha;
  if(!layer) ctx.drawImage(s.img,f*s.fr,0,s.fr,s.fr,x-size/2,y-size/2,size,size);
  else ctx.drawImage(s[layer],f*s.hfr,0,s.hfr,s.hfr,x-size/2,y-size/2,size,size);
  ctx.globalAlpha=prev;
}
// ícone do card (usa o primeiro quadro)
function unitSprKey(type,plasma){const u=UNITS[type];return plasma&&u.sprPlasma?u.sprPlasma:u.spr;}

function spawnEnemy(type,x,y,ov){const e=makeEnemy(type,x,y,ov);enemies_.push(e);return e;}
function makeEnemy(type,x,y,ov){
  const cfg=ENEMIES[type];
  if(x===undefined) x=GW+14+Math.random()*24;
  if(y===undefined) y=34+Math.random()*(FIELD_H-68);
  const hp=ov&&ov.hp?ov.hp:cfg.hp, spd=ov&&ov.spd?ov.spd:cfg.spd;
  const e={type,x,y,hp,maxHp:hp,r:cfg.r,spd,flash:0,spawnTimer:Math.floor(Math.random()*60),
    wobble:Math.random()*Math.PI*2,phaseOff:Math.random()*Math.PI*2,segments:[],flagella:[],
    zigDir:1,zigTimer:0,mutated:false,pdl1:!!cfg.pdl1,opso:0,netted:0,ingested:0,dead:false,
    rot:(Math.random()-0.5)*0.4,seed:Math.floor(Math.random()*1e9),spawnIn:18};
  if(cfg.segN){for(let i=0;i<cfg.segN;i++) e.segments.push({x:x+i*cfg.segD,y});e.segD=cfg.segD;}
  if(type==='BACTERIA'){const nf=3+Math.floor(Math.random()*3);for(let f=0;f<nf;f++) e.flagella.push({a:(Math.random()-0.5)*1.6,len:9+Math.random()*7,phase:Math.random()*Math.PI*2});e.len=1.9+Math.random()*0.5;}
  if(type==='ENTAMOEBA'){e.pseudoPhase=Math.random()*Math.PI*2;e.zigTimer=30+Math.random()*40;e.zigDir=Math.random()>0.5?1:-1;e.ingested=1+Math.floor(Math.random()*2);}
  if(type==='METASTASE'){if(!(ov&&ov.hp)){e.hp=55+Math.random()*30;e.maxHp=e.hp;}e.spd=0.58+Math.random()*0.25;}
  return e;
}

function spawnAlly(type,x,y,free=false){
  const cfg=UNITS[type];
  if(!free){
    if(unitLocked(type)){sndError();addText(x,y-14,'Expansão clonal: '+Math.ceil((ADAPT_DELAY-playFrames)/60)+' s','#FFCC66',11);return null;}
    const cost=unitCost(type);
    if(atp<cost){sndError();addText(x,y-14,'ATP insuficiente','#FF9A8A',11);atpFlash=30;return null;}
    atp-=cost;
  }
  x=clamp(x,BASE_X+cfg.r,GW-cfg.r);y=clamp(y,cfg.r+4,FIELD_H-cfg.r-4);
  const a={type,x,y,hx:x,hy:y,px:x,py:y,vx:0,vy:0,hp:cfg.hp,maxHp:cfg.hp,r:cfg.r,
    spd:cfg.spd,dmg:cfg.dmg,range:cfg.range,atkSpd:cfg.atkSpd,
    target:null,atkCooldown:0,flash:0,lvl:1,spent:free?0:unitCost(type),
    diffTimer:type==='LINFOB'?(levelSecondary?45:180):0,diffMax:type==='LINFOB'?(levelSecondary?45:180):0,differentiated:false,
    wobble:Math.random()*Math.PI*2,pseudoPhase:Math.random()*Math.PI*2,
    v:Math.floor(Math.random()*8),v2:0,morph:0,morphTimer:120+Math.floor(Math.random()*240),
    spawnAnim:18,phago:null,phagosomes:[],lunge:0,lungeX:0,lungeY:0,
    netR:35,netLife:300,netDmg:2,phagoHeal:20,helmMul:3,opsoDur:240,adcc:false,memoryCell:false};
  allies.push(a);addP(x,y,cfg.col,10,3);if(!free)sndPlace();return a;
}

function upgradeAlly(a){
  if(!a||a.lvl>=2){sndError();return;}
  const cost=upgradeCost(a);
  if(atp<cost){sndError();addText(a.x,a.y-a.r-14,'ATP insuficiente','#FF9A8A',11);atpFlash=30;return;}
  atp-=cost;a.spent+=cost;a.lvl=2;
  switch(a.type){
    case 'NEUTRO':a.dmg*=1.4;a.atkSpd=24;a.netR=50;a.netLife=420;a.netDmg=4;break;
    case 'MACRO':a.dmg*=1.5;a.maxHp+=40;a.hp+=40;a.phagoHeal=30;a.range+=4;break;
    case 'EOSINO':a.range=Math.round(a.range*1.35);a.dmg*=1.5;a.helmMul=4;break;
    case 'LINFOB':a.dmg*=1.4;a.atkSpd=17;a.opsoDur=420;if(!a.differentiated)a.diffTimer=Math.min(a.diffTimer,30);break;
    case 'TCITO':a.dmg*=1.5;a.maxHp+=30;a.hp+=30;a.atkSpd=26;break;
    case 'NK':a.dmg*=1.3;a.adcc=true;break;
  }
  a.hp=Math.min(a.maxHp,a.hp+15);
  effects.push({type:'upBurst',x:a.x,y:a.y,life:28,col:UNITS[a.type].col});
  for(let i=0;i<16;i++){const ang=i/16*Math.PI*2;particles.push({x:a.x,y:a.y,vx:Math.cos(ang)*2.4,vy:Math.sin(ang)*2.4,life:1,decay:0.03,r:2.2,col:'#FFE27A'});}
  addText(a.x,a.y-a.r-16,UNITS[a.type].up.name+'!','#FFE27A',12);sndUpgrade();
}

function recycleAlly(a){
  if(!a)return;const ref=refundOf(a);atp+=ref;
  spawnDebris(a.x,a.y,UNITS[a.type].col,6);
  addText(a.x,a.y-a.r-10,'Apoptose  +'+ref+' ATP','#FFE27A',11);sndRecycle();
  const i=allies.indexOf(a);if(i>=0)allies.splice(i,1);if(selAlly===a)selAlly=null;
}

function activateCytokine(key){
  const cfg=CYTOKINES[key];if(!cfg)return;
  if(cytokineCooldowns[key]>0){sndError();return;}
  if(atp<cfg.cost){sndError();atpFlash=30;return;}
  atp-=cfg.cost;activeCytokines.push({key,timer:cfg.duration});cytokineCooldowns[key]=cfg.cooldown;sndCytokine();
  effects.push({type:'cytoWave',x:BASE_X,y:FIELD_H/2,life:40,col:cfg.col});
  if(key==='CXCL8') recruitNeutrophils(3);
  if(key==='IFNG') for(const a of allies) if(a.type==='MACRO') addP(a.x,a.y,cfg.col,10,3); else addP(a.x,a.y,cfg.col,4,2);
  if(key==='IL5') for(const a of allies) if(a.type==='EOSINO') addP(a.x,a.y,cfg.col,10,3);
  if(key==='IL2') for(const a of allies) if(a.type==='TCITO'||a.type==='NK') addP(a.x,a.y,cfg.col,10,3);
  if(key==='IL13') for(const e of enemies_) if(HELMINTHS.has(e.type)) addP(e.x,e.y,'#FFFFFF',8,2);
  if(key==='ANTIPDL1') for(const e of enemies_) if(e.pdl1) addP(e.x,e.y,cfg.col,10,3);
  addText(GW/2,FIELD_H/2-40,cfg.name+(key==='ANTIPDL1'?' aplicado!':key==='IFNG'?' liberado!':' liberada!'),cfg.col,16);
}

// CXCL8: neutrófilos saem dos capilares (diapedese) e entram no tecido
function recruitNeutrophils(n){
  for(let i=0;i<n;i++){
    let x,y;const vs=vessels.filter(v=>v.pts.length>1);
    if(vs.length){const v=vs[i%vs.length];let p=null;for(let k=0;k<20;k++){const q=pathPoint(v.pts,Math.random());if(q.x>BASE_X+110&&q.x<GW-160){p=q;break;}}
      if(p){x=p.x;y=p.y;}}
    if(x===undefined){x=BASE_X+110+Math.random()*(GW-BASE_X-280);y=40+Math.random()*(FIELD_H-80);}
    const a=spawnAlly('NEUTRO',x,y,true);
    if(a){effects.push({type:'upBurst',x:a.x,y:a.y,life:28,col:'#6FC3FF'});addText(a.x,a.y-18,'diapedese','#BFE6FF',10);}
  }
}
function nextWaveIn(){const L=LEVELS[level];if(waveIndex>=L.waves.length)return -1;return Math.max(0,L.waves[waveIndex].time-waveClock);}
function callBonus(){const r=nextWaveIn();return r>30?Math.max(1,Math.round(r/60)):0;}
function callNextWave(){
  const r=nextWaveIn();if(r<=30||introTimer>0){sndError();return;}
  const b=callBonus();atp+=b;waveClock=LEVELS[level].waves[waveIndex].time;
  addText(GW/2,58,'Onda antecipada  +'+b+' ATP','#FFE27A',13);sndCall();
}

function spawnWaves(){
  const L=LEVELS[level];
  while(waveIndex<L.waves.length && waveClock>=L.waves[waveIndex].time){
    const w=L.waves[waveIndex];let d=0;
    for(const eg of w.enemies){
      for(let j=0;j<eg.count;j++){spawnQueue.push({type:eg.type,delay:d,hp:eg.hp,spd:eg.spd,x:eg.rx!==undefined?GW-eg.rx:undefined,y:eg.ry!==undefined?eg.ry*FIELD_H:undefined});d+=eg.rx!==undefined?0:SPAWN_STAGGER;}
    }
    waveIndex++;waveAlert='Onda '+waveIndex+' de '+L.waves.length;waveAlertLife=130;sndWave();
    if(w.enemies.some(g=>g.type==='TUMOR'))addText(GW-160,FIELD_H*0.62,'Novo foco tumoral!','#E3A8FF',14);
  }
}
function processSpawnQueue(){
  for(let i=spawnQueue.length-1;i>=0;i--){const q=spawnQueue[i];if(--q.delay<=0){
    const e=spawnEnemy(q.type,q.x,q.y,{hp:q.hp,spd:q.spd});
    if(q.x!==undefined){effects.push({type:'upBurst',x:e.x,y:e.y,life:28,col:ENEMIES[q.type].col});}
    spawnQueue.splice(i,1);}}
}

// =====================================================================
//  LÓGICA (passo fixo de 1/60 s; em 2x roda dois passos por quadro)
// =====================================================================
function addP(x,y,col,n=6,sp=4,sz=null){
  for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-0.5)*sp,vy:(Math.random()-0.5)*sp,
    life:1,decay:0.018+Math.random()*0.02,r:sz||(1.4+Math.random()*2.6),col});
}
function addText(x,y,txt,col='#FFF',sz=12){floatTexts.push({x,y,txt,col,sz,life:1,vy:-0.6});}
function spawnDebris(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=0.4+Math.random()*1.2;debris.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*3.5,life:1,col});}}

function update(){
  if(state!=='playing') return;
  frame++;
  if(introTimer>0){introTimer--;return;}
  playFrames++;waveClock++;
  if(shake>0){shake--;shakeX=(Math.random()-0.5)*shake*0.45;shakeY=(Math.random()-0.5)*shake*0.45;}else{shakeX=0;shakeY=0;}
  atp=Math.min(999,atp+atpRegen);
  spawnWaves();processSpawnQueue();
  if(waveAlertLife>0) waveAlertLife--;
  if(tipLife>0) tipLife--;
  if(baseHitFlash>0) baseHitFlash--;
  if(atpFlash>0) atpFlash--;
  for(let i=activeCytokines.length-1;i>=0;i--){if(--activeCytokines[i].timer<=0)activeCytokines.splice(i,1);}
  for(const k in cytokineCooldowns){if(cytokineCooldowns[k]>0)cytokineCooldowns[k]--;}
  // título de anticorpos: sobe a cada anticorpo disparado, decai lentamente
  abTiter*=0.9993;
  if(playFrames%AB_SAMPLE===0) abCurve.push(Math.round(abTiter*100)/100);
  updateAllies();updateEnemies();separate();updateProjectiles();updateNets();updateFx();
  checkWinLose();
}

function updateFx(){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;p.life-=p.decay;if(p.life<=0)particles.splice(i,1);}
  for(let i=floatTexts.length-1;i>=0;i--){const t=floatTexts[i];t.y+=t.vy;t.vy*=0.97;t.life-=0.016;if(t.life<=0)floatTexts.splice(i,1);}
  for(let i=effects.length-1;i>=0;i--){if(--effects[i].life<=0)effects.splice(i,1);}
  for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.x+=d.vx;d.y+=d.vy;d.vx*=0.95;d.vy*=0.95;d.life-=0.012;if(d.life<=0)debris.splice(i,1);}
  if(floatTexts.length>60)floatTexts.splice(0,floatTexts.length-60);
  if(particles.length>500)particles.splice(0,particles.length-500);
}

function updateAllies(){
  const ifng=isCytoActive('IFNG'),il5=isCytoActive('IL5'),il2=isCytoActive('IL2');
  for(let i=allies.length-1;i>=0;i--){
    const a=allies[i];
    if(a.hp<=0){killAlly(i);continue;}
    a.wobble+=0.06;a.pseudoPhase+=0.04;
    a.vx=a.x-a.px;a.vy=a.y-a.py;a.px=a.x;a.py=a.y;
    if(a.flash>0) a.flash--;
    if(a.spawnAnim>0) a.spawnAnim--;
    if(a.lunge>0) a.lunge--;
    // troca lenta de forma (quadros diferentes da ilustração)
    if(a.morph>0){a.morph+=1/36;if(a.morph>=1){a.v=a.v2;a.morph=0;}}
    else if(--a.morphTimer<=0){a.v2=(a.v+1+Math.floor(Math.random()*7))%8;a.morph=0.001;a.morphTimer=200+Math.floor(Math.random()*260);}
    for(let p=a.phagosomes.length-1;p>=0;p--){if(--a.phagosomes[p].life<=0)a.phagosomes.splice(p,1);}
    // citocinas: IFN-γ ativa sobretudo macrófagos; IL-5 age nos eosinófilos; IL-2 nos T CD8+ e NK
    const dmgBoost=(ifng?(a.type==='MACRO'?1.8:1.25):1)*(il5&&a.type==='EOSINO'?1.6:1);
    const fast=(il5&&a.type==='EOSINO')||(il2&&(a.type==='TCITO'||a.type==='NK'));
    if(il2 && (a.type==='TCITO'||a.type==='NK'||a.type==='LINFOB') && frame%20===0){a.hp=Math.min(a.maxHp,a.hp+1);}
    if(a.phago){ // fagocitose em andamento
      a.phago.t--;
      if(a.phago.t<=0){a.hp=Math.min(a.maxHp,a.hp+a.phagoHeal);addText(a.x,a.y-a.r-8,'+'+a.phagoHeal+' HP','#6CFF9C',11);
        a.phagosomes.push({life:170,ang:Math.random()*Math.PI*2,d:a.r*0.35*Math.random()});a.phago=null;sndPhago();}
      continue;}
    if(a.type==='LINFOB' && !a.differentiated){
      a.diffTimer--;
      if(a.diffTimer<50 && frame%4===0){const ang=Math.random()*Math.PI*2;particles.push({x:a.x+Math.cos(ang)*16,y:a.y+Math.sin(ang)*16,vx:Math.cos(ang)*-1,vy:Math.sin(ang)*-1,life:0.8,decay:0.04,r:2,col:'#9FF2D2'});}
      if(a.diffTimer<=0){a.differentiated=true;a.spd=0;a.r=12;a.range=170;a.hx=a.x;a.hy=a.y;addP(a.x,a.y,'#9FF2D2',16,5);
        effects.push({type:'diffBurst',x:a.x,y:a.y,life:24,maxR:34});addText(a.x,a.y-24,'PLASMÓCITO!','#9FF2D2',12);sndDiff();}
      else{ // anda até o posto enquanto amadurece
        const hd=dist(a.x,a.y,a.hx,a.hy);if(hd>3){a.x+=(a.hx-a.x)/hd*a.spd;a.y+=(a.hy-a.y)/hd*a.spd;}}
      continue;}
    if(a.type==='LINFOB'){ // plasmócito secreta anticorpos o tempo todo: é isso que forma o título
      abTiter+=(levelSecondary?1.6:1)*(a.lvl>1?1.4:1)/25;if(firstAbFrame<0)firstAbFrame=playFrames;}
    // Alvo: inimigo mais próximo dentro da "coleira" (raio a partir do posto)
    const reach=(a.spd>0?LEASH:0)+a.range+30;
    if(!a.target || a.target.hp<=0 || a.target.dead || dist(a.hx,a.hy,a.target.x,a.target.y)>reach+a.target.r){
      a.target=null;let minD=Infinity;
      for(const e of enemies_){if(e.hp<=0||e.dead)continue;if(dist(a.hx,a.hy,e.x,e.y)>reach+e.r)continue;const d=dist(a.x,a.y,e.x,e.y);if(d<minD){minD=d;a.target=e;}}
    }
    if(!a.target){ // sem alvo: volta ao posto
      if(a.spd>0){const hd=dist(a.x,a.y,a.hx,a.hy);if(hd>3){const s=Math.min(a.spd,hd);a.x+=(a.hx-a.x)/hd*s;a.y+=(a.hy-a.y)/hd*s;}}
      if(a.atkCooldown>0)a.atkCooldown--;
      continue;
    }
    const tgt=a.target,d=dist(a.x,a.y,tgt.x,tgt.y),effectiveRange=a.range+tgt.r;
    if(a.spd>0 && d>effectiveRange){const dx=tgt.x-a.x,dy=tgt.y-a.y;a.x+=dx/d*a.spd;a.y+=dy/d*a.spd;a.x=clamp(a.x,a.r,GW-a.r);a.y=clamp(a.y,a.r,FIELD_H-a.r);}
    if(a.atkCooldown>0){a.atkCooldown--;}
    else if(d<=effectiveRange){
      a.atkCooldown=Math.round(a.atkSpd*(fast?0.7:1));
      if(a.type==='LINFOB' && a.differentiated){
        const dx=tgt.x-a.x,dy=tgt.y-a.y,dd=Math.hypot(dx,dy)||1;
        projectiles.push({x:a.x,y:a.y,vx:dx/dd*5.5,vy:dy/dd*5.5,dmg:a.dmg*dmgBoost*(levelSecondary?1.6:1),target:tgt,life:120,r:3.2,trail:[],opso:a.opsoDur,rot:Math.atan2(dy,dx)});
        sndShoot();a.flash=0;a.lunge=6;a.lungeX=-dx/dd;a.lungeY=-dy/dd;
      } else if(a.type==='EOSINO'){
        let hitAny=false;
        for(const e of enemies_){if(e.hp<=0||e.dead)continue;const de=dist(a.x,a.y,e.x,e.y);
          if(de<=a.range+e.r){let dmg=a.dmg*dmgBoost;if(e.type==='HELMINTO')dmg*=a.helmMul;else if(e.type==='LARVA')dmg*=a.helmMul-1;if(e.opso>0)dmg*=1.3;dealDamage(e,dmg,a);hitAny=true;}}
        if(hitAny){effects.push({type:'degran',x:a.x,y:a.y,maxR:a.range+8,life:22});
          for(let p=0;p<14;p++){const ang=p*Math.PI*2/14+Math.random()*0.2;particles.push({x:a.x,y:a.y,vx:Math.cos(ang)*3.2,vy:Math.sin(ang)*3.2,life:0.9,decay:0.032,r:2.4,col:'#FFB36B'});}sndDegran();}
      } else {
        let dmg=a.dmg*dmgBoost;let note=null;
        if(a.type==='TCITO'){
          if(tgt.type==='TUMOR'||tgt.type==='METASTASE'){
            const blocked=tgt.pdl1 && !isCytoActive('ANTIPDL1');
            if(blocked){dmg=Math.ceil(dmg/3);note='PD-L1 freia!';}else dmg*=3;
          } else if(tgt.type==='HELMINTO') dmg=Math.ceil(dmg/3);
        } else if(a.type==='NK'){
          if(tgt.type==='TUMOR'||tgt.type==='METASTASE') dmg*=1.5; // NK é pouco afetada pelo PD-L1
          if(a.adcc && tgt.opso>0) dmg*=2;
          if(tgt.type==='HELMINTO') dmg=Math.ceil(dmg/3);
        } else {
          if(tgt.type==='HELMINTO') dmg=Math.ceil(dmg/3);
          if(tgt.type==='BIOFILME') dmg=Math.ceil(dmg/2);
          if(tgt.type==='ENTAMOEBA' && a.type==='NEUTRO') dmg=Math.ceil(dmg/2);
          if(tgt.type==='TUMOR'||tgt.type==='METASTASE') dmg*=0.8; // macrófagos atacam tumores, mas não são especialistas
          if(tgt.opso>0) dmg*=1.3; // opsonização facilita a fagocitose
        }
        if(a.type==='MACRO' && tgt.type==='BACTERIA' && tgt.hp-dmg<=0){a.phago={t:22,x:tgt.x,y:tgt.y};}
        dealDamage(tgt,dmg,a);
        if(note && Math.random()<0.35){addText(tgt.x,tgt.y-tgt.r-14,note,'#8FB8FF',10);effects.push({type:'block',x:(a.x+tgt.x)/2,y:(a.y+tgt.y)/2,life:14});}
        if(tgt.type==='BACTERIA'){a.hp-=ENEMIES.BACTERIA.contactDmg;a.flash=4;}
        const dx=tgt.x-a.x,dy=tgt.y-a.y,dd=Math.hypot(dx,dy)||1;a.lunge=8;a.lungeX=dx/dd;a.lungeY=dy/dd;
        const mx=(a.x+tgt.x)/2,my=(a.y+tgt.y)/2;addP(mx,my,'#FFFFFF',4,3,1.8);effects.push({type:'hit',x:mx,y:my,life:9});sndHit();
      }
    }
    if(a.hp<=0) killAlly(i);
  }
}

function killAlly(i){
  const a=allies[i];
  if(a.type==='NEUTRO'){nets.push({x:a.x,y:a.y,r:a.netR,life:a.netLife,maxLife:a.netLife,dmg:a.netDmg,dmgTimer:0,strands:makeNetStrands(a.netR)});
    addP(a.x,a.y,'#B9D8FF',16,6);effects.push({type:'netBurst',x:a.x,y:a.y,life:16,maxR:a.netR});addText(a.x,a.y-15,'NET!','#A8D4FF',13);sndNet();}
  spawnDebris(a.x,a.y,UNITS[a.type].col,5);effects.push({type:'death',x:a.x,y:a.y,life:20,col:UNITS[a.type].col});
  if(selAlly===a)selAlly=null;
  allies.splice(i,1);
}

function makeNetStrands(R){
  const s=[];const n=16+Math.floor(Math.random()*6);
  for(let i=0;i<n;i++){const a1=Math.random()*Math.PI*2,a2=a1+rnd(1.2,3.2);const r1=R*rnd(0.1,1),r2=R*rnd(0.4,1);
    s.push({x1:Math.cos(a1)*r1,y1:Math.sin(a1)*r1,x2:Math.cos(a2)*r2,y2:Math.sin(a2)*r2,cx:rnd(-R,R)*0.5,cy:rnd(-R,R)*0.5,ph:Math.random()*6});}
  return s;
}

function dealDamage(enemy,dmg,attacker){
  if(enemy.dead)return;
  dmg=Math.max(1,Math.round(dmg));enemy.hp-=dmg;enemy.flash=7;
  addText(enemy.x+rnd(-5,5),enemy.y-enemy.r-5,'-'+dmg,'#FF7070',9);
  if(enemy.hp<=0){
    enemy.dead=true;killedEnemyCount++;
    const cfg=ENEMIES[enemy.type];
    addP(enemy.x,enemy.y,cfg.col,12,5);spawnDebris(enemy.x,enemy.y,cfg.col,cfg.big?10:4);
    effects.push({type:'killBurst',x:enemy.x,y:enemy.y,life:22,col:cfg.col,big:!!cfg.big});sndKill();
    if(cfg.bounty){atp+=cfg.bounty;addText(enemy.x,enemy.y+enemy.r+6,'+'+cfg.bounty+' ATP','#FFE27A',cfg.big?13:9);sndCoin();}
    if(cfg.big)shake=Math.max(shake,10);
    if(attacker && attacker.type==='MACRO' && enemy.type!=='BACTERIA'){attacker.hp=Math.min(attacker.maxHp,attacker.hp+attacker.phagoHeal);addText(attacker.x,attacker.y-attacker.r-5,'+'+attacker.phagoHeal+' HP','#6CFF9C',10);}
  }
}

function hurtTissue(e,amt,big){
  tissueHP-=amt;baseHitFlash=30;
  addP(e.x,e.y,'#FF5A5A',big?16:8,big?6:4);addText(e.x+14,e.y-10,'-'+amt+' tecido','#FF6A6A',big?14:11);
  effects.push({type:'tissueDmg',x:BASE_X,y:e.y,life:34});shake=Math.max(shake,big?16:8);sndHurt();
}

function updateEnemies(){
  for(let i=enemies_.length-1;i>=0;i--){
    const e=enemies_[i];
    if(e.hp<=0||e.dead){enemies_.splice(i,1);continue;}
    e.wobble+=0.05;if(e.flash>0) e.flash--;if(e.opso>0)e.opso--;if(e.netted>0)e.netted--;if(e.spawnIn>0)e.spawnIn--;
    const slow=e.netted>0?0.5:1;
    if(e.type==='BACTERIA'){
      e.x-=e.spd*slow;e.y+=Math.sin(e.wobble*2+e.phaseOff)*0.3;e.y=clamp(e.y,e.r,FIELD_H-e.r);
      e.rot=Math.sin(e.wobble*1.3+e.phaseOff)*0.25;
      if(e.x<=BASE_X){hurtTissue(e,ENEMIES.BACTERIA.baseDmg,false);enemies_.splice(i,1);continue;}
    } else if(HELMINTHS.has(e.type)){
      const big=e.type==='HELMINTO',sd=e.segD||9;
      const muco=isCytoActive('IL13')?0.4:1; // IL-4/IL-13: muco e contração ("weep and sweep")
      e.x-=e.spd*slow*muco;e.y+=Math.sin(e.wobble*(big?0.8:1.6)+e.phaseOff)*(big?0.5:0.6);e.y=clamp(e.y,e.r+6,FIELD_H-e.r-6);
      if(!big)e.wobble+=0.06;
      const segs=e.segments;segs[0]={x:e.x+(big?10:4),y:e.y+Math.sin(e.wobble)*(big?3:1.5)};
      for(let s=1;s<segs.length;s++){const prev=segs[s-1];const dx=prev.x-segs[s].x,dy=prev.y-segs[s].y;const d=Math.hypot(dx,dy);if(d>sd){segs[s].x+=dx/d*(d-sd);segs[s].y+=dy/d*(d-sd);}segs[s].y+=Math.sin(e.wobble*1.6+s*0.55)*(big?0.45:0.3);}
      // o verme adulto se debate: fere células coladas nele
      if(big)for(const a of allies){if(dist(a.x,a.y,e.x,e.y)<e.r+a.r+2){a.hp-=0.12;if(frame%20===0)a.flash=3;}}
      if(e.x<=BASE_X){hurtTissue(e,ENEMIES[e.type].baseDmg,big);enemies_.splice(i,1);continue;}
    } else if(e.type==='BIOFILME'){
      e.spawnTimer++;
      if(e.spawnTimer>=ENEMIES.BIOFILME.spawnRate){e.spawnTimer=0;const ang=Math.PI*0.5+Math.random()*Math.PI;const bx=e.x+Math.cos(ang)*(e.r+6);const by=clamp(e.y+Math.sin(ang)*(e.r+6),10,FIELD_H-10);
        const b=spawnEnemy('BACTERIA',bx,by);b.spawnIn=18;addP(bx,by,'#7FD36F',5,2);effects.push({type:'slimeDrip',x:bx,y:by,life:22});e.pulse=16;}
      if(e.pulse>0)e.pulse--;
    } else if(e.type==='ENTAMOEBA'){
      e.pseudoPhase+=0.03;
      if(--e.zigTimer<=0){e.zigDir*=-1;e.zigTimer=30+Math.random()*40;}
      e.x-=e.spd*slow;e.y+=e.zigDir*0.5+Math.sin(e.wobble)*0.3;e.y=clamp(e.y,e.r,FIELD_H-e.r);
      for(let ai=allies.length-1;ai>=0;ai--){ // devora células enfraquecidas
        const a=allies[ai];
        if(dist(e.x,e.y,a.x,a.y)<e.r+a.r && a.hp<55){
          addText(a.x,a.y-10,'DEVORADO!','#FF9A55',12);addP(a.x,a.y,'#C9A27A',10,4);
          effects.push({type:'death',x:a.x,y:a.y,life:20,col:'#C9A27A'});
          if(selAlly===a)selAlly=null;allies.splice(ai,1);e.hp=Math.min(e.maxHp,e.hp+15);e.ingested=Math.min(6,e.ingested+1);sndHurt();
        }
      }
      if(e.x<=BASE_X){hurtTissue(e,ENEMIES.ENTAMOEBA.baseDmg,true);enemies_.splice(i,1);continue;}
    } else if(e.type==='TUMOR'){
      if(!e.mutated && e.hp<=e.maxHp*0.5){e.mutated=true;addText(e.x,e.y-e.r-18,'MUTAÇÃO!','#FF7BFF',14);addP(e.x,e.y,'#C06BE0',16,5);}
      const rate=e.mutated?110:ENEMIES.TUMOR.spawnRate;
      if(++e.spawnTimer>=rate){e.spawnTimer=0;
        const ang=Math.PI*0.5+Math.random()*Math.PI;
        const mx=e.x+Math.cos(ang)*(e.r+12),my=clamp(e.y+Math.sin(ang)*(e.r+12),15,FIELD_H-15);
        const m=spawnEnemy('METASTASE',mx,my);m.spawnIn=18;addP(mx,my,'#C9A0E6',6,3);e.pulse=16;}
      if(e.pulse>0)e.pulse--;
    } else if(e.type==='METASTASE'){
      e.x-=e.spd*slow;e.y+=Math.sin(e.wobble*1.5+e.phaseOff)*0.4;e.y=clamp(e.y,e.r,FIELD_H-e.r);
      if(e.x<=BASE_X){hurtTissue(e,ENEMIES.METASTASE.baseDmg,false);enemies_.splice(i,1);continue;}
    }
  }
}

// evita que células se empilhem umas sobre as outras
function separate(){
  for(let i=0;i<allies.length;i++){const a=allies[i];
    for(let j=i+1;j<allies.length;j++){const b=allies[j];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=(a.r+b.r)*1.15;
      if(d<m&&d>0.01){const push=(m-d)*0.25,ux=dx/d,uy=dy/d;
        const am=a.spd>0?1:0,bm=b.spd>0?1:0;const tot=am+bm;if(!tot)continue;
        a.x-=ux*push*am/tot*2;a.y-=uy*push*am/tot*2;b.x+=ux*push*bm/tot*2;b.y+=uy*push*bm/tot*2;}}}
  const SMALL=new Set(['BACTERIA','METASTASE','LARVA']);
  for(let i=0;i<enemies_.length;i++){const a=enemies_[i];if(!SMALL.has(a.type))continue;
    for(let j=i+1;j<enemies_.length;j++){const b=enemies_[j];if(!SMALL.has(b.type))continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=(a.r+b.r)*0.9;
      if(d<m&&d>0.01){const push=(m-d)*0.15;a.y-=dy/d*push;b.y+=dy/d*push;}}}
}

function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];if(--p.life<=0){projectiles.splice(i,1);continue;}
    if(p.target && p.target.hp>0 && !p.target.dead){const dx=p.target.x-p.x,dy=p.target.y-p.y,d=Math.hypot(dx,dy)||1;p.vx=dx/d*5.8;p.vy=dy/d*5.8;}
    p.rot=Math.atan2(p.vy,p.vx);
    p.trail.push({x:p.x,y:p.y});if(p.trail.length>7)p.trail.shift();
    p.x+=p.vx;p.y+=p.vy;
    for(const e of enemies_){if(e.hp<=0||e.dead)continue;
      if(dist(p.x,p.y,e.x,e.y)<e.r+p.r){dealDamage(e,p.dmg,null);e.opso=Math.max(e.opso,p.opso);addP(p.x,p.y,'#FFE66B',5,3);effects.push({type:'abHit',x:p.x,y:p.y,life:10});projectiles.splice(i,1);break;}}
  }
}

function updateNets(){
  for(let i=nets.length-1;i>=0;i--){
    const n=nets[i];n.life--;n.dmgTimer++;if(n.life<=0){nets.splice(i,1);continue;}
    const hitNow=n.dmgTimer>=60;if(hitNow)n.dmgTimer=0;
    for(const e of enemies_){if(e.hp<=0||e.dead)continue;if(dist(n.x,n.y,e.x,e.y)<n.r+e.r){
      if(e.type!=='BIOFILME'&&e.type!=='TUMOR')e.netted=4;
      if(hitNow){e.hp-=n.dmg;e.flash=4;addText(e.x,e.y-e.r-5,'-'+n.dmg,'#A8D4FF',9);if(e.hp<=0)dealDamage(e,0,null);}}}
  }
}

function checkWinLose(){
  if(tissueHP<=0){tissueHP=0;finishLevel(false);return;}
  const L=LEVELS[level];
  if(waveIndex>=L.waves.length && spawnQueue.length===0 && enemies_.length===0) finishLevel(true);
}

function finishLevel(victory){
  const L=LEVELS[level];
  abCurve.push(Math.round(abTiter*100)/100);
  const stars=victory?(tissueHP>=80?3:tissueHP>=50?2:1):0;
  let gained=false;
  if(victory){
    gained=!memory.has(L.antigen)&&!L.vaccinated;memory.add(L.antigen);saveMemory();
    if(level+1>=levelUnlocked){levelUnlocked=Math.min(LEVELS.length,level+2);lsSet('arena_unlocked',String(levelUnlocked));}
    if((bestStars[level]||0)<stars){bestStars[level]=stars;lsSet('arena_stars',JSON.stringify(bestStars));}
    if(levelHasB()){curves[L.antigen]=curves[L.antigen]||{};curves[L.antigen][levelMode]={pts:abCurve.slice(0,400),first:firstAbFrame};lsSet('arena_curves',JSON.stringify(curves));}
  }
  result={victory,stars,tissue:Math.ceil(tissueHP),gained,fact:FACTS[Math.floor(Math.random()*FACTS.length)],chart:levelHasB()?buildChartData():null,t0:performance.now()};
  state=victory?'victory':'defeat';selectedUnit=null;selAlly=null;
  if(victory)sndWin();else sndLose();
  // métricas anônimas do immuno.games (Umami, sem cookie); não faz nada fora do site
  if(window.imTrack){
    if(victory){imTrack('fase_concluida',{jogo:'arena',fase:level+1,estrelas:stars});if(level===LEVELS.length-1)imTrack('jogo_concluido',{jogo:'arena',resultado:'venceu'});}
    else imTrack('fase_perdida',{jogo:'arena',fase:level+1});
  }
  if(window.imFimPartida)imFimPartida();
}

// curva atual + curva de referência (outra exposição ao mesmo antígeno, ou uma primária típica)
function buildChartData(){
  const L=LEVELS[level];const cur={pts:abCurve.slice(),mode:levelMode,first:firstAbFrame};
  const saved=curves[L.antigen]||{};let ref=null,refLabel='';
  if(levelMode==='primary'){const s=saved.secondary||saved.vaccinated;if(s){ref={pts:s.pts,mode:saved.secondary?'secondary':'vaccinated',first:s.first};refLabel=saved.secondary?'Secundária (vez anterior)':'Vacinado';}}
  else{
    if(saved.primary){ref={pts:saved.primary.pts,mode:'primary',first:saved.primary.first};refLabel='Primária (1º contato)';}
    else{for(const k in curves){if(curves[k].primary){ref={pts:curves[k].primary.pts,mode:'primary',first:curves[k].primary.first};refLabel='Primária · '+k;break;}}}
  }
  return {cur,ref,refLabel,curLabel:levelMode==='primary'?'Primária (agora)':levelMode==='secondary'?'Secundária (agora)':'Vacinado (agora)'};
}

// =====================================================================
//  CENÁRIOS (pré-renderizados em alta resolução) + camada animada
// =====================================================================
let bgCanvas=null,bgScene='',sceneSeed=1,vessels=[],bgParticles=[];
const sceneThumbs={};

function resetScene(){
  sceneSeed=(level+1)*7919;bgDirty=true;
  const R=mulberry(sceneSeed+3);
  vessels=[];
  const scene=LEVELS[level].scene;
  if(scene==='conjuntivo'||scene==='epitelio'){
    const nv=scene==='conjuntivo'?2:1;
    for(let v=0;v<nv;v++){
      const pts=[];let y=FIELD_H*(v===0?0.22:0.8)+(R()-0.5)*30;
      for(let x=-30;x<=GW+30;x+=60){pts.push({x,y});y=clamp(y+(R()-0.5)*44,30,FIELD_H-30);}
      vessels.push({pts,w:scene==='epitelio'?9:10,rbc:Array.from({length:9},(_,i)=>({t:i/9+R()*0.05,sp:0.0007+R()*0.0004}))});
    }
  }
  bgParticles=[];
  for(let i=0;i<34;i++)bgParticles.push({x:Math.random()*GW,y:Math.random()*FIELD_H,vx:(Math.random()-0.5)*0.22,vy:(Math.random()-0.5)*0.16,r:0.8+Math.random()*2.2,alpha:0.08+Math.random()*0.14,phase:Math.random()*Math.PI*2});
}

function pathPoint(pts,t){ // ponto ao longo de uma polilinha, t em [0,1]
  const n=pts.length-1,f=clamp(t,0,0.9999)*n,i=Math.floor(f),u=f-i;
  return {x:lerp(pts[i].x,pts[i+1].x,u),y:lerp(pts[i].y,pts[i+1].y,u),ang:Math.atan2(pts[i+1].y-pts[i].y,pts[i+1].x-pts[i].x)};
}
function smoothPath(g,pts){g.beginPath();g.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length-1;i++){const mx=(pts[i].x+pts[i+1].x)/2,my=(pts[i].y+pts[i+1].y)/2;g.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);}const l=pts[pts.length-1];g.lineTo(l.x,l.y);}

function renderScene(scene,W,H,s,seed){
  const c=makeCanvas(W*s,H*s),g=c.getContext('2d');g.setTransform(s,0,0,s,0,0);
  const R=mulberry(seed);
  if(scene==='conjuntivo')paintConjuntivo(g,W,H,R);
  else if(scene==='intestino')paintIntestino(g,W,H,R);
  else if(scene==='pulmao')paintPulmao(g,W,H,R);
  else paintEpitelio(g,W,H,R);
  return c;
}
function ensureBG(){
  const scene=LEVELS[level].scene;
  if(!bgDirty&&bgCanvas&&bgScene===scene)return;
  bgCanvas=renderScene(scene,GW,FIELD_H,SCALE,sceneSeed);bgScene=scene;bgDirty=false;
  // vasos (parede) entram no pré-render
  const g=bgCanvas.getContext('2d');g.setTransform(SCALE,0,0,SCALE,0,0);
  for(const v of vessels)paintVesselWall(g,v,mulberry(sceneSeed+11));
}
function sceneThumb(scene){
  if(!sceneThumbs[scene])sceneThumbs[scene]=renderScene(scene,GW,FIELD_H,0.34,4242);
  return sceneThumbs[scene];
}

function softBlobs(g,W,H,R,n,col,rmin,rmax){
  for(let i=0;i<n;i++){const x=R()*W,y=R()*H,r=rmin+R()*(rmax-rmin);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
}
function speckles(g,W,H,R,n,col,rmax){g.fillStyle=col;for(let i=0;i<n;i++){g.beginPath();g.arc(R()*W,R()*H,0.4+R()*rmax,0,Math.PI*2);g.fill();}}

// ---------- tecido conjuntivo frouxo ----------
function paintConjuntivo(g,W,H,R){
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#FAD6DC');bg.addColorStop(1,'#F1BEC8');g.fillStyle=bg;g.fillRect(0,0,W,H);
  softBlobs(g,W,H,R,16,'rgba(255,240,244,0.35)',60,150);
  speckles(g,W,H,R,700,'rgba(190,110,140,0.10)',1.1);
  // feixes de colágeno
  for(let i=0;i<24;i++){
    const x0=R()*W*1.2-W*0.1,y0=R()*H,ang=(R()-0.5)*0.9+(R()<0.3?1.2:0),len=180+R()*380,w=4+R()*9;
    const x3=x0+Math.cos(ang)*len,y3=y0+Math.sin(ang)*len;
    const c1x=x0+Math.cos(ang)*len*0.33+(R()-0.5)*90,c1y=y0+Math.sin(ang)*len*0.33+(R()-0.5)*90;
    const c2x=x0+Math.cos(ang)*len*0.66+(R()-0.5)*90,c2y=y0+Math.sin(ang)*len*0.66+(R()-0.5)*90;
    const bez=()=>{g.beginPath();g.moveTo(x0,y0);g.bezierCurveTo(c1x,c1y,c2x,c2y,x3,y3);};
    g.lineCap='round';
    bez();g.strokeStyle='rgba(228,140,165,0.20)';g.lineWidth=w;g.stroke();
    g.save();g.translate(-w*0.18,-w*0.22);bez();g.strokeStyle='rgba(255,236,240,0.38)';g.lineWidth=w*0.32;g.stroke();g.restore();
    for(let k=-1;k<=1;k+=2){g.save();g.translate(k*w*0.22,k*w*0.12);bez();g.strokeStyle='rgba(205,110,140,0.16)';g.lineWidth=0.6;g.stroke();g.restore();}
  }
  // fibras elásticas
  g.lineCap='round';
  for(let i=0;i<14;i++){let x=R()*W,y=R()*H;const ang=(R()-0.5)*2;g.beginPath();g.moveTo(x,y);
    for(let k=0;k<24;k++){x+=Math.cos(ang)*9+(R()-0.5)*3;y+=Math.sin(ang)*9+Math.sin(k*0.9)*3;g.lineTo(x,y);}
    g.strokeStyle='rgba(135,45,95,0.14)';g.lineWidth=0.8;g.stroke();}
  // fibroblastos (fusiformes)
  for(let i=0;i<14;i++){const x=R()*W,y=R()*H,a=(R()-0.5)*1.4,L=16+R()*12,T=3+R()*2.5;
    g.save();g.translate(x,y);g.rotate(a);
    g.beginPath();g.moveTo(-L,0);g.quadraticCurveTo(-L*0.3,-T*1.6,0,-T);g.quadraticCurveTo(L*0.3,-T*1.6,L,0);g.quadraticCurveTo(L*0.3,T*1.6,0,T);g.quadraticCurveTo(-L*0.3,T*1.6,-L,0);
    g.fillStyle='rgba(222,160,196,0.4)';g.fill();g.strokeStyle='rgba(170,90,140,0.25)';g.lineWidth=0.8;g.stroke();
    g.beginPath();g.ellipse(0,0,L*0.38,T*0.62,0,0,Math.PI*2);g.fillStyle='rgba(125,60,130,0.55)';g.fill();
    g.restore();}
  // leve véu claro para destacar as células do jogo
  g.fillStyle='rgba(255,245,247,0.30)';g.fillRect(0,0,W,H);
}
function paintVesselWall(g,v,R){
  const pts=v.pts;g.lineCap='round';g.lineJoin='round';
  smoothPath(g,pts);g.strokeStyle='rgba(190,70,95,0.16)';g.lineWidth=v.w+5;g.stroke();
  smoothPath(g,pts);g.strokeStyle='rgba(235,120,135,0.22)';g.lineWidth=v.w+1.5;g.stroke();
  smoothPath(g,pts);g.strokeStyle='rgba(255,222,226,0.8)';g.lineWidth=v.w-1.5;g.stroke();
  // núcleos do endotélio
  for(let t=0.02;t<1;t+=0.05){const p=pathPoint(pts,t),side=(R()<0.5?-1:1)*(v.w/2+1);
    g.save();g.translate(p.x-Math.sin(p.ang)*side,p.y+Math.cos(p.ang)*side);g.rotate(p.ang);g.beginPath();g.ellipse(0,0,3.6,1.3,0,0,Math.PI*2);g.fillStyle='rgba(120,45,90,0.3)';g.fill();g.restore();}
}

// ---------- intestino (luz entre vilosidades) ----------
function paintIntestino(g,W,H,R){
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#FCE7CF');bg.addColorStop(0.5,'#FDEBD8');bg.addColorStop(1,'#F8DCBC');g.fillStyle=bg;g.fillRect(0,0,W,H);
  softBlobs(g,W,H,R,12,'rgba(255,250,240,0.45)',60,140);
  // muco
  for(let i=0;i<18;i++){let x=R()*W,y=40+R()*(H-80);g.beginPath();g.moveTo(x,y);for(let k=0;k<10;k++){x+=12+R()*10;y+=(R()-0.5)*14;g.lineTo(x,y);}
    g.strokeStyle='rgba(255,255,255,0.35)';g.lineWidth=2+R()*4;g.lineCap='round';g.lineJoin='round';g.stroke();}
  speckles(g,W,H,R,300,'rgba(190,140,90,0.10)',1.3);
  // vilosidades em cima e embaixo
  for(const side of [0,1]){
    let x=-10;
    while(x<W+20){const w=24+R()*10,h=26+R()*14;paintVillus(g,x+w/2,side?H:0,w,h,side?-1:1,R);x+=w+2+R()*4;}
  }
}
function paintVillus(g,cx,base,w,h,dir,R){
  const tip=base+dir*h;
  const shape=()=>{g.beginPath();g.moveTo(cx-w/2,base-dir*4);g.lineTo(cx-w/2,base+dir*(h-w*0.5));g.quadraticCurveTo(cx-w/2,tip,cx,tip);g.quadraticCurveTo(cx+w/2,tip,cx+w/2,base+dir*(h-w*0.5));g.lineTo(cx+w/2,base-dir*4);g.closePath();};
  shape();const gr=g.createLinearGradient(cx-w/2,0,cx+w/2,0);gr.addColorStop(0,'#E79A86');gr.addColorStop(0.5,'#F6BFA8');gr.addColorStop(1,'#DE8B78');g.fillStyle=gr;g.fill();
  g.strokeStyle='rgba(255,250,245,0.8)';g.lineWidth=1.6;g.stroke(); // borda em escova
  // lâmina própria (miolo)
  g.beginPath();g.ellipse(cx,base+dir*h*0.45,w*0.18,h*0.42,0,0,Math.PI*2);g.fillStyle='rgba(220,120,110,0.35)';g.fill();
  // núcleos dos enterócitos
  for(let k=0;k<5;k++){const yy=base+dir*(6+k*(h-10)/5);for(const sx of [-1,1]){g.beginPath();g.ellipse(cx+sx*w*0.3,yy,1.3,2.4,0,0,Math.PI*2);g.fillStyle='rgba(120,60,120,0.55)';g.fill();}}
  // célula caliciforme
  if(R()<0.7){const yy=base+dir*(h*0.4+R()*h*0.3),sx=R()<0.5?-1:1;g.beginPath();g.ellipse(cx+sx*w*0.28,yy,3,4.2,0,0,Math.PI*2);g.fillStyle='rgba(255,255,248,0.85)';g.fill();g.strokeStyle='rgba(200,150,150,0.4)';g.lineWidth=0.6;g.stroke();}
}

// ---------- pulmão (alvéolos) ----------
function paintPulmao(g,W,H,R){
  g.fillStyle='#EBC3D3';g.fillRect(0,0,W,H); // septos
  // capilares nos septos (hemácias que sobram entre os alvéolos)
  for(let i=0;i<900;i++){g.beginPath();g.ellipse(R()*W,R()*H,2.2,1.4,R()*3,0,Math.PI*2);g.fillStyle='rgba(205,70,90,0.55)';g.fill();}
  const sp=62;const cells=[];
  for(let y=-sp/2;y<H+sp;y+=sp*0.86){for(let x=-sp/2;x<W+sp;x+=sp){const ox=(Math.round(y/(sp*0.86))%2)*sp/2;cells.push({x:x+ox+(R()-0.5)*18,y:y+(R()-0.5)*16,r:sp*0.5-3+(R()-0.5)*6});}}
  for(const c of cells){
    g.beginPath();const n=18;for(let k=0;k<=n;k++){const a=k/n*Math.PI*2,rr=c.r*(1+Math.sin(a*3+c.x)*0.05+Math.cos(a*2+c.y)*0.04);const px=c.x+Math.cos(a)*rr,py=c.y+Math.sin(a)*rr;k?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();
    const gr=g.createRadialGradient(c.x-c.r*0.3,c.y-c.r*0.3,2,c.x,c.y,c.r);gr.addColorStop(0,'#F7FBFF');gr.addColorStop(0.8,'#E6F0FB');gr.addColorStop(1,'#D9E3F2');g.fillStyle=gr;g.fill();
    g.strokeStyle='rgba(200,120,150,0.45)';g.lineWidth=1;g.stroke();
    // pneumócitos tipo I (núcleos achatados) e tipo II (cuboides)
    for(let k=0;k<2;k++){const a=R()*Math.PI*2;g.save();g.translate(c.x+Math.cos(a)*(c.r-1.5),c.y+Math.sin(a)*(c.r-1.5));g.rotate(a+Math.PI/2);g.beginPath();g.ellipse(0,0,3.8,1.2,0,0,Math.PI*2);g.fillStyle='rgba(110,50,110,0.55)';g.fill();g.restore();}
    if(R()<0.35){const a=R()*Math.PI*2,px=c.x+Math.cos(a)*(c.r-4),py=c.y+Math.sin(a)*(c.r-4);g.beginPath();g.arc(px,py,4.2,0,Math.PI*2);g.fillStyle='rgba(215,170,215,0.9)';g.fill();g.beginPath();g.arc(px,py,1.6,0,Math.PI*2);g.fillStyle='rgba(110,50,120,0.7)';g.fill();}
  }
  g.fillStyle='rgba(240,246,255,0.22)';g.fillRect(0,0,W,H);
}

// ---------- epitélio com foco de displasia (fase do tumor) ----------
function paintEpitelio(g,W,H,R){
  g.fillStyle='#E9C6DA';g.fillRect(0,0,W,H);
  const sp=24;
  for(let y=-sp;y<H+sp;y+=sp*0.87){const row=Math.round(y/(sp*0.87));
    for(let x=-sp;x<W+sp;x+=sp){
      const cx=x+(row%2)*sp/2+(R()-0.5)*5,cy=y+(R()-0.5)*5;
      const tum=clamp((cx/W-0.55)/0.3,0,1)*(0.6+R()*0.4); // grau de atipia rumo à direita
      const r=sp*0.55*(1+tum*(R()-0.3)*0.5);
      g.beginPath();for(let k=0;k<6;k++){const a=k/6*Math.PI*2+Math.PI/6+(R()-0.5)*0.2;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;k?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();
      const base=tum>0.35?'#F1D3E6':'#F8E3EE';const gr=g.createRadialGradient(cx-r*0.3,cy-r*0.3,1,cx,cy,r);gr.addColorStop(0,'#FFF7FB');gr.addColorStop(0.6,base);gr.addColorStop(1,tum>0.35?'#E0B6D2':'#EDCFE0');
      g.fillStyle=gr;g.fill();g.strokeStyle='rgba(170,110,150,0.28)';g.lineWidth=0.9;g.stroke();
      const nr=3.6+tum*(2.5+R()*3);const nx=cx+(R()-0.5)*tum*6,ny=cy+(R()-0.5)*tum*6;
      g.beginPath();g.ellipse(nx,ny,nr,nr*(0.8+R()*0.3),R()*3,0,Math.PI*2);g.fillStyle=tum>0.35?'rgba(120,70,140,0.38)':'rgba(140,95,160,0.24)';g.fill();
      if(tum>0.5){g.beginPath();g.arc(nx+1,ny-1,1.2+R(),0,Math.PI*2);g.fillStyle='rgba(70,30,90,0.35)';g.fill();}
    }}
  g.fillStyle='rgba(255,244,250,0.30)';g.fillRect(0,0,W,H);
}

// ---------- camada animada + zonas ----------
function drawBG(){
  ensureBG();
  const scene=LEVELS[level].scene;
  if(scene==='pulmao'){const b=1+Math.sin(frame*0.02)*0.006;ctx.save();ctx.translate(GW/2,FIELD_H/2);ctx.scale(b,b);ctx.drawImage(bgCanvas,-GW/2,-FIELD_H/2,GW,FIELD_H);ctx.restore();}
  else ctx.drawImage(bgCanvas,0,0,GW,FIELD_H);
  // hemácias circulando nos capilares
  for(const v of vessels){for(const c of v.rbc){if(state==='playing')c.t=(c.t+c.sp)%1;const p=pathPoint(v.pts,c.t);
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang+Math.PI/2);ctx.beginPath();ctx.ellipse(0,0,v.w*0.36,v.w*0.2,0,0,Math.PI*2);ctx.fillStyle='rgba(206,52,70,0.5)';ctx.fill();
    ctx.beginPath();ctx.ellipse(0,0,v.w*0.16,v.w*0.08,0,0,Math.PI*2);ctx.fillStyle='rgba(245,130,140,0.6)';ctx.fill();ctx.restore();}}
  // partículas em suspensão
  const pc=scene==='intestino'?'255,246,225':scene==='pulmao'?'200,220,255':'255,235,240';
  for(const bp of bgParticles){if(state==='playing'){bp.x+=bp.vx;bp.y+=bp.vy;bp.phase+=0.02;if(bp.x<-10)bp.x=GW+10;if(bp.x>GW+10)bp.x=-10;if(bp.y<-10)bp.y=FIELD_H+10;if(bp.y>FIELD_H+10)bp.y=-10;}
    ctx.beginPath();ctx.arc(bp.x,bp.y,bp.r,0,Math.PI*2);ctx.fillStyle='rgba('+pc+','+(bp.alpha*(0.7+Math.sin(bp.phase)*0.3)*2.2)+')';ctx.fill();}
  drawBaseZone();drawDangerZone();
}

function drawBaseZone(){
  const hpR=clamp(tissueHP/100,0,1);
  const grd=ctx.createLinearGradient(0,0,BASE_X+30,0);
  grd.addColorStop(0,'rgba(60,200,120,'+(0.28*hpR+0.05)+')');grd.addColorStop(0.8,'rgba(60,200,120,0.06)');grd.addColorStop(1,'rgba(60,200,120,0)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,BASE_X+30,FIELD_H);
  // parede de células saudáveis (escurecem conforme o tecido é lesado)
  const rows=Math.ceil(FIELD_H/24);
  for(let c=0;c<2;c++){for(let r=0;r<rows;r++){
    const x=10+c*28+(r%2)*6,y=r*24+4+(c?12:0);if(y>FIELD_H-8)continue;
    const dmg=clamp(1-hpR*1.15+((r*7+c*3)%5)*0.06,0,1);
    const hit=baseHitFlash>0?Math.max(0,baseHitFlash/30)*0.6:0;
    const col=dmg>0.7?'#9E6A72':dmg>0.4?'#E59AA6':'#F6C7D2';
    ctx.beginPath();rr(ctx,x,y,24,20,7);const g=ctx.createLinearGradient(x,y,x,y+20);g.addColorStop(0,shade(col,24));g.addColorStop(1,col);ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle=hit?'rgba(255,60,60,'+(0.5+hit)+')':'rgba(80,170,110,'+(0.25+0.4*hpR)+')';ctx.lineWidth=1.2;ctx.stroke();
    ctx.beginPath();ctx.arc(x+12,y+10,4,0,Math.PI*2);ctx.fillStyle=dmg>0.7?'rgba(70,30,40,0.6)':'rgba(125,65,140,0.55)';ctx.fill();
  }}
  if(baseHitFlash>0){ctx.fillStyle='rgba(255,40,40,'+(baseHitFlash/30*0.25)+')';ctx.fillRect(0,0,BASE_X,FIELD_H);}
  const pulse=0.35+Math.sin(frame*0.05)*0.15;
  ctx.strokeStyle='rgba(60,190,110,'+pulse+')';ctx.lineWidth=2;ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(BASE_X,0);ctx.lineTo(BASE_X,FIELD_H);ctx.stroke();ctx.setLineDash([]);
  ctx.save();ctx.font=font(11,700);ctx.textAlign='center';ctx.textBaseline='middle';ctx.translate(BASE_X-8,FIELD_H/2);ctx.rotate(-Math.PI/2);
  outlined('TECIDO SAUDÁVEL',0,0,'rgba(255,255,255,0.9)','rgba(30,110,70,0.55)',3);ctx.restore();
}

function drawDangerZone(){
  const grd2=ctx.createLinearGradient(GW,0,GW-90,0);
  grd2.addColorStop(0,'rgba(200,30,60,0.20)');grd2.addColorStop(1,'rgba(200,30,60,0)');
  ctx.fillStyle=grd2;ctx.fillRect(GW-90,0,90,FIELD_H);
  ctx.fillStyle='rgba(200,30,60,0.35)';
  for(let i=0;i<5;i++){const y=FIELD_H*(i+0.5)/5,x=GW-14-((frame*0.6+i*13)%26);ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x-7,y);ctx.lineTo(x,y+5);ctx.closePath();ctx.fill();}
}

// =====================================================================
//  DESENHO das entidades (células com sprites, patógenos em estilo "gel")
// =====================================================================
const RES=3; // resolução dos caches de inimigos (px por unidade lógica)
const ECACHE={};
function cached(key,w,h,paint){
  if(ECACHE[key])return ECACHE[key];
  const c=makeCanvas(w*RES,h*RES),g=c.getContext('2d');g.setTransform(RES,0,0,RES,w*RES/2,h*RES/2);paint(g,false);
  const wc=makeCanvas(w*RES,h*RES),wg=wc.getContext('2d');wg.drawImage(c,0,0);wg.globalCompositeOperation='source-in';wg.fillStyle='#fff';wg.fillRect(0,0,wc.width,wc.height);
  return ECACHE[key]={img:c,white:wc,w,h};
}
function drawCached(o,x,y,alpha=1,white=0){
  const pa=ctx.globalAlpha;
  ctx.globalAlpha=pa*alpha;ctx.drawImage(o.img,x-o.w/2,y-o.h/2,o.w,o.h);
  if(white>0){ctx.globalAlpha=pa*alpha*white;ctx.drawImage(o.white,x-o.w/2,y-o.h/2,o.w,o.h);}
  ctx.globalAlpha=pa;
}
// brilho especular padrão (luz vinda de cima-esquerda, como nas ilustrações)
function gloss(g,x,y,rx,ry,a=0.55){
  const gr=g.createRadialGradient(x,y,0,x,y,Math.max(rx,ry));gr.addColorStop(0,'rgba(255,255,255,'+a+')');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.save();g.translate(x,y);g.scale(1,ry/rx);g.translate(-x,-y);g.beginPath();g.arc(x,y,rx,0,Math.PI*2);g.fillStyle=gr;g.fill();g.restore();
}
function blobPath(g,r,n,amp,seed,phase=0){
  g.beginPath();
  for(let k=0;k<=n;k++){const a=k/n*Math.PI*2;const rr=r*(1+amp*(Math.sin(a*3+seed)*0.6+Math.sin(a*5+seed*1.7+phase)*0.4));const x=Math.cos(a)*rr,y=Math.sin(a)*rr;k?g.lineTo(x,y):g.moveTo(x,y);}
  g.closePath();
}

// ---------- sprites de inimigos em cache ----------
function bacteriaSprite(len){
  const L=Math.round(len*10)/10;const r=ENEMIES.BACTERIA.r;const w=r*1.3,l=r*L*1.05;
  return cached('bact'+L,l+8,w+8,g=>{
    g.beginPath();rr(g,-l/2,-w/2,l,w,w/2);
    const gr=g.createLinearGradient(0,-w/2,0,w/2);gr.addColorStop(0,'#B8F5A2');gr.addColorStop(0.45,'#6CCB5F');gr.addColorStop(1,'#2F7A2A');
    g.fillStyle=gr;g.fill();g.strokeStyle='#2A6A26';g.lineWidth=1;g.stroke();
    g.beginPath();g.moveTo(-l*0.28,0);g.lineTo(l*0.28,0);g.strokeStyle='rgba(30,90,30,0.28)';g.lineWidth=w*0.28;g.lineCap='round';g.stroke();
    gloss(g,-l*0.12,-w*0.2,l*0.32,w*0.14,0.75);
  });
}
function biofilmSprite(){
  const r=ENEMIES.BIOFILME.r,S=(r+16)*2;
  return cached('biofilm',S,S,g=>{
    const R=mulberry(77);
    blobPath(g,r+11,40,0.12,2.3);g.fillStyle='rgba(205,240,180,0.40)';g.fill();g.strokeStyle='rgba(120,170,90,0.35)';g.lineWidth=1;g.stroke();
    blobPath(g,r,40,0.10,5.1);
    const gr=g.createRadialGradient(-r*0.35,-r*0.4,2,0,0,r*1.1);gr.addColorStop(0,'#C4E8A4');gr.addColorStop(0.45,'#7DB35E');gr.addColorStop(1,'#35602A');
    g.fillStyle=gr;g.fill();g.strokeStyle='rgba(40,80,30,0.8)';g.lineWidth=1.5;g.stroke();
    for(let i=0;i<22;i++){const a=R()*Math.PI*2,d=R()*r*0.82,x=Math.cos(a)*d,y=Math.sin(a)*d,ang=R()*Math.PI,l=6+R()*3;
      g.save();g.translate(x,y);g.rotate(ang);g.beginPath();rr(g,-l/2,-2,l,4,2);g.fillStyle='rgba(120,210,100,0.85)';g.fill();g.strokeStyle='rgba(30,80,30,0.6)';g.lineWidth=0.6;g.stroke();g.restore();}
    for(let i=0;i<7;i++){const a=R()*Math.PI*2,d=R()*r*0.8;g.beginPath();g.arc(Math.cos(a)*d,Math.sin(a)*d,1.5+R()*2.5,0,Math.PI*2);g.fillStyle='rgba(255,255,255,0.28)';g.fill();g.strokeStyle='rgba(255,255,255,0.5)';g.lineWidth=0.5;g.stroke();}
    gloss(g,-r*0.35,-r*0.45,r*0.55,r*0.28,0.6);
  });
}

// ---------- NETs ----------
function drawNets(){
  for(const n of nets){
    const lr=clamp(n.life/n.maxLife,0,1),alpha=Math.min(1,lr*1.6);
    ctx.save();ctx.translate(n.x+shakeX,n.y+shakeY);
    const gl=ctx.createRadialGradient(0,0,0,0,0,n.r*1.25);gl.addColorStop(0,'rgba(140,190,255,'+alpha*0.22+')');gl.addColorStop(1,'rgba(140,190,255,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,n.r*1.25,0,Math.PI*2);ctx.fill();
    ctx.lineCap='round';
    for(const s of n.strands){const wob=Math.sin(frame*0.04+s.ph)*2.5;
      ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.quadraticCurveTo(s.cx+wob,s.cy-wob,s.x2,s.y2);
      ctx.strokeStyle='rgba(205,228,255,'+alpha*0.75+')';ctx.lineWidth=1.1;ctx.stroke();
      ctx.beginPath();ctx.arc((s.x1+s.x2)/2*0.5+s.cx*0.5,(s.y1+s.y2)/2*0.5+s.cy*0.5,1.5,0,Math.PI*2);ctx.fillStyle='rgba(120,170,255,'+alpha*0.8+')';ctx.fill();}
    ctx.beginPath();ctx.arc(0,0,n.r,0,Math.PI*2);ctx.strokeStyle='rgba(150,200,255,'+alpha*0.35+')';ctx.lineWidth=1;ctx.setLineDash([2,4]);ctx.stroke();ctx.setLineDash([]);
    ctx.restore();
  }
}

// ---------- células do jogador ----------
function allySprite(a){const cfg=UNITS[a.type];const plasma=a.type==='LINFOB'&&a.differentiated;return {key:plasma?cfg.sprPlasma:cfg.spr,size:(plasma?cfg.ssPlasma*12:cfg.ss*cfg.r)};}
const NO_MORPH=new Set(['NEUTRO']);
function drawAlly(a){
  const cfg=UNITS[a.type];const {key,size}=allySprite(a);
  const plasma=a.type==='LINFOB'&&a.differentiated;
  const lx=a.lunge>0?a.lungeX*a.lunge*0.55:0,ly=a.lunge>0?a.lungeY*a.lunge*0.55:0;
  const x=a.x+shakeX+lx,y=a.y+shakeY+ly;
  let pop=1;if(a.spawnAnim>0){const t=1-a.spawnAnim/18;pop=1+Math.sin(t*Math.PI)*0.25-(1-t)*0.5;}
  const sp=Math.hypot(a.vx,a.vy),ang=Math.atan2(a.vy,a.vx);
  const st=Math.min(0.13,sp*0.05),br=Math.sin(a.wobble*0.8)*0.025;
  const sel=selAlly===a;
  // anel de seleção e área de patrulha
  if(sel){
    ctx.beginPath();ctx.arc(a.hx,a.hy,(a.spd>0?LEASH:0)+a.range,0,Math.PI*2);ctx.fillStyle=rgba(cfg.col,0.08);ctx.fill();ctx.strokeStyle=rgba(cfg.col,0.5);ctx.lineWidth=1;ctx.setLineDash([4,5]);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.ellipse(x,y+a.r*0.55,a.r*1.45,a.r*0.62,0,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2;ctx.stroke();
  }
  ctx.save();ctx.translate(x,y);
  // sombra
  ctx.save();ctx.translate(2,4);ctx.scale(1,0.92);drawSpr(key,a.v,0,0,size*pop,0.22,'black');ctx.restore();
  // auras de citocinas
  const cp=0.5+Math.sin(frame*0.12+a.wobble)*0.5;
  if(isCytoActive('IFNG')){const k=a.type==='MACRO'?1:0.5;ctx.beginPath();ctx.arc(0,0,a.r+5+cp*2,0,Math.PI*2);ctx.strokeStyle='rgba(255,216,74,'+(0.35+cp*0.25)*k+')';ctx.lineWidth=a.type==='MACRO'?2.2:1.2;ctx.stroke();}
  if(isCytoActive('IL5')&&a.type==='EOSINO'){ctx.beginPath();ctx.arc(0,0,a.r+6+cp*2,0,Math.PI*2);ctx.strokeStyle='rgba(255,159,90,'+(0.45+cp*0.3)+')';ctx.lineWidth=2;ctx.stroke();}
  if(isCytoActive('IL2')&&(a.type==='TCITO'||a.type==='NK'||a.type==='LINFOB')&&frame%24<12){ctx.fillStyle='rgba(80,230,140,0.8)';ctx.font=font(8,700);ctx.textAlign='center';ctx.fillText('+',a.r*0.9,-a.r*0.9-((frame%24)*0.5));}
  // contorno dourado de upgrade
  if(a.lvl>1){const p=0.5+Math.sin(frame*0.08+a.wobble)*0.5;drawSpr(key,a.v,0,0,size*pop*1.12,0.35+p*0.2,'gold');}
  ctx.rotate(ang);ctx.scale((1+st+br)*pop,(1-st*0.6-br)*pop);ctx.rotate(-ang);
  ctx.rotate(Math.sin(a.wobble*0.45+a.pseudoPhase)*(a.type==='NEUTRO'?0.12:0.05));
  if(a.morph>0&&!plasma&&!NO_MORPH.has(a.type)){const m=a.morph;drawSpr(key,a.v,0,0,size,1-m*m);drawSpr(key,a.v2,0,0,size,m);}
  else drawSpr(key,a.v,0,0,size,1);
  // fagossomos: bactérias sendo digeridas dentro do macrófago
  for(const ph of a.phagosomes){const t=ph.life/170;const px=Math.cos(ph.ang)*ph.d,py=Math.sin(ph.ang)*ph.d;
    ctx.beginPath();ctx.arc(px,py,3.6,0,Math.PI*2);ctx.fillStyle='rgba(70,40,110,'+0.35*t+')';ctx.fill();
    ctx.save();ctx.translate(px,py);ctx.rotate(ph.ang);ctx.beginPath();rr(ctx,-2.6*t,-1.1*t,5.2*t,2.2*t,1.1*t);ctx.fillStyle='rgba(90,170,80,'+0.8*t+')';ctx.fill();ctx.restore();}
  if(a.flash>0){drawSpr(key,a.v,0,0,size,0.65,'white');}
  ctx.restore();
  // bactéria sendo engolida
  if(a.phago){const t=1-a.phago.t/22;const ex=lerp(a.phago.x,a.x,easeOut(t)),ey=lerp(a.phago.y,a.y,easeOut(t));
    drawCached(bacteriaSprite(2),ex+shakeX,ey+shakeY,1-t*0.8);}
  // anel de diferenciação B -> plasmócito
  if(a.type==='LINFOB'&&!a.differentiated){const prog=1-a.diffTimer/a.diffMax;ctx.beginPath();ctx.arc(x,y,a.r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*prog);ctx.strokeStyle='#9FF2D2';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke();ctx.lineCap='butt';}
  // barra de vida
  const topY=y-size*0.36;
  if(a.hp<a.maxHp){const bw=Math.max(18,a.r*2.1),bh=3.2,by=topY-6;ctx.fillStyle='rgba(20,10,30,0.6)';ctx.beginPath();rr(ctx,x-bw/2-1,by-1,bw+2,bh+2,2);ctx.fill();
    const hr=clamp(a.hp/a.maxHp,0,1);ctx.fillStyle=hr>0.5?'#4BE38A':hr>0.25?'#FFC93C':'#FF4D5E';ctx.beginPath();rr(ctx,x-bw/2,by,bw*hr,bh,1.6);ctx.fill();}
  if(a.lvl>1){ctx.font=font(9,700);ctx.textAlign='center';ctx.textBaseline='middle';outlined('▲',x+a.r*0.95,y-a.r*0.95,'#FFE27A','rgba(80,50,0,0.7)',2.5);}
  if(a.memoryCell&&!a.differentiated){ctx.font=font(8,700);ctx.textAlign='center';ctx.textBaseline='middle';outlined('memória',x,y+a.r+9,'#BFE6FF','rgba(10,40,80,0.7)',2.5);}
}

// ---------- patógenos ----------
function drawOpso(e){ // anticorpos grudados (opsonização)
  const n=5,al=clamp(e.opso/120,0,1);ctx.strokeStyle='rgba(255,226,90,'+(0.9*al)+')';ctx.lineWidth=1.3;ctx.lineCap='round';
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+frame*0.01+e.phaseOff;const R=e.r*(e.type==='BACTERIA'?1.1:1)+2;
    ctx.save();ctx.rotate(a);ctx.translate(R,0);ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(0.5,0);ctx.moveTo(0.5,0);ctx.lineTo(-2,-2.4);ctx.moveTo(0.5,0);ctx.lineTo(-2,2.4);ctx.stroke();ctx.restore();}
}
const EVIS={BACTERIA:1.3,METASTASE:1.3,ENTAMOEBA:1.15};
function visR(e){return e.r*(EVIS[e.type]||1);}
function hpBarEnemy(e,x,y){
  const cfg=ENEMIES[e.type];
  if(cfg.big){const bw=e.r*2.8,bh=5,by=y-e.r-16;
    ctx.fillStyle='rgba(20,10,30,0.65)';ctx.beginPath();rr(ctx,x-bw/2-1,by-1,bw+2,bh+2,3);ctx.fill();
    ctx.fillStyle='#FF5A6E';ctx.beginPath();rr(ctx,x-bw/2,by,bw*clamp(e.hp/e.maxHp,0,1),bh,2.5);ctx.fill();
    ctx.font=font(10,700);ctx.textAlign='center';ctx.textBaseline='bottom';outlined(cfg.name+(e.mutated?' (mutado)':''),x,by-2,'#FFF','rgba(60,10,30,0.7)',3);}
  else if(e.hp<e.maxHp){const vr=visR(e),bw=Math.max(16,vr*2),by=y-vr-7;ctx.fillStyle='rgba(20,10,30,0.55)';ctx.fillRect(x-bw/2,by,bw,3);ctx.fillStyle='#FF5A6E';ctx.fillRect(x-bw/2,by,bw*clamp(e.hp/e.maxHp,0,1),3);}
}
function drawEnemy(e,noBar){
  const x=e.x+shakeX,y=e.y+shakeY;const fl=e.flash>0?0.7:0;
  const sIn=e.spawnIn>0?1-e.spawnIn/18:1;
  ctx.save();ctx.translate(x,y);if(sIn<1){ctx.globalAlpha=sIn;ctx.scale(0.4+0.6*sIn,0.4+0.6*sIn);}
  const ev=EVIS[e.type]||1;if(ev!==1)ctx.scale(ev,ev);
  // sombra
  if(e.type!=='HELMINTO'){ctx.beginPath();ctx.ellipse(2,e.r*0.75+2,e.r*1.1,e.r*0.35,0,0,Math.PI*2);ctx.fillStyle='rgba(60,0,30,0.12)';ctx.fill();}
  if(e.type==='BACTERIA'){
    ctx.rotate(e.rot);
    const spr=bacteriaSprite(e.len);const half=spr.w/2-4;
    ctx.strokeStyle='rgba(60,140,60,0.55)';ctx.lineWidth=0.9;ctx.lineCap='round';
    for(const f of e.flagella){const bx=half-2,by=f.a*3;ctx.beginPath();ctx.moveTo(bx,by);
      for(let k=1;k<=6;k++){const t=k/6;ctx.lineTo(bx+t*f.len,by+Math.sin(frame*0.35+f.phase+t*5)*2.4*t+f.a*t*6);}ctx.stroke();}
    drawCached(spr,0,0,1,fl);
    if(e.opso>0){ctx.rotate(-e.rot);drawOpso(e);}
  } else if(e.type==='BIOFILME'){
    const p=1+Math.sin(e.wobble*0.6)*0.025+(e.pulse>0?e.pulse/16*0.08:0);ctx.scale(p,1/p*1.0+0.0);
    drawCached(biofilmSprite(),0,0,1,fl);
    if(e.opso>0)drawOpso(e);
  } else if(HELMINTHS.has(e.type)){
    ctx.restore();ctx.save();drawHelminth(e,fl);
  } else if(e.type==='ENTAMOEBA'){
    drawAmoeba(e,fl);if(e.opso>0)drawOpso(e);
  } else if(e.type==='TUMOR'||e.type==='METASTASE'){
    drawTumor(e,fl);if(e.opso>0)drawOpso(e);
  }
  ctx.restore();
  if(!noBar)hpBarEnemy(e,x,y);
}

function drawHelminth(e,fl){
  const segs=e.segments,n=segs.length;const sx=shakeX,sy=shakeY;
  const W=i=>e.r*(0.95-0.55*Math.pow(i/(n-1),1.4));
  // sombra
  ctx.fillStyle='rgba(60,20,0,0.10)';for(let i=n-1;i>=0;i-=2){ctx.beginPath();ctx.ellipse(segs[i].x+sx+3,segs[i].y+sy+W(i)*0.7,W(i),W(i)*0.4,0,0,Math.PI*2);ctx.fill();}
  for(let i=n-1;i>=0;i--){const s=segs[i],r=W(i),x=s.x+sx,y=s.y+sy;
    const gr=ctx.createRadialGradient(x-r*0.35,y-r*0.45,1,x,y,r);gr.addColorStop(0,'#FFF1E2');gr.addColorStop(0.55,'#EBC7A4');gr.addColorStop(1,'#B98561');
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();
    // anelações
    ctx.beginPath();ctx.arc(x+r*0.15,y,r*0.95,-1.1,1.1);ctx.strokeStyle='rgba(150,100,70,0.35)';ctx.lineWidth=0.8;ctx.stroke();
    if(fl){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+fl*0.6+')';ctx.fill();}
  }
  // cabeça com três lábios
  const hx=e.x+sx,hy=e.y+sy,r=e.r;
  const gr=ctx.createRadialGradient(hx-r*0.35,hy-r*0.4,2,hx,hy,r);gr.addColorStop(0,'#FFF4E8');gr.addColorStop(0.5,'#EFCDAC');gr.addColorStop(1,'#B98561');
  if(e.type==='HELMINTO')for(const a of [-0.75,0,0.75]){ctx.beginPath();ctx.arc(hx-r*0.78+Math.abs(a)*r*0.25,hy+Math.sin(a)*r*0.62,r*0.36,0,Math.PI*2);ctx.fillStyle='#E7BD97';ctx.fill();ctx.strokeStyle='rgba(150,95,60,0.6)';ctx.lineWidth=1;ctx.stroke();}
  ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle='rgba(150,95,60,0.7)';ctx.lineWidth=1.2;ctx.stroke();
  gloss(ctx,hx-r*0.3,hy-r*0.45,r*0.45,r*0.22,0.7);
  ctx.beginPath();ctx.arc(hx-r*0.95,hy,2.2,0,Math.PI*2);ctx.fillStyle='rgba(90,40,30,0.7)';ctx.fill();
  if(fl){ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+fl*0.6+')';ctx.fill();}
  if(e.opso>0){ctx.save();ctx.translate(hx,hy);drawOpso(e);ctx.restore();}
}

function drawAmoeba(e,fl){
  const r=e.r,ph=e.pseudoPhase||0;
  if(!e.gran){const R=mulberry(e.seed);e.gran=Array.from({length:16},()=>({a:R()*6.28,d:R()*0.7}));e.rbcs=Array.from({length:6},(_,i)=>({a:Math.PI*0.55+i*0.55+R()*0.3,d:0.3+R()*0.3,rot:R()*3}));}
  const shape=(s,amp)=>{ctx.beginPath();for(let k=0;k<=28;k++){const a=k/28*Math.PI*2;
    const lead=Math.max(0,Math.cos(a-Math.PI))*0.28; // pseudópode para a frente (esquerda)
    const rr_=r*s*(1+lead*(0.6+Math.sin(ph*2)*0.4)+amp*(Math.sin(a*3+ph*2+e.phaseOff)*0.6+Math.sin(a*5-ph*3)*0.4));
    const x=Math.cos(a)*rr_,y=Math.sin(a)*rr_;k?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();};
  shape(1.12,0.12);ctx.fillStyle='rgba(226,208,180,0.85)';ctx.fill();ctx.strokeStyle='rgba(105,78,48,0.85)';ctx.lineWidth=1.4;ctx.stroke(); // ectoplasma
  shape(0.8,0.1);const gr=ctx.createRadialGradient(-r*0.3,-r*0.35,1,0,0,r);gr.addColorStop(0,'#F3E3C8');gr.addColorStop(0.6,'#C9AC84');gr.addColorStop(1,'#8E7050');ctx.fillStyle=gr;ctx.fill();
  ctx.fillStyle='rgba(120,95,60,0.35)';for(const g of e.gran){ctx.beginPath();ctx.arc(Math.cos(g.a+ph*0.2)*g.d*r,Math.sin(g.a+ph*0.2)*g.d*r,1,0,Math.PI*2);ctx.fill();}
  // hemácias fagocitadas (marca da E. histolytica invasiva)
  for(let i=0;i<Math.min(e.ingested,e.rbcs.length);i++){const b=e.rbcs[i];ctx.save();ctx.translate(Math.cos(b.a)*b.d*r,Math.sin(b.a)*b.d*r);ctx.rotate(b.rot);ctx.beginPath();ctx.ellipse(0,0,2.6,1.9,0,0,Math.PI*2);ctx.fillStyle='rgba(205,55,70,0.85)';ctx.fill();ctx.beginPath();ctx.ellipse(0,0,1.1,0.7,0,0,Math.PI*2);ctx.fillStyle='rgba(250,140,150,0.8)';ctx.fill();ctx.restore();}
  // núcleo com cariossomo central
  const nx=r*0.38,ny=r*0.28,nr=r*0.2;
  ctx.beginPath();ctx.arc(nx,ny,nr,0,Math.PI*2);ctx.fillStyle='rgba(236,226,208,0.55)';ctx.fill();
  ctx.fillStyle='rgba(95,70,45,0.55)';for(let k=0;k<9;k++){const a=k/9*Math.PI*2;ctx.beginPath();ctx.arc(nx+Math.cos(a)*nr,ny+Math.sin(a)*nr,0.7,0,Math.PI*2);ctx.fill();}
  ctx.beginPath();ctx.arc(nx,ny,0.9,0,Math.PI*2);ctx.fillStyle='rgba(80,55,30,0.7)';ctx.fill();
  gloss(ctx,-r*0.35,-r*0.45,r*0.45,r*0.2,0.6);
  if(fl){shape(1.12,0.12);ctx.fillStyle='rgba(255,255,255,'+fl*0.55+')';ctx.fill();}
}

function drawTumor(e,fl){
  const big=e.type==='TUMOR',r=e.r*(big&&e.pulse>0?1+e.pulse/16*0.06:1);
  const blocked=isCytoActive('ANTIPDL1');
  const body=e.mutated?['#D2A6E6','#8E56B0','#4A2466']:big?['#E6C4F2','#A06CC0','#5B3478']:['#EBD2F5','#B58AD0','#6B4488'];
  // PD-L1 na superfície (pirulitos azuis); com anti-PD-L1 recebem um "boné" de anticorpo
  const nP=big?16:6;
  for(let i=0;i<nP;i++){const a=i/nP*Math.PI*2+e.phaseOff+Math.sin(e.wobble*0.5+i)*0.05;const r0=r*0.92,r1=r+(big?6:4);
    const x0=Math.cos(a)*r0,y0=Math.sin(a)*r0,x1=Math.cos(a)*r1,y1=Math.sin(a)*r1;
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.strokeStyle='rgba(60,90,170,0.8)';ctx.lineWidth=1.1;ctx.stroke();
    ctx.beginPath();ctx.arc(x1,y1,big?2.1:1.6,0,Math.PI*2);ctx.fillStyle=blocked?'rgba(120,140,190,0.6)':'#6FA8FF';ctx.fill();
    if(blocked){ctx.save();ctx.translate(x1,y1);ctx.rotate(a);ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(2,0);ctx.lineTo(0,-2);ctx.moveTo(2,0);ctx.lineTo(0,2);ctx.strokeStyle='#FF6F91';ctx.lineWidth=1.3;ctx.lineCap='round';ctx.stroke();ctx.restore();}
  }
  blobPath(ctx,r,34,e.mutated?0.13:0.08,e.seed%100,e.wobble*0.3);
  const gr=ctx.createRadialGradient(-r*0.35,-r*0.4,1,0,0,r*1.05);gr.addColorStop(0,body[0]);gr.addColorStop(0.55,body[1]);gr.addColorStop(1,body[2]);
  ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle=body[2];ctx.lineWidth=1.4;ctx.stroke();
  // núcleo grande e irregular com nucléolos evidentes
  blobPath(ctx,r*0.5,20,0.12,(e.seed%50)+3);ctx.fillStyle='rgba(60,25,90,0.55)';ctx.fill();
  ctx.fillStyle='rgba(30,5,50,0.75)';for(let k=0;k<(big?3:1);k++){ctx.beginPath();ctx.arc(Math.cos(k*2.1+e.seed)*r*0.2,Math.sin(k*2.1+e.seed)*r*0.18,big?2.4:1.5,0,Math.PI*2);ctx.fill();}
  gloss(ctx,-r*0.35,-r*0.45,r*0.45,r*0.22,0.65);
  if(fl){blobPath(ctx,r,34,0.08,e.seed%100,e.wobble*0.3);ctx.fillStyle='rgba(255,255,255,'+fl*0.55+')';ctx.fill();}
}

// ---------- IL-13: muco que varre os vermes ("weep and sweep") ----------
function drawMucus(){
  const c=activeCytokines.find(c=>c.key==='IL13');if(!c)return;
  const k=Math.min(1,c.timer/60,(CYTOKINES.IL13.duration-c.timer)/30);
  ctx.save();ctx.lineCap='round';
  for(let i=0;i<14;i++){const y=30+i*(FIELD_H-60)/13,off=(frame*1.2+i*57)%(GW+200)-100;
    ctx.beginPath();for(let x=-40;x<=160;x+=10){const xx=off+x,yy=y+Math.sin((xx+i*30)*0.04+frame*0.05)*5;x===-40?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy);}
    ctx.strokeStyle='rgba(235,250,255,'+(0.35*k)+')';ctx.lineWidth=5+(i%3)*2;ctx.stroke();}
  ctx.restore();
}

// ---------- projéteis: anticorpos em forma de Y ----------
function drawProjectiles(){
  for(const p of projectiles){
    for(let i=0;i<p.trail.length;i++){const t=p.trail[i],k=i/p.trail.length;ctx.beginPath();ctx.arc(t.x+shakeX,t.y+shakeY,1.6*k,0,Math.PI*2);ctx.fillStyle='rgba(255,230,110,'+k*0.45+')';ctx.fill();}
    ctx.save();ctx.translate(p.x+shakeX,p.y+shakeY);
    const gl=ctx.createRadialGradient(0,0,0,0,0,8);gl.addColorStop(0,'rgba(255,240,150,0.55)');gl.addColorStop(1,'rgba(255,240,150,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
    ctx.rotate(p.rot+Math.PI);ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(0.5,0);ctx.moveTo(0.5,0);ctx.lineTo(4.5,-3.8);ctx.moveTo(0.5,0);ctx.lineTo(4.5,3.8);
    ctx.strokeStyle='#8A6A00';ctx.lineWidth=3.4;ctx.stroke();ctx.strokeStyle='#FFE66B';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }
}

// ---------- efeitos ----------
function drawEffects(){
  for(const ef of effects){
    const x=ef.x+shakeX,y=ef.y+shakeY;
    if(ef.type==='degran'){const prog=1-ef.life/22,r=ef.maxR*easeOut(prog);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle='rgba(255,160,80,'+(1-prog)*0.6+')';ctx.lineWidth=4*(1-prog)+0.5;ctx.stroke();ctx.fillStyle='rgba(255,190,110,'+(1-prog)*0.12+')';ctx.fill();}
    else if(ef.type==='hit'){const prog=1-ef.life/9;ctx.save();ctx.translate(x,y);ctx.rotate(prog);ctx.strokeStyle='rgba(255,255,255,'+(1-prog)*0.9+')';ctx.lineWidth=1.5;for(let k=0;k<4;k++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(2+prog*3,0);ctx.lineTo(5+prog*6,0);ctx.stroke();}ctx.restore();}
    else if(ef.type==='killBurst'){const prog=1-ef.life/22,R=(ef.big?20:8)+prog*(ef.big?50:22);ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.strokeStyle=rgba(ef.col,(1-prog)*0.6);ctx.lineWidth=(ef.big?4:2)*(1-prog)+0.3;ctx.stroke();}
    else if(ef.type==='death'){const prog=1-ef.life/20,r=8+prog*20;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle=rgba(ef.col,(1-prog)*0.4);ctx.lineWidth=2;ctx.stroke();}
    else if(ef.type==='netBurst'){const prog=1-ef.life/16,r=ef.maxR*easeOut(prog);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle='rgba(150,200,255,'+(1-prog)*0.7+')';ctx.lineWidth=3*(1-prog)+0.5;ctx.stroke();}
    else if(ef.type==='diffBurst'){const prog=1-ef.life/24,r=ef.maxR*easeOut(prog);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle='rgba(160,242,210,'+(1-prog)*0.7+')';ctx.lineWidth=2.5;ctx.stroke();}
    else if(ef.type==='upBurst'){const prog=1-ef.life/28,r=10+easeOut(prog)*34;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle='rgba(255,226,122,'+(1-prog)*0.8+')';ctx.lineWidth=3*(1-prog)+0.5;ctx.stroke();
      ctx.save();ctx.translate(x,y);ctx.strokeStyle='rgba(255,236,160,'+(1-prog)*0.6+')';ctx.lineWidth=1.2;for(let k=0;k<8;k++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(r*0.6,0);ctx.lineTo(r*0.95,0);ctx.stroke();}ctx.restore();}
    else if(ef.type==='tissueDmg'){const prog=1-ef.life/34;const g=ctx.createRadialGradient(BASE_X,ef.y,0,BASE_X,ef.y,60);g.addColorStop(0,'rgba(255,40,60,'+(1-prog)*0.45+')');g.addColorStop(1,'rgba(255,40,60,0)');ctx.fillStyle=g;ctx.fillRect(0,ef.y-60,BASE_X+60,120);}
    else if(ef.type==='slimeDrip'){const prog=1-ef.life/22;ctx.beginPath();ctx.arc(x,y,3+prog*6,0,Math.PI*2);ctx.fillStyle='rgba(120,200,100,'+(1-prog)*0.35+')';ctx.fill();}
    else if(ef.type==='abHit'){const prog=1-ef.life/10;for(let i=0;i<4;i++){const ang=i*Math.PI/2+prog*2;ctx.beginPath();ctx.arc(x+Math.cos(ang)*prog*10,y+Math.sin(ang)*prog*10,2*(1-prog),0,Math.PI*2);ctx.fillStyle='rgba(255,230,110,'+(1-prog)+')';ctx.fill();}}
    else if(ef.type==='moveMark'){const prog=1-ef.life/26;ctx.beginPath();ctx.arc(x,y,4+prog*14,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,'+(1-prog)*0.85+')';ctx.lineWidth=2;ctx.stroke();}
    else if(ef.type==='block'){const prog=1-ef.life/14;ctx.beginPath();ctx.arc(x,y,5+prog*6,Math.PI*0.2,Math.PI*1.8);ctx.strokeStyle='rgba(111,168,255,'+(1-prog)+')';ctx.lineWidth=2;ctx.stroke();}
    else if(ef.type==='cytoWave'){const prog=1-ef.life/40,bx=BASE_X+prog*(GW-BASE_X);const g=ctx.createLinearGradient(bx-70,0,bx+10,0);g.addColorStop(0,rgba(ef.col,0));g.addColorStop(1,rgba(ef.col,0.22*(1-prog)));ctx.fillStyle=g;ctx.fillRect(bx-70,0,80,FIELD_H);}
  }
}
function drawParticles(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of particles){ctx.globalAlpha=clamp(p.life,0,1)*0.9;ctx.beginPath();ctx.arc(p.x+shakeX,p.y+shakeY,p.r,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();}
  ctx.restore();ctx.globalAlpha=1;
}
function drawDebris(){
  for(const d of debris){ctx.globalAlpha=clamp(d.life,0,1)*0.8;ctx.beginPath();ctx.arc(d.x+shakeX,d.y+shakeY,d.r*(0.5+d.life*0.5),0,Math.PI*2);ctx.fillStyle=d.col;ctx.fill();
    ctx.beginPath();ctx.arc(d.x+shakeX-d.r*0.3,d.y+shakeY-d.r*0.3,d.r*0.3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fill();}
  ctx.globalAlpha=1;
}
function drawFloatTexts(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of floatTexts){ctx.globalAlpha=clamp(t.life*1.6,0,1);ctx.font=font(t.sz,700);outlined(t.txt,t.x+shakeX,t.y+shakeY,t.col,'rgba(30,5,20,0.75)',Math.max(2.5,t.sz*0.28));}
  ctx.globalAlpha=1;
}

let HIT=[];              // botões registrados no último quadro (para cliques)

function btn(id,x,y,w,h,data){const r={id,x,y,w,h,data};HIT.push(r);return r;}
function hitAt(x,y){const p=TOUCH?4:0;for(let i=HIT.length-1;i>=0;i--){const r=HIT[i];if(x>=r.x-p&&x<=r.x+r.w+p&&y>=r.y-p&&y<=r.y+r.h+p)return r;}return null;}
const COL_PRIM='#D9782A',COL_SEC='#3E8FD6';   // curvas (validadas p/ daltonismo em fundo escuro)

function modeLineCol(m){return m==='primary'?COL_PRIM:COL_SEC;}

function glass(x,y,w,h,r=10,a=0.62){ctx.beginPath();rr(ctx,x,y,w,h,r);ctx.fillStyle='rgba(16,8,32,'+a+')';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.13)';ctx.lineWidth=1;ctx.stroke();}
function uiButton(id,x,y,w,h,label,opt={}){
  const b=btn(id,x,y,w,h,opt.data);const hov=hoverId===id&&!opt.disabled;

  else ctx.fillStyle=opt.disabled?'rgba(40,30,60,0.55)':hov?'rgba(255,255,255,0.16)':'rgba(20,12,40,0.62)';
  ctx.fill();ctx.strokeStyle=opt.disabled?'rgba(255,255,255,0.08)':opt.primary?'rgba(255,255,255,0.45)':hov?'rgba(255,255,255,0.45)':'rgba(255,255,255,0.18)';ctx.lineWidth=1;ctx.stroke();

function heart(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s/16,s/16);ctx.beginPath();ctx.moveTo(0,5);ctx.bezierCurveTo(-9,-1,-6,-9,0,-4);ctx.bezierCurveTo(6,-9,9,-1,0,5);ctx.fillStyle=col;ctx.fill();ctx.restore();}
function bolt(x,y,s){ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);const g=ctx.createRadialGradient(-s*0.3,-s*0.3,1,0,0,s);g.addColorStop(0,'#FFF3A0');g.addColorStop(1,'#E0A400');ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.moveTo(1,-s*0.62);ctx.lineTo(-s*0.38,s*0.08);ctx.lineTo(0,s*0.08);ctx.lineTo(-1,s*0.62);ctx.lineTo(s*0.38,-s*0.08);ctx.lineTo(0,-s*0.08);ctx.closePath();ctx.fillStyle='#6A4300';ctx.fill();ctx.restore();}
function star(x,y,r,fill,stroke){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr_=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*rr_,y+Math.sin(a)*rr_);}ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.2;ctx.stroke();}}

// ---------------- HUD do jogo ----------------
function fsIcon(x,y,s,exit){
  ctx.save();ctx.translate(x,y);ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.8;ctx.lineCap='round';ctx.lineJoin='round';const a=s*0.55;
  for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ctx.beginPath();
    if(!exit){const cx=sx*s,cy=sy*s;ctx.moveTo(cx,cy-sy*a);ctx.lineTo(cx,cy);ctx.lineTo(cx-sx*a,cy);}
    else{const ix=sx*s*0.4,iy=sy*s*0.4;ctx.moveTo(ix,iy+sy*a);ctx.lineTo(ix,iy);ctx.lineTo(ix+sx*a,iy);}
    ctx.stroke();}
  ctx.restore();}

  if(FS_OK){bx-=g;bx-=w;uiButton('fs',bx,y,w,h,'',{sz:11});fsIcon(bx+w/2,y+h/2,C?6.5:5,isFS());}

// frase-resumo comparando primária e secundária (quando há as duas curvas)
function chartInsight(C){
  if(!C.ref)return '';
  const pk=a=>a.reduce((m,v)=>Math.max(m,v),0);
  const pri=C.cur.mode==='primary'?C.cur:C.ref, sec=C.cur.mode==='primary'?C.ref:C.cur;
  if(pri.first<0||sec.first<0||pk(pri.pts)<0.5)return '';
  const ratio=pk(sec.pts)/pk(pri.pts);
  return 'Na resposta com memória, o 1º anticorpo veio em '+Math.round(sec.first/60)+' s (primária: '+Math.round(pri.first/60)+' s) e o pico foi '+ratio.toFixed(1).replace('.',',')+'× maior.';
}

  const series=[];series.push({pts:C.cur.pts,col:modeLineCol(C.cur.mode),label:C.curLabel,dash:false,first:C.cur.first});
  if(C.ref)series.push({pts:C.ref.pts,col:modeLineCol(C.ref.mode),label:C.refLabel,dash:true,first:C.ref.first});
  // legenda
