  for(const s of series){ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+18,ly);ctx.strokeStyle=s.col;ctx.lineWidth=2;ctx.setLineDash(s.dash?[5,4]:[]);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText(s.label,lx+23,ly);lx+=ctx.measureText(s.label).width+38;}
  const px=x+34,py=y+58,pw=w-34-16,ph=h-58-(C.ref?26:38);
  const n=Math.max(...series.map(s=>s.pts.length),2);let ymax=1;for(const s of series)for(const v of s.pts)ymax=Math.max(ymax,v);ymax*=1.1;
  const tmax=(n-1)*AB_SAMPLE/60;
  const X=i=>px+i/(n-1)*pw,Y=v=>py+ph-v/ymax*ph;
  // grade discreta
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;for(let k=1;k<=3;k++){const gy=py+ph*(1-k/3.3);ctx.beginPath();ctx.moveTo(px,gy);ctx.lineTo(px+pw,gy);ctx.stroke();}
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.moveTo(px,py+ph);ctx.lineTo(px+pw,py+ph);ctx.stroke();
  ctx.font=font(8.5,500);ctx.fillStyle='rgba(255,255,255,0.55)';ctx.textAlign='center';
  const step=tmax>90?30:tmax>40?15:tmax>15?10:5;for(let s=0;s<=tmax+0.01;s+=step){const xx=px+s/tmax*pw;ctx.fillText(s+' s',xx,py+ph+11);}
  ctx.save();ctx.translate(x+14,py+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText('título',0,0);ctx.restore();
  const allZero=series[0].pts.every(v=>v<0.05);
  // linhas
  for(const s of series){if(s.pts.length<2)continue;ctx.beginPath();s.pts.forEach((v,i)=>{const xx=X(i),yy=Y(v);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);});
    ctx.strokeStyle=s.col;ctx.lineWidth=2;ctx.lineJoin='round';ctx.setLineDash(s.dash?[5,4]:[]);ctx.stroke();ctx.setLineDash([]);
    // marcador do 1º anticorpo (latência)
    if(s.first>=0){const fi=s.first/AB_SAMPLE;if(fi<=n-1){const fx=X(fi);ctx.beginPath();ctx.arc(fx,py+ph,4,0,Math.PI*2);ctx.fillStyle=s.col;ctx.fill();ctx.strokeStyle='rgba(20,15,35,1)';ctx.lineWidth=2;ctx.stroke();}}}
  // rótulos diretos no pico
  ctx.font=font(9,700);ctx.textAlign='left';
  for(const s of series){let mi=0;s.pts.forEach((v,i)=>{if(v>s.pts[mi])mi=i;});if(s.pts[mi]<0.05)continue;const near=X(mi)>px+pw-70;ctx.textAlign=near?'right':'left';const xx=near?X(mi)-8:X(mi)+6,yy=Math.max(py+6,Y(s.pts[mi])-(near?0:8));ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillText('pico '+s.pts[mi].toFixed(0),xx,yy);}
  if(allZero){ctx.textAlign='center';ctx.font=font(10,600);ctx.fillStyle='rgba(255,255,255,0.75)';const zl=wrapLines('Nenhum anticorpo nesta partida — posicione linfócitos B para ver a curva.',pw-20);zl.forEach((l,k)=>ctx.fillText(l,px+pw/2,py+ph/2+(k-(zl.length-1)/2)*fz(10)*1.3));}
  // camada de hover: linha-guia + valores
  if(mouseX>=px&&mouseX<=px+pw&&mouseY>=py-10&&mouseY<=py+ph+10){
    const i=Math.round((mouseX-px)/pw*(n-1));const xx=X(i);
    ctx.beginPath();ctx.moveTo(xx,py);ctx.lineTo(xx,py+ph);ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;ctx.stroke();
    const lines=[(i*AB_SAMPLE/60).toFixed(1)+' s'];for(const s of series){const v=s.pts[i];if(v!==undefined){lines.push(s.label+': '+v.toFixed(1));ctx.beginPath();ctx.arc(xx,Y(v),4,0,Math.PI*2);ctx.fillStyle=s.col;ctx.fill();ctx.strokeStyle='#141026';ctx.lineWidth=2;ctx.stroke();}}
    ctx.font=font(9.5,600);const tlh=fz(9.5)*1.35,tw=Math.max(...lines.map(l=>ctx.measureText(l).width))+16,th=lines.length*tlh+8;let tx=xx+10;if(tx+tw>x+w-4)tx=xx-10-tw;
    ctx.beginPath();rr(ctx,tx,py+4,tw,th,6);ctx.fillStyle='rgba(8,6,20,0.92)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.stroke();
    ctx.textAlign='left';ctx.fillStyle='#FFF';lines.forEach((l,k)=>ctx.fillText(l,tx+8,py+4+4+tlh*(k+0.5)));
  }
  if(!C.ref&&!allZero){ctx.textAlign='left';ctx.font=font(8.5,500);ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText('Reencontre este antígeno para comparar primária × secundária.',x+12,y+h-8);}
}

// ---------- retratos (desenhados uma vez e guardados como imagem) ----------
const PORTRAITS={},PS=112;
function portraitURL(id){if(PORTRAITS[id]===undefined)buildPortrait(id);return PORTRAITS[id]||'';}
function buildAllPortraits(){for(const t of GUIDE_TABS)for(const e of GUIDE[t].entries)portraitURL(e.id);}
function buildPortrait(id){
  if(!spritesReady)return;
  const c=makeCanvas(PS*2,PS*2),saved=ctx,savedCyto=activeCytokines;
  try{
    ctx=c.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.translate(PS/2,PS/2);activeCytokines=[];
    const g=ctx.createRadialGradient(0,-PS*0.15,4,0,0,PS*0.5);g.addColorStop(0,'rgba(180,160,255,0.24)');g.addColorStop(1,'rgba(40,30,80,0.06)');
    ctx.beginPath();ctx.arc(0,0,PS*0.48,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    drawPortraitContent(id);
    PORTRAITS[id]=c.toDataURL('image/png');
  }catch(err){PORTRAITS[id]='';}
  finally{ctx=saved;activeCytokines=savedCyto;}
}
function pY(x,y,s,col,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(0,s);ctx.lineTo(0,0);ctx.lineTo(-s*0.75,-s*0.8);ctx.moveTo(0,0);ctx.lineTo(s*0.75,-s*0.8);
  ctx.strokeStyle='rgba(0,0,0,0.45)';ctx.lineWidth=s*0.42;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=s*0.26;ctx.stroke();ctx.restore();}
function pGlyph(x,y,r,col){const g=ctx.createRadialGradient(x-r*0.35,y-r*0.35,1,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(0.35,col);g.addColorStop(1,shade(col,-70));
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  for(let k=0;k<6;k++){const a=k/6*Math.PI*2;ctx.beginPath();ctx.arc(x+Math.cos(a)*r*1.3,y+Math.sin(a)*r*1.3,r*0.13,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();}}
function pArrow(x1,y1,x2,y2,col='rgba(255,255,255,0.75)'){ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-7*Math.cos(a-0.5),y2-7*Math.sin(a-0.5));ctx.lineTo(x2-7*Math.cos(a+0.5),y2-7*Math.sin(a+0.5));ctx.closePath();ctx.fill();}
function pFoe(type,x,y,sc,setup){const e=makeEnemy(type,x,y);e.spawnIn=0;e.wobble=1.2;e.phaseOff=0.6;if(setup)setup(e);
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.translate(-x,-y);drawEnemy(e,true);ctx.restore();}
function pCurve(second){const S=PS,x0=-S*0.36,x1=S*0.36,yb=S*0.28,h=S*0.52;
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x0,yb-h);ctx.lineTo(x0,yb);ctx.lineTo(x1,yb);ctx.stroke();
  const curve=(start,peak,col,dash)=>{ctx.beginPath();for(let i=0;i<=40;i++){const t=i/40,v=t<start?0:peak*(1-Math.exp(-(t-start)*7));const px=x0+t*(x1-x0),py=yb-v*h;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.setLineDash(dash?[5,4]:[]);ctx.strokeStyle=col;ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);};
  if(second){curve(0.45,0.3,COL_PRIM,true);curve(0.06,0.92,COL_SEC,false);}else curve(0.45,0.3,COL_PRIM,false);
  ctx.font='700 11px '+FONT;ctx.fillStyle='rgba(255,255,255,0.7)';ctx.textAlign='center';ctx.fillText('tempo',0,yb+12);}
function drawPortraitContent(id){
  const S=PS,spr=(k,x,y,s,f=0)=>drawSpr(k,f,x,y,s,1);
  switch(id){
    case 'NEUTRO':spr('NEUTRO',0,0,S*0.8);break;
    case 'MACRO':spr('MACRO',0,0,S*1.02);break;
    case 'EOSINO':spr('EOSINO',0,0,S*0.9);break;
    case 'NK':spr('NK',0,0,S*0.9);break;
    case 'TCITO':spr('TCITO',0,0,S*0.9);break;
    case 'LINFOB':spr('LINFOB',-S*0.2,-S*0.14,S*0.55);pArrow(-S*0.06,-S*0.02,S*0.04,S*0.06);spr('PLASMA',S*0.17,S*0.17,S*0.62,1);break;
    case 'BACTERIA':pFoe('BACTERIA',0,0,2.5);break;
    case 'BIOFILME':pFoe('BIOFILME',0,0,1.25);break;
    case 'HELMINTO':pFoe('HELMINTO',-S*0.3,0,1,e=>{e.r=15;e.segments=e.segments.map((s,i)=>({x:-S*0.3+10+i*6.3,y:Math.sin(i*0.6)*8}));});break;
    case 'LARVA':pFoe('LARVA',-S*0.2,0,2.3,e=>{e.segments=e.segments.map((s,i)=>({x:-S*0.2+4+i*4.5,y:Math.sin(i*0.9)*2}));});break;
    case 'TUMOR':pFoe('TUMOR',0,0,1.45);break;
    case 'METASTASE':pFoe('METASTASE',0,0,2.5);break;
    case 'CXCL8':spr('NEUTRO',S*0.16,S*0.14,S*0.55);for(let k=0;k<5;k++){ctx.beginPath();ctx.arc(-S*0.12+k*S*0.06,-S*0.08+k*S*0.045,2.2,0,Math.PI*2);ctx.fillStyle='rgba(111,195,255,'+(0.9-k*0.14)+')';ctx.fill();}pGlyph(-S*0.2,-S*0.18,S*0.15,CYTOKINES.CXCL8.col);break;
    case 'IFNG':spr('MACRO',S*0.12,S*0.1,S*0.75);pGlyph(-S*0.22,-S*0.2,S*0.14,CYTOKINES.IFNG.col);break;
    case 'IL5':spr('EOSINO',S*0.12,S*0.12,S*0.62);pGlyph(-S*0.2,-S*0.2,S*0.14,CYTOKINES.IL5.col);break;
    case 'IL13':{ctx.lineCap='round';for(let k=0;k<4;k++){ctx.beginPath();for(let x=-S*0.4;x<=S*0.4;x+=4){const y=-S*0.05+k*S*0.1+Math.sin(x*0.08+k)*4;x===-S*0.4?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.strokeStyle='rgba(235,250,255,0.55)';ctx.lineWidth=5;ctx.stroke();}
      pFoe('LARVA',-S*0.05,S*0.12,1.8,e=>{e.segments=e.segments.map((s,i)=>({x:-S*0.05+4+i*4.5,y:S*0.12+Math.sin(i*0.9)*2}));});pGlyph(-S*0.22,-S*0.22,S*0.13,CYTOKINES.IL13.col);break;}
    case 'IL2':spr('TCITO',S*0.02,S*0.16,S*0.5);spr('NK',S*0.24,-S*0.06,S*0.44);pGlyph(-S*0.22,-S*0.2,S*0.13,CYTOKINES.IL2.col);break;
    case 'ANTIPDL1':activeCytokines=[{key:'ANTIPDL1',timer:1}];pFoe('METASTASE',S*0.1,S*0.1,2.6);activeCytokines=[];pY(-S*0.22,-S*0.16,S*0.16,CYTOKINES.ANTIPDL1.col,-0.4);break;
    case 'c_inata':spr('MACRO',-S*0.17,-S*0.02,S*0.64);spr('LINFOB',S*0.25,S*0.04,S*0.42);break;
    case 'c_clonal':spr('LINFOB',-S*0.3,0,S*0.36);pArrow(-S*0.14,0,-S*0.04,0);for(let k=0;k<6;k++)spr('LINFOB',S*0.06+(k%3)*S*0.12,-S*0.1+Math.floor(k/3)*S*0.2,S*0.22,k);break;
    case 'c_primaria':pCurve(false);break;
    case 'c_secundaria':pCurve(true);break;
    case 'c_espec':pFoe('BACTERIA',-S*0.2,-S*0.04,2.1,e=>{e.opso=240;});pFoe('LARVA',S*0.06,S*0.16,1.7,e=>{e.segments=e.segments.map((s,i)=>({x:S*0.06+4+i*4.5,y:S*0.16+Math.sin(i*0.9)*2}));});pY(-S*0.2,-S*0.3,S*0.1,'#FFE66B',0);break;
    case 'c_vacina':{ctx.save();ctx.translate(-S*0.08,-S*0.02);ctx.rotate(-0.7);ctx.beginPath();rr(ctx,-S*0.26,-S*0.07,S*0.4,S*0.14,4);ctx.fillStyle='rgba(220,240,255,0.9)';ctx.fill();ctx.strokeStyle='#8FB8FF';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='rgba(120,200,255,0.7)';ctx.fillRect(-S*0.05,-S*0.05,S*0.17,S*0.1);ctx.fillStyle='#C7D6EE';ctx.fillRect(-S*0.36,-S*0.02,S*0.1,S*0.04);ctx.fillRect(-S*0.38,-S*0.07,S*0.03,S*0.14);
      ctx.strokeStyle='#E8EEF8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(S*0.14,0);ctx.lineTo(S*0.3,0);ctx.stroke();ctx.restore();spr('LINFOB',S*0.24,S*0.2,S*0.36);break;}
    case 'c_opso':pFoe('BACTERIA',-S*0.1,-S*0.02,2.6,e=>{e.opso=240;});spr('NK',S*0.27,S*0.22,S*0.34);break;
    case 'c_check':pFoe('TUMOR',-S*0.14,0,1.05);spr('TCITO',S*0.28,S*0.08,S*0.42);ctx.strokeStyle='#FF5A6E';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(S*0.1,-S*0.1);ctx.lineTo(S*0.1,S*0.2);ctx.stroke();break;
  }
}

// ---------- itens de cada fase ----------
function levelItems(i){
  const L=LEVELS[i],ens=[];const add=t=>{if(!ens.includes(t))ens.push(t);};
  L.staticEnemies.forEach(s=>add(s.type));L.waves.forEach(w=>w.enemies.forEach(g=>add(g.type)));
  if(ens.includes('BIOFILME'))add('BACTERIA');if(ens.includes('TUMOR'))add('METASTASE');
  return L.available.concat(L.cytokinesAvailable||[]).concat(ens).concat(LEVEL_CONCEPTS[i]||[]);
}

function openGuide(tab,id,from){
  const f=id?guideFind(id):null;
  guideState={tab:f?f.tab:(tab||guideState.tab||'cells'),id:f?f.entry.id:null,from:from||'menu'};
  renderGuide();
}
function guideDetail(e,tab){
  let stats='';
  if(tab==='cells'){const u=UNITS[e.id];stats='<div class="gd-stats"><span>'+(ADAPTIVE.has(e.id)?'Adaptativa':'Inata')+'</span><span>Custo '+u.cost+' ATP</span><span>Vida '+u.hp+'</span><span>'+(e.id==='LINFOB'?'Longo alcance':e.id==='EOSINO'?'Ataque em área':'Corpo a corpo')+'</span></div>';}
  else if(tab==='cytos'){const c=CYTOKINES[e.id];stats='<div class="gd-stats"><span>Custo '+c.cost+' ATP</span>'+(c.duration>60?'<span>Dura '+Math.round(c.duration/60)+' s</span>':'')+'<span>Recarga '+Math.round(c.cooldown/60)+' s</span></div>';}
  else if(tab==='foes'){const en=ENEMIES[e.id];stats='<div class="gd-stats"><span>Vida '+en.hp+'</span>'+(en.baseDmg?'<span>Dano ao tecido '+en.baseDmg+'</span>':'<span>Fixo no lugar</span>')+'</div>';}
  const lv=tab==='concepts'?LEVEL_CONCEPTS.map((c,i)=>c.includes(e.id)?i+1:0).filter(Boolean):guideLevelsOf(e.id);
  let up='';if(tab==='cells'){const u=UNITS[e.id].up;up='<div class="lz"><span class="lk" style="color:#FFE27A">EVOLUÇÃO ▲ '+esc(u.name.toUpperCase())+'</span>'+esc(u.desc)+'</div>';}
  return '<div class="gd-top"><img src="'+portraitURL(e.id)+'" alt=""><div><div class="gd-tag">'+esc(e.tag)+'</div><h3>'+esc(e.name)+'</h3><p class="gd-short">'+esc(e.short)+'</p></div></div>'+stats
    +'<div class="lz"><span class="lk" style="color:#88CCFF">NO CORPO</span>'+esc(e.body)+'</div>'
    +'<div class="lz"><span class="lk" style="color:#FFD34D">NO JOGO</span>'+esc(e.game)+'</div>'+up
    +(e.good?'<div class="lz"><span class="lk" style="color:#9FF2D2">MELHOR CONTRA</span>'+esc(e.good)+'</div>':'')
    +(lv.length?'<div class="gd-lv">Aparece '+(lv.length>1?'nas fases ':'na fase ')+lv.join(', ')+'</div>':'');
}
function renderGuide(){
  const g=guideState,T=GUIDE[g.tab];const cur=T.entries.find(e=>e.id===g.id)||T.entries[0];g.id=cur.id;
  const inLevel=(state==='paused'||state==='playing')?new Set(levelItems(level)):null;
  const oldList=document.querySelector('#card .g-list'),keep=oldList&&ovlMode==='guide'?oldList.scrollTop:0;
  const tabs=GUIDE_TABS.map(t=>'<button class="g-tab'+(t===g.tab?' on':'')+'" data-tab="'+t+'">'+esc(GUIDE[t].title)+'</button>').join('');
  const list=T.entries.map(e=>'<button class="g-item'+(e.id===cur.id?' on':'')+'" data-id="'+e.id+'"><img src="'+portraitURL(e.id)+'" alt=""><span>'+esc(e.name)+'</span>'+(inLevel&&inLevel.has(e.id)?'<i>nesta fase</i>':'')+'</button>').join('');
  const back=g.from==='pause'&&state==='paused'?'VOLTAR À PAUSA':g.from==='news'&&state==='paused'?'VOLTAR ÀS NOVIDADES':'FECHAR';
  showOvl('<div class="eyebrow">MEMÓRIA IMUNE · GUIA IMUNOLÓGICO</div>'
    +'<div class="g-tabs">'+tabs+'</div>'
    +'<div class="g-body"><div class="g-list">'+list+'</div><div class="g-detail">'+guideDetail(cur,g.tab)+'</div></div>'
    +'<div class="g-foot"><button class="btn" id="gBack">'+back+'</button></div>','guide',true);
  const card=document.getElementById('card');
  card.querySelectorAll('.g-tab').forEach(b=>b.onclick=()=>{guideState.tab=b.dataset.tab;guideState.id=null;sndSelect();renderGuide();});
  card.querySelectorAll('.g-item').forEach(b=>b.onclick=()=>{guideState.id=b.dataset.id;sndSelect();renderGuide();});
  const nl=card.querySelector('.g-list');if(nl)nl.scrollTop=keep;
  document.getElementById('gBack').onclick=ovlBack;
}

const NEWS_KIND={cells:'Nova célula',cytos:'Citocina / terapia',foes:'Invasor',concepts:'Conceito'};
function maybeShowNews(){
  const items=levelItems(level).filter(id=>!seen.has(id)&&guideFind(id));
  if(!showNews||!items.length)return;
  items.forEach(id=>seen.add(id));lsSet('arena_seen',JSON.stringify([...seen]));
  pauseGame();showNewsCard(items);
}
function showNewsCard(items){

  showOvl('<div class="eyebrow">FASE '+(level+1)+' · '+esc(L.name.toUpperCase())+'</div><h2>NOVIDADES NESTA FASE</h2>'
    +'<p class="n-hint">'+(TOUCH?'Toque':'Clique')+' numa ficha para ler mais no guia.</p>'
    +'<div class="news">'+items.map(id=>{const f=guideFind(id);return '<button class="nw" data-id="'+id+'"><img src="'+portraitURL(id)+'" alt=""><div><span class="nk">'+NEWS_KIND[f.tab]+'</span><b>'+esc(f.entry.name)+'</b><p>'+esc(f.entry.short)+'</p></div></button>';}).join('')+'</div>'
    +'<div class="n-foot"><label class="chk"><input type="checkbox" id="nShow"'+(showNews?' checked':'')+'> Mostrar novidades no início das fases</label>'
    +'<button class="btn" id="nGo">COMEÇAR A FASE</button></div>','news','auto');
  const card=document.getElementById('card');
  card.querySelectorAll('.nw').forEach(b=>b.onclick=()=>{sndSelect();openGuide(null,b.dataset.id,'news');});
  document.getElementById('nShow').onchange=e=>{showNews=e.target.checked;lsSet('arena_news',showNews?'1':'0');};
  document.getElementById('nGo').onclick=resumeGame;document.getElementById('nGo').focus({preventScroll:true});
}

// =====================================================================
//  ENTRADA (mouse, toque, teclado), PAUSA, LAÇO PRINCIPAL
// =====================================================================
let drag=null;      // arrastar célula já posicionada: {ally,sx,sy,tx,ty,moving,touch}
let cardDrag=null;  // arrastar um card até o campo: {key,sx,sy,moving,wasSelected,touch}
let activePointer=null;
const TOUCH_OFF=40; // no toque, a prévia aparece acima do dedo (senão o dedo a esconde)
function canvasCoords(ex,ey){const r=canvas.getBoundingClientRect();return{x:(ex-r.left)/r.width*GW,y:(ey-r.top)/r.height*GH};}
function allyAt(x,y,touch){const pad=touch?15:9;let best=null,bd=Infinity;for(const a of allies){const d=dist(x,y,a.x,a.y);if(d<a.r+pad&&d<bd){bd=d;best=a;}}return best;}
function goHome(){location.href='../index.html';} // o jogo fica em immuno.games/arena/

// ---------- tela cheia (Android/iPad/desktop; no iPhone use "Adicionar à Tela de Início") ----------
const FS_OK=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function enterFS(){
  if(!FS_OK||isFS())return;
  try{const el=document.documentElement;const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:'hide'});
    const lock=()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(_){}};
    if(p&&p.then)p.then(lock).catch(()=>{});else lock();}catch(_){}
}
function toggleFS(){if(isFS()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(_){}}else enterFS();}
document.addEventListener('fullscreenchange',()=>setTimeout(resizeCanvas,60));
document.addEventListener('webkitfullscreenchange',()=>setTimeout(resizeCanvas,60));

// ---------- mudança de tamanho de tela ----------
function onGWChange(){
  if(!booted)return;
  bgDirty=true;for(const k in sceneThumbs)delete sceneThumbs[k];
  for(const a of allies){a.x=clamp(a.x,BASE_X+a.r,GW-a.r);a.hx=clamp(a.hx,BASE_X+a.r,GW-a.r);}
  for(const e of enemies_){if(e.spd===0&&e.x>GW-e.r-24){const dx=GW-e.r-24-e.x;e.x+=dx;for(const s of e.segments){s.x+=dx;}}}
}
function onViewportChange(){if(!booted)return;if(TOUCH&&isPortrait()&&state==='playing')togglePause();}

function onButton(h){
  const id=h.id;
  if(id==='home'){goHome();return;}
  if(id==='mute'){toggleMute();return;}
  if(id==='fs'){toggleFS();return;}
  if(id==='credits'){showCredits();return;}
  if(id==='guide'){if(state==='playing')openGuideFromGame();else openGuide('cells',null,'menu');return;}
  if(id==='info'){if(selAlly)openGuideFromGame(selAlly.type);return;}
  if(id==='pause'){togglePause();return;}
  if(id==='speed'){gameSpeed=gameSpeed===1?2:1;sndSelect();return;}
  if(id==='quit'){state='levelselect';selectedUnit=null;selAlly=null;sndSelect();return;}
  if(id==='call'){callNextWave();return;}
  if(id==='skip'){introTimer=0;sndSelect();return;}
  if(id==='up'){upgradeAlly(selAlly);return;}
  if(id==='recycle'){recycleAlly(selAlly);return;}
  if(id==='panel')return;
  if(id==='play'){if(TOUCH)enterFS();state='levelselect';sndSelect();return;}
  if(id==='back'){state='menu';sndSelect();return;}
  if(id==='reset'){memory=new Set();saveMemory();curves={};lsSet('arena_curves','{}');seen=new Set();lsSet('arena_seen','[]');sndRecycle();return;}
  if(id==='next'){initLevel(Math.min(LEVELS.length-1,level+1));sndSelect();return;}
  if(id==='retry'){initLevel(level);sndSelect();return;}
  if(id==='levels'){state='levelselect';sndSelect();return;}
  if(id.startsWith('lvl:')){initLevel(parseInt(id.slice(4)));sndSelect();return;}
  if(id.startsWith('card:')){selectCard(id.slice(5));return;}
  if(id.startsWith('cyto:')){const k=id.slice(5);tipMsg=CYTOKINES[k].tooltip;tipLife=240;activateCytokine(k);return;}
}
function selectCard(k){
  if(selectedUnit===k){selectedUnit=null;}else{selectedUnit=k;selAlly=null;tipMsg=UNITS[k].tooltip;tipLife=260;
    if(unitLocked(k)){tipMsg='Expansão clonal em andamento: os '+UNITS[k].name+' ficam prontos em '+Math.ceil((ADAPT_DELAY-playFrames)/60)+' s.';}}
  sndSelect();
}

function handleDown(x,y,touch){
  if(state==='paused')return;
  const h=hitAt(x,y);
  if(h){
    // card: toque seleciona; arrastar até o campo posiciona
    if(h.id.startsWith('card:')&&state==='playing'&&introTimer<=0){const k=h.id.slice(5);
      cardDrag={key:k,sx:x,sy:y,moving:false,wasSelected:selectedUnit===k,touch};if(selectedUnit!==k)selectCard(k);return;}
    onButton(h);return;
  }
  if(state!=='playing'||introTimer>0||y>=FIELD_H)return;
  if(selectedUnit){
    if(x>BASE_X)spawnAlly(selectedUnit,x,y);
    else{sndError();addText(BASE_X+70,y,'Posicione além da linha do tecido','#FFB3B3',10);}
    return;
  }
  const a=allyAt(x,y,touch);
  if(a){selAlly=a;sndSelect();drag={ally:a,sx:x,sy:y,tx:x,ty:y,moving:false,touch};tipMsg=UNITS[a.type].up.name+': '+UNITS[a.type].up.desc;tipLife=240;return;}
  if(selAlly){selAlly=null;}
}
function pointerMove(x,y,touch){
  mouseX=x;mouseY=y;
  const h=hitAt(x,y);hoverId=touch?null:(h?h.id:null);
  if(cardDrag){
    if(!cardDrag.moving&&dist(x,y,cardDrag.sx,cardDrag.sy)>10)cardDrag.moving=true;
    previewX=x;previewY=y-(cardDrag.touch?TOUCH_OFF:0);showPreview=cardDrag.moving&&previewY<FIELD_H;
  } else {previewX=x;previewY=y;showPreview=!touch&&state==='playing'&&!!selectedUnit&&y<FIELD_H&&!h;}
  if(drag){drag.tx=x;drag.ty=y-(drag.touch?TOUCH_OFF:0);if(!drag.moving&&dist(x,y,drag.sx,drag.sy)>8)drag.moving=true;}
  if(!touch)canvas.style.cursor=h?'pointer':(showPreview?'crosshair':(drag&&drag.moving?'grabbing':(state==='playing'&&allyAt(x,y)?'grab':'default')));
}
function handleUp(){
  if(cardDrag){
    const cd=cardDrag;cardDrag=null;
    if(cd.moving){
      if(state==='playing'&&previewY<FIELD_H-2){
        if(previewX>BASE_X)spawnAlly(cd.key,previewX,previewY);
        else{sndError();addText(BASE_X+70,previewY,'Posicione além da linha do tecido','#FFB3B3',10);}
      }
    } else if(cd.wasSelected){selectedUnit=null;sndSelect();}
    if(cd.touch)showPreview=false;
    return;
  }
  if(drag&&drag.moving&&allies.includes(drag.ally)){
    const a=drag.ally;
    if(a.type==='LINFOB'&&a.differentiated){addText(a.x,a.y-a.r-10,'Plasmócito fica fixo','#CFE3FF',10);sndError();}
    else{a.hx=clamp(drag.tx,BASE_X+a.r,GW-a.r);a.hy=clamp(drag.ty,a.r,FIELD_H-a.r);a.target=null;effects.push({type:'moveMark',x:a.hx,y:a.hy,life:26});sndPlace();}
  }
  drag=null;
}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  if(activePointer!==null&&activePointer!==e.pointerId)return; // ignora um segundo dedo
  activePointer=e.pointerId;
  const touch=e.pointerType!=='mouse';
  const c=canvasCoords(e.clientX,e.clientY);pointerMove(c.x,c.y,touch);
  if(e.button===2){selectedUnit=null;selAlly=null;activePointer=null;return;}
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  handleDown(c.x,c.y,touch);
});
canvas.addEventListener('pointermove',e=>{if(activePointer!==null&&activePointer!==e.pointerId)return;const c=canvasCoords(e.clientX,e.clientY);pointerMove(c.x,c.y,e.pointerType!=='mouse');});
canvas.addEventListener('pointerup',e=>{if(activePointer!==e.pointerId)return;activePointer=null;const c=canvasCoords(e.clientX,e.clientY);pointerMove(c.x,c.y,e.pointerType!=='mouse');handleUp();});
canvas.addEventListener('pointercancel',e=>{if(activePointer===e.pointerId)activePointer=null;drag=null;cardDrag=null;showPreview=false;});
canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!cardDrag){showPreview=false;hoverId=null;}});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

document.addEventListener('keydown',e=>{
  if(!document.getElementById('ovl').classList.contains('hide')){
    if(e.code==='Escape'||(e.code==='KeyP'&&ovlMode==='pause')||(e.code==='Enter'&&(ovlMode==='news'||ovlMode==='credits'))){e.preventDefault();ovlBack();}
    return;
  }
  if(state==='playing'){
    if(introTimer>0){if(e.code==='Space'||e.code==='Enter'){e.preventDefault();introTimer=0;}return;}
    const L=LEVELS[level];const num=parseInt(e.key);
    if(num>=1&&num<=L.available.length){selectCard(L.available[num-1]);return;}
    const cy=(L.cytokinesAvailable||[])[CYTO_KEYS.indexOf(e.key.toUpperCase())];
    if(cy){activateCytokine(cy);return;}
    if(e.code==='Space'){e.preventDefault();callNextWave();return;}
    if(e.code==='KeyF'){gameSpeed=gameSpeed===1?2:1;sndSelect();return;}
    if(e.code==='KeyU'&&selAlly){upgradeAlly(selAlly);return;}
    if((e.code==='KeyR'||e.code==='Delete'||e.code==='Backspace')&&selAlly){e.preventDefault();recycleAlly(selAlly);return;}
    if(e.code==='KeyG'||e.key==='?'){openGuideFromGame();return;}
    if(e.code==='Escape'){if(selectedUnit||selAlly){selectedUnit=null;selAlly=null;}else togglePause();e.preventDefault();return;}
    if(e.code==='KeyP'){togglePause();return;}
  }
  if(state==='menu'&&(e.code==='Enter'||e.code==='Space')){state='levelselect';sndSelect();}
  else if(state==='levelselect'&&e.code==='Escape'){state='menu';sndSelect();}
  else if(state==='victory'&&e.code==='Enter'){if(level<LEVELS.length-1)initLevel(level+1);else state='levelselect';}
  else if(state==='defeat'&&e.code==='Enter'){initLevel(level);}
});

// ===== Camada HTML: pausa, guia, novidades e créditos =====
let prevState=null,ovlMode=null;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
// No toque, o navegador dispara um "click" logo após o toque que abriu a camada; ignoramos cliques nos primeiros instantes
let ovlShownAt=0;
document.getElementById('ovl').addEventListener('click',e=>{if(performance.now()-ovlShownAt<400){e.stopPropagation();e.preventDefault();}},true);
function showOvl(html,mode,wide){if(document.getElementById('ovl').classList.contains('hide'))ovlShownAt=performance.now();const c=document.getElementById('card');c.className='card'+(wide?' wide':'')+(wide==='auto'?' auto':'');c.innerHTML=html;const o=document.getElementById('ovl');o.classList.remove('hide');o.scrollTop=0;ovlMode=mode||null;}
function hideOvl(){document.getElementById('ovl').classList.add('hide');ovlMode=null;}
function pauseGame(){if(state==='playing'){prevState='playing';state='paused';drag=null;cardDrag=null;showPreview=false;}}
function resumeGame(){if(state==='paused')state=prevState||'playing';hideOvl();}
function ovlBack(){
  if(ovlMode==='pause'||ovlMode==='news')resumeGame();
  else if(ovlMode==='guide'){if(guideState.from==='pause'&&state==='paused')showPauseMenu();else if(guideState.from==='news'&&state==='paused')showNewsCard(lastNews);else hideOvl();}
  else hideOvl();
}
function pauseLessons(){
  const L=LEVELS[level];
  const rm=levelMode==='vaccinated'?'VACINADO contra '+L.antigen+': memória sem a doença — células B de memória prontas e anticorpos potentes já no primeiro contato.'
    :levelMode==='secondary'?'RESPOSTA SECUNDÁRIA: há memória para '+L.antigen+'. Células B de memória prontas; linfócitos disponíveis na hora, 40% mais baratos, plasmócitos rápidos e anticorpos de alta afinidade.'
    :'RESPOSTA PRIMÁRIA: primeiro contato com '+L.antigen+'. Linfócitos B/T só ficam disponíveis após a expansão clonal (15 s no jogo; dias no corpo) — segure com a resposta inata.';
  const src=[...new Set(L.staticEnemies.concat(...L.waves.map(w=>w.enemies.filter(g=>ENEMIES[g.type].big))).map(g=>ENEMIES[g.type].name))];
  const tum=L.antigen.startsWith('Tumor');
  return [['OBJETIVO','#66FF99','Não deixe o TECIDO chegar a 0%. Vença todas as ondas'+(tum?' e elimine os focos tumorais':src.length?' e elimine '+(src.length>1?'os focos: ':'o foco: ')+src.join(', '):'')+'. Cada ameaça eliminada rende um pouco de ATP — gaste com cuidado.'],
   ['RESPOSTA',modeTxtCol(levelMode),rm],
   ['CÉLULAS','#FFD34D','Toque numa célula já posicionada para EVOLUIR (▲), fazer APOPTOSE (devolve metade do ATP) ou abrir a ficha dela (ⓘ). Arraste-a para mudar o posto.'],
   ['CONCEITO','#88CCFF','A memória imunológica é específica: ter memória contra um antígeno não protege contra outro. Vacinas geram essa memória sem a doença. Compare as curvas de anticorpos ao fim de cada fase.']];
}
function pauseHTML(){
  const L=LEVELS[level];
  const cy=(L.cytokinesAvailable||[]).map((k,i)=>CYTO_KEYS[i]).join(' ');
  const touchHelp='Toque num card e depois no campo — ou arraste o card até o campo. Toque numa célula para evoluir (▲), fazer apoptose ou ver a ficha (ⓘ); arraste-a para mudar o posto. ▶▶ antecipa a onda; ? abre o guia.';
  const keys=[['1–'+L.available.length,'escolher célula · clique no campo para posicionar']].concat(cy?[[cy,'citocinas']]:[]).concat([['U / R','evoluir / apoptose da célula selecionada'],['G ou ?','abrir o guia imunológico'],['Espaço','antecipar a próxima onda (+ATP)'],['F','velocidade 1× / 2×'],['Esc','cancelar seleção / pausar']]);
  return '<div class="eyebrow">MEMÓRIA IMUNE · FASE '+(level+1)+' · PAUSA</div><h2>'+esc(L.name.toUpperCase()+' · '+L.antigen.toUpperCase())+'</h2>'
    +'<div class="cols"><div class="txt">'
    +pauseLessons().map(([k,c,t])=>'<div class="lz"><span class="lk" style="color:'+c+'">'+esc(k)+'</span>'+esc(t)+'</div>').join('')
    +(TOUCH?'<div class="lz"><span class="lk" style="color:#C9A8FF">TOQUE</span>'+esc(touchHelp)+'</div>'
      :'<div class="lz"><span class="lk" style="color:#C9A8FF">TECLADO</span><div class="keys">'+keys.map(([k,t])=>'<kbd>'+esc(k)+'</kbd><span>'+esc(t)+'</span>').join('')+'</div></div>')
    +'</div><div class="acts">'
    +'<button class="btn" id="pRs">CONTINUAR</button>'
    +'<button class="btn guide" id="pGd">GUIA: CÉLULAS, CITOCINAS E RESPOSTA IMUNE</button>'
    +'<button class="btn ghost" id="pRt">REINICIAR</button>'
    +'<button class="btn ghost" id="pMn">SAIR PARA O MENU</button>'
    +'<a class="btn ghost small" id="pHub" href="../index.html">VOLTAR AO HUB</a>'
    +'<div class="cred">'+CREDITS.map(c=>'<b>'+esc(c.role)+':</b> '+esc(c.name)).join('<br>')+'</div>'
    +'</div></div>';
}
function showPauseMenu(){
  showOvl(pauseHTML(),'pause');
  document.getElementById('pRs').onclick=resumeGame;
  document.getElementById('pGd').onclick=()=>openGuide(null,guideDefaultId(),'pause');
  document.getElementById('pRt').onclick=()=>{hideOvl();initLevel(level);};
  document.getElementById('pMn').onclick=()=>{hideOvl();state='levelselect';};
  document.getElementById('pRs').focus({preventScroll:true});
}
function togglePause(){
  if(state==='playing'){pauseGame();showPauseMenu();}
  else if(state==='paused')resumeGame();
}
function guideDefaultId(){return selAlly?selAlly.type:selectedUnit?selectedUnit:(state==='paused'||state==='playing')?LEVELS[level].available[0]:null;}
function openGuideFromGame(id){if(state==='playing')pauseGame();openGuide(null,id||guideDefaultId(),'pause');}
// ---------- créditos ----------
const CREDITS=[
  {role:'Idealização e primeiro protótipo',name:'Luca Foggia',text:'teve a ideia do jogo e desenvolveu a primeira versão jogável.'},
  {role:'Curadoria científica e evolução do jogo',name:'Helder Nakaya',text:'revisou os conceitos de imunologia e ampliou o jogo com novo visual, novas mecânicas, o guia imunológico e a fase de imunologia tumoral.'},
];
function showCredits(){
  showOvl('<div class="eyebrow">MEMÓRIA IMUNE</div><h2>CRÉDITOS</h2>'
    +CREDITS.map(c=>'<div class="lz"><span class="lk" style="color:#FFD34D">'+esc(c.role.toUpperCase())+'</span><b style="color:#fff;font-size:15px">'+esc(c.name)+'</b> — '+esc(c.text)+'</div>').join('')
    +'<div class="lz" style="opacity:.75">Jogo educativo sobre resposta imune primária e secundária, especificidade da memória, vacinação e imunoterapia do câncer.</div>'
    +'<button class="btn" id="cOk">FECHAR</button>','credits');
  document.getElementById('cOk').onclick=hideOvl;document.getElementById('cOk').focus({preventScroll:true});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')togglePause();});

// ---------------- render + laço ----------------
let lastErr=0;
function render(){
  ctx.setTransform(SCALE,0,0,SCALE,0,0);HIT=[];
  ctx.clearRect(0,0,GW,GH);
  if(!spritesReady){drawLoading();return;}
  if(state==='menu'){drawMenu();drawHomeBtn();drawMuteCorner();}
  else if(state==='levelselect'){drawLevelSelect();drawHomeBtn();drawMuteCorner();}
  else{
    drawGameScene();
    if(state==='playing'||state==='paused'){
      if(introTimer>0)btn('skip',0,0,GW,FIELD_H);
      if(introTimer<=0)drawHUD();else uiButton('pause',GW-40,6,30,22,'II',{sz:11});
      drawPanel();drawActionPanel();drawIntro();
    } else {drawResult();drawHomeBtn();drawMuteCorner();}
  }
}
function loop(ts){
  if(!lastTS)lastTS=ts;accum+=ts-lastTS;lastTS=ts;if(accum>200)accum=200;
  try{while(accum>=FT){for(let s=0;s<gameSpeed;s++)update();accum-=FT;}render();}
  catch(err){accum=0;const n=performance.now();if(n-lastErr>2000){lastErr=n;console.error(err);}}
  requestAnimationFrame(loop);
}
loadSprites(()=>{const l=document.getElementById('load');if(l)l.classList.add('hide');setTimeout(buildAllPortraits,30);});
booted=true;resizeCanvas();
requestAnimationFrame(loop);

</script>
