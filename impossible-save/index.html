<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#102b30" />
    <title>The Impossible Save · immuno.games</title>
    <meta
      name="description"
      content="Play goalkeeper in a paper stadium. Face the very same penalty without MS and with a simulated MS lesion. A free one-finger football game in English and Portuguese."
    />
    <meta property="og:title" content="The Impossible Save · immuno.games" />
    <meta property="og:image" content="https://immuno.games/capas/impossible-save.webp" />
    <link rel="icon" href="../favicon.svg" />
    <link rel="preload" as="font" type="font/woff" href="assets/display-italic.woff" crossorigin />
    <link rel="stylesheet" href="duel.css?v=4" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.js", "papercraft/": "./paper/" } }
    </script>
  </head>
  <body data-phase="home">
    <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="i-play" viewBox="0 0 24 24">
          <path d="m7 4 13 8-13 8z" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-flip" viewBox="0 0 24 24">
          <path d="m2 11 10-5 10 5-10 5zM3 15l9 5 9-5M17 3l4-1-1 4" />
        </symbol>
        <symbol id="i-book" viewBox="0 0 24 24">
          <path d="M2 5c4-1 7-1 10 1 3-2 6-2 10-1v14c-4-1-7-1-10 1-3-2-6-2-10-1zM12 6v14" />
        </symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 4v16M16 4v16" stroke-width="4" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19" /></symbol>
        <symbol id="i-sound" viewBox="0 0 24 24">
          <path d="M3 9h4l5-5v16l-5-5H3zM16 8c3 2 3 6 0 8m3-12c5 4 5 12 0 16" />
        </symbol>
        <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-5v16l-5-5H3zM16 8l6 8m0-8-6 8" /></symbol>
        <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6" /></symbol>
        <symbol id="i-cup" viewBox="0 0 24 24">
          <path d="M7 3h10v6a5 5 0 0 1-10 0zM7 5H3v2c0 3 2 5 5 5m9-7h4v2c0 3-2 5-5 5m-4 2v5m-4 2h8" />
        </symbol>
      </defs>
    </svg>
    <header class="bar">
      <a href="https://immuno.games/" id="back" class="brand">immuno<span>.</span>games</a>
      <div class="tools">
        <div class="languages" aria-label="Language / Idioma">
          <button data-act="en" lang="en">EN</button><button data-act="pt" lang="pt-BR">PT-BR</button>
        </div>
        <button data-act="sound" class="icon" id="sound"></button
        ><button data-act="menu" id="menu" class="icon">
          <svg><use href="#i-book" /></svg>
        </button>
      </div>
    </header>
    <main class="wrap">
      <section id="pitch" tabindex="0" aria-label="The Impossible Save">
        <div id="field-layer">
          <canvas id="paper"></canvas>
          <div id="three" hidden></div>
        </div>
        <canvas id="ink" aria-hidden="true"></canvas>
        <div id="home">
          <div class="home-copy">
            <h1 id="name"><small>The</small><span>Impossible</span><strong>Save</strong></h1>
          </div>
          <div class="kickoff">
            <p id="tagline"></p>
            <button data-act="start" id="start" class="main-btn">
              <svg><use href="#i-play" /></svg><span>Play</span>
            </button>
          </div>
        </div>
        <div id="hud" hidden>
          <div class="identity">
            <button class="icon" data-act="pause" id="pause">
              <svg><use href="#i-pause" /></svg></button
            ><strong id="condition"></strong>
          </div>
          <div class="count">
            <span id="round-label"></span>
            <div id="dots" role="img"></div>
          </div>
        </div>
        <div id="cue" role="status" hidden></div>
        <div id="nerve-fold" aria-hidden="true" hidden><canvas id="nerve"></canvas></div>
        <div id="halftime" class="paper-slip" hidden></div>
        <div id="result" class="paper-slip" hidden></div>
      </section>
    </main>
    <dialog id="sheet">
      <div class="sheet-head">
        <div class="languages" aria-label="Language / Idioma">
          <button data-act="en" lang="en">EN</button><button data-act="pt" lang="pt-BR">PT-BR</button>
        </div>
        <button class="icon" id="close-sheet" data-act="close">
          <svg><use href="#i-close" /></svg>
        </button>
      </div>
      <div id="sheet-body"></div>
    </dialog>
    <div id="live" class="sr" aria-live="polite"></div>
    <noscript>Enable JavaScript to play. Ative o JavaScript para jogar.</noscript>
    <script type="module" src="duel.js?v=4"></script>
  </body>
</html>
