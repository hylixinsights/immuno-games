<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143b36">
<meta name="description" content="Guide a B cell along an illustrated tissue map. Meet folded-paper cells and find the shape you will remember. Play in English or Brazilian Portuguese.">
<meta property="og:title" content="A Shape to Remember · immuno.games">
<meta property="og:description" content="Follow the bloodstream through a pop-up world of cells. An interactive immunology journey.">
<meta property="og:image" content="art/journey-cover.webp">
<title>A Shape to Remember · immuno.games</title>
<link rel="icon" href="./art/mark.svg" type="image/svg+xml">
<link rel="preload" href="./fonts/instrument-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./art/ground/river.webp" as="image">
<link rel="stylesheet" href="./journey.css">
</head>
<body>
<main id="shell" class="at-title">
  <div id="map-window">
    <div id="tissue" aria-hidden="true"></div>
    <canvas id="map" tabindex="-1" aria-label="Interactive tissue map"></canvas>
  </div>
  <section id="welcome" aria-labelledby="title">
    <header class="welcome-top">
      <a href="https://immuno.games/" class="brand" aria-label="immuno.games"><span id="brand-mark"></span>immuno.games</a>
      <div class="switch" role="group" aria-label="Language / Idioma"><button id="en" lang="en" aria-label="English">EN</button><button id="pt" lang="pt-BR" aria-label="Português do Brasil">PT-BR</button></div>
    </header>
    <div class="welcome-copy">
      <h1 id="title">A Shape<br><em>to Remember</em></h1>
      <p id="intro"></p>
      <div class="start-actions"><button id="open" class="primary"></button><button id="how" class="text-button"></button></div>
    </div>
    <div class="welcome-foot"><button id="about" class="text-button"></button><button class="text-button" id="title-sound"></button></div>
  </section>
  <section id="hud" hidden>
    <div class="top-row">
      <button class="location" id="places"><span class="place-icon" id="place-symbol"></span><span><small id="chapter-kicker"></small><strong id="place"></strong></span></button>
      <div class="corner-tools"><button class="round" id="journal-button"></button><button class="round" id="menu"></button></div>
    </div>
    <div id="cue" class="cue" hidden><div id="cue-icon"></div><span id="cue-text" role="status" aria-live="polite"></span><button id="cue-close"></button></div>
    <div class="dock">
      <div id="context-row" hidden><button id="interact" class="context-act"></button><button id="other-near" class="context-more" hidden></button></div>
      <div class="travel-controls">
        <button id="receptor-button" class="receptor-control"></button>
        <div class="travel-buttons"><button id="back-step" class="back-step"></button><button id="forward" class="primary advance"></button></div>
      </div>
    </div>
  </section>
</main>
<dialog id="overlay" aria-labelledby="dialog-title"><div id="dialog-inner"></div></dialog>
<noscript><p>Enable JavaScript to explore. Ative o JavaScript para explorar.</p></noscript>
<script type="module" src="./journey.js"></script>
</body>
</html>
