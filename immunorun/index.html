<script>
// ========================================
// IMUNO RUN - Fuga Bacteriana
// ========================================

if(typeof CanvasRenderingContext2D!=='undefined'&&!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Array.isArray(r)?r[0]:r;r=Math.max(0,Math.min(+r||0,Math.abs(w)/2,Math.abs(h)/2));
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
const COARSE = window.matchMedia ? matchMedia('(pointer:coarse)').matches : false;
const BTN_Y = COARSE ? 80 : 450-34; // = GH-34
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- Fixed internal resolution (zoom-proof) ---
const GH = 450;
// Largura acompanha a proporção da tela: celular deitado (mais largo que 16:9) fica com a tela cheia
const GW = Math.round(Math.min(1100,Math.max(800,GH*window.innerWidth/Math.max(1,window.innerHeight))));
// Nitidez em telas retina: o canvas tem mais pixels, mas o jogo continua em coordenadas GW x GH
const DPR = Math.min(2, window.devicePixelRatio || 1);
canvas.width = Math.round(GW*DPR);
canvas.height = Math.round(GH*DPR);
ctx.setTransform(DPR,0,0,DPR,0,0);
ctx.imageSmoothingQuality = 'high';

function resizeCanvas(){
  const ar=GW/GH,vw=window.innerWidth,vh=window.innerHeight;
  let w,h;
  if(vw/vh>ar){h=vh;w=h*ar;}else{w=vw;h=w/ar;}
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  canvas.style.margin=((vh-h)/2)+'px auto 0';
}
window.addEventListener('resize',resizeCanvas);resizeCanvas();

// --- Fixed game constants ---
const GROUND_Y     = 360;
const PLAYER_W     = 50;
const PLAYER_H     = 35;
const DUCK_H       = 15;
const MACRO_W      = 85;
const MACRO_H      = 55;
const GRAVITY      = 0.52;
const JUMP_FORCE   = -12;
const BASE_SPEED   = 7.5;
let MIN_GAP = 40;  // espaçamento mínimo: com isso toda sequência é vencível sem contato (testado)

// --- Fixed timestep (60fps logic regardless of display Hz) ---
const TARGET_FPS  = 60;
const FRAME_TIME  = 1000 / TARGET_FPS;
let lastTimestamp = 0;
let accumulator   = 0;

// ===== Kit de polimento: fontes, áudio suave, efeitos =====
const FONT='Fredoka, "Segoe UI", Arial, sans-serif', MONO='"Rubik Mono One", "Courier New", monospace';
if(document.fonts){document.fonts.load('700 32px Fredoka');document.fonts.load('400 20px "Rubik Mono One"');}
// Storage may be blocked (private mode, embedded browser, local file).
function lsGet(k, fallback=''){try{return localStorage.getItem(k)??fallback;}catch(_){return fallback;}}
function lsSet(k,v){try{localStorage.setItem(k,String(v));return true;}catch(_){return false;}}
let muted=lsGet('imuno_mute')==='1';
let audioCtx=null, masterGain=null;
function initAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
    masterGain=audioCtx.createGain();masterGain.gain.value=muted?0:0.7;masterGain.connect(comp);comp.connect(audioCtx.destination);}catch(e){return;}}
  if(audioCtx.state==='suspended')audioCtx.resume();
}
function toggleMute(){muted=!muted;lsSet('imuno_mute',muted?'1':'0');if(masterGain)masterGain.gain.value=muted?0:0.7;}
// tone(freq, dur s, {type, vol, slide(freq final), attack, cutoff}) — com envelope e filtro, sem estalos
function tone(f,d,o={}){
  if(!audioCtx||!masterGain)return;
  try{const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),g=audioCtx.createGain(),lp=audioCtx.createBiquadFilter();
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+d);
    lp.type='lowpass';lp.frequency.value=o.cutoff||2400;
    const v=o.vol||0.05,a=o.attack||0.008;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0005,t+d);
    osc.connect(lp);lp.connect(g);g.connect(masterGain);osc.start(t);osc.stop(t+d+0.02);}catch(e){}
}
function chord(notes,d,o={},gap=0.07){notes.forEach((n,i)=>setTimeout(()=>tone(n,d,o),i*gap*1000));}
function noiseBurst(d,vol=0.05,cutoff=800){
  if(!audioCtx||!masterGain)return;
  try{const t=audioCtx.currentTime,len=Math.floor(audioCtx.sampleRate*d),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
    const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),lp=audioCtx.createBiquadFilter();src.buffer=buf;lp.type='lowpass';lp.frequency.value=cutoff;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0005,t+d);src.connect(lp);lp.connect(g);g.connect(masterGain);src.start(t);}catch(e){}
}
function vignette(w,h,strength=0.5){const g=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.42,w/2,h/2,Math.max(w,h)*0.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+strength+')');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}
const MUTE_BTN={x:GW-40,y:BTN_Y,w:28,h:24};
function drawMuteBtn(){const b=MUTE_BTN;ctx.save();ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,7);ctx.fill();ctx.font='14px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText(muted?'🔇':'🔊',b.x+b.w/2,b.y+b.h/2+1);ctx.restore();}
function muteHit(x,y){const b=MUTE_BTN;return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}

// --- Sons (suaves, com envelope) ---
function sndJump()     { tone(420,0.14,{slide:760,vol:0.05}); }
function sndHit()      { noiseBurst(0.18,0.08,600); tone(120,0.25,{type:'triangle',slide:60,vol:0.06}); }
function sndSlide()    { noiseBurst(0.12,0.03,1200); }
function sndScore()    { chord([660,880],0.1,{vol:0.03}); }
function sndDodge()    { tone(1200,0.05,{vol:0.02}); }
function sndPowerUp()  { chord([523,659,784,1047],0.18,{vol:0.05}); }
function sndShieldHit(){ tone(500,0.2,{type:'triangle',slide:250,vol:0.05}); }
function sndCount()    { tone(600,0.08,{vol:0.04}); }
function sndGo()       { chord([784,1047],0.2,{vol:0.05}); }
function sndDie()      { tone(300,0.5,{type:'triangle',slide:80,vol:0.06}); noiseBurst(0.4,0.05,400); }
function sndPhago()    { tone(160,0.6,{type:'triangle',slide:50,vol:0.06}); }
function sndWin()      { chord([523,659,784,1047,1319],0.35,{vol:0.05},0.09); }

// ===== Música procedural: groove animado + camada de tensão ligada ao perigo =====
// Tudo sintetizado com Web Audio (sem arquivos). A camada de tensão sobe quando o macrófago se aproxima.
const MUSIC={on:false,out:null,main:null,tens:null,timer:null,step:0,next:0,lvl:0,shown:-1,
  enabled:lsGet('immunorun_music','1')!=='0'};
const PROG=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]];           // Dó · Sol · Lá m · Fá
const MEL=[[72,0,0,76,0,0,79,0,77,0,76,0,74,0,0,0],[74,0,0,71,0,0,74,0,79,0,77,0,74,0,0,0],
           [72,0,0,76,0,0,81,0,79,0,76,0,72,0,0,0],[77,0,0,76,0,0,74,0,72,0,74,0,76,0,79,0]];
const mf=m=>440*Math.pow(2,(m-69)/12);
function mNote(dest,f,t,d,o={}){
  try{const osc=audioCtx.createOscillator(),g=audioCtx.createGain(),lp=audioCtx.createBiquadFilter();
    osc.type=o.type||'square';osc.frequency.setValueAtTime(f,t);if(o.slide)osc.frequency.exponentialRampToValueAtTime(o.slide,t+d);
    lp.type='lowpass';lp.frequency.value=o.cut||2000;const v=o.vol||0.02;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.005);g.gain.exponentialRampToValueAtTime(0.0004,t+d);
    osc.connect(lp);lp.connect(g);g.connect(dest);osc.start(t);osc.stop(t+d+0.02);}catch(e){}
}
let noiseBuf=null;
function mNoise(dest,t,d,vol,cut,hp){
  try{if(!noiseBuf){const len=audioCtx.sampleRate*0.5;noiseBuf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);const c=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)c[i]=Math.random()*2-1;}
    const s=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();s.buffer=noiseBuf;
    f.type=hp?'highpass':'lowpass';f.frequency.value=cut;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0004,t+d);
    s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+d+0.02);}catch(e){}
}
function musicStep(s,t){
  const bar=Math.floor(s/16)%4,i=s%16,ch=PROG[bar],L=MUSIC.lvl,M=MUSIC.main,T=MUSIC.tens;
  // Bateria (base)
  if(i%4===0) mNote(M,150,t,0.16,{type:'sine',slide:42,vol:0.11,cut:900});
  if(i===4||i===12) mNoise(M,t,0.13,0.05,1800,true);
  if(i%4===2) mNoise(M,t,0.04,0.018,7000,true);
  // Baixo saltitante
  if(i%2===0) mNote(M,mf(ch[0]-24+(i%4===2?12:0)),t,0.13,{type:'triangle',vol:0.07,cut:700});
  // Arpejo
  mNote(M,mf(ch[i%3]+(i>=8?12:0)),t,0.08,{vol:0.012,cut:2600});
  // Melodia
  const m=MEL[bar][i]; if(m) mNote(M,mf(m),t,0.2,{type:'triangle',vol:0.05,cut:3000});
  // Tensão: pulso grave, chimbal dobrado, batimento cardíaco e alarme agudo
  if(L>0.02){
    mNote(T,mf(ch[0]-24),t,0.09,{type:'sawtooth',vol:0.035,cut:250+1300*L});
    if(i%4!==2) mNoise(T,t,0.03,0.014,8000,true);
    if(i===0||i===3) mNote(T,90,t,0.18,{type:'sine',slide:38,vol:0.13,cut:600});
    if(L>0.55&&i%8===6) mNote(T,mf(ch[0]+30),t,0.09,{vol:0.016,cut:3500,slide:mf(ch[0]+29)});
  }
}
function musicTick(){
  if(!audioCtx||!MUSIC.on)return;
  while(MUSIC.next<audioCtx.currentTime+0.12){
    musicStep(MUSIC.step,MUSIC.next);
    MUSIC.next+=60/(126+MUSIC.lvl*24)/4;   // acelera de 126 para 150 BPM no aperto
    MUSIC.step++;
  }
}
function musicStart(){
  if(!audioCtx||MUSIC.on)return;
  const t=audioCtx.currentTime;
  MUSIC.out=audioCtx.createGain();MUSIC.out.gain.setValueAtTime(0,t);MUSIC.out.gain.linearRampToValueAtTime(0.75,t+0.5);MUSIC.out.connect(masterGain);
  MUSIC.main=audioCtx.createGain();MUSIC.main.connect(MUSIC.out);
  MUSIC.tens=audioCtx.createGain();MUSIC.tens.gain.value=0;MUSIC.tens.connect(MUSIC.out);
  MUSIC.step=0;MUSIC.next=t+0.06;MUSIC.shown=-1;MUSIC.on=true;MUSIC.timer=setInterval(musicTick,25);musicTick();
}
function musicStop(){
  if(!MUSIC.on)return;
  MUSIC.on=false;clearInterval(MUSIC.timer);
  const o=MUSIC.out,t=audioCtx.currentTime;
  try{o.gain.cancelScheduledValues(t);o.gain.setValueAtTime(o.gain.value,t);o.gain.linearRampToValueAtTime(0,t+0.35);}catch(e){}
  setTimeout(()=>{try{o.disconnect();}catch(e){}},500);
}
function musicSync(){
  const want=MUSIC.enabled&&!!audioCtx&&['playing','countdown'].includes(state);
  if(want&&!MUSIC.on)musicStart(); else if(!want&&MUSIC.on)musicStop();
  // Tensão começa com perigo ~0,45 e é máxima perto de 0,85
  const target=state==='playing'?Math.max(0,Math.min(1,(danger-0.45)/0.4)):0;
  MUSIC.lvl+=(target-MUSIC.lvl)*0.04;
  if(MUSIC.on&&Math.abs(MUSIC.lvl-MUSIC.shown)>0.01){
    const t=audioCtx.currentTime;MUSIC.shown=MUSIC.lvl;
    MUSIC.tens.gain.setTargetAtTime(MUSIC.lvl,t,0.15);
    MUSIC.main.gain.setTargetAtTime(1-0.4*MUSIC.lvl,t,0.15);
  }
}
function toggleMusic(){MUSIC.enabled=!MUSIC.enabled;lsSet('immunorun_music',MUSIC.enabled?'1':'0');musicSync();}
const MUSIC_BTN={x:GW-108,y:BTN_Y,w:28,h:24};
function drawMusicBtn(){const b=MUSIC_BTN;ctx.save();ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,7);ctx.fill();ctx.font='700 14px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=MUSIC.enabled?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.35)';ctx.fillText('♪',b.x+b.w/2,b.y+b.h/2+1);if(!MUSIC.enabled){ctx.strokeStyle='rgba(255,120,120,0.85)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x+7,b.y+b.h-5);ctx.lineTo(b.x+b.w-7,b.y+5);ctx.stroke();}ctx.restore();}
function musicHit(x,y){const b=MUSIC_BTN;return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}

const EDU_GUIDE = [
 {id:'bact',art:'bact',name:'Bactéria',tag:'Microrganismo · protagonista',short:'Nesta história, uma bactéria ultrapassou uma barreira e entrou no tecido.',body:'Bactérias são células, não vírus. Existem muitas formas e modos de vida; nem todas causam doença. Aqui representamos uma bactéria invasora genérica, sem atribuir uma espécie. Flagelos podem contribuir para a motilidade; pili têm funções que dependem do tipo de estrutura.',game:'Você controla a fuga. Pular, abaixar, expressões e faixas de corrida são convenções de um runner. Fugir nesta rodada não demonstra que uma infecção se estabeleceu.',limit:'Forma, cor, estruturas e comportamento não permitem identificar uma espécie. O desenho não é uma micrografia nem uma reconstrução anatômica.',sources:[]},
 {id:'macro',art:'macro',name:'Macrófago',tag:'Célula · imunidade inata',short:'Reconhece alvos, engloba material e participa da resposta do tecido.',body:'Muitos tecidos já contêm macrófagos residentes antes da chegada de uma bactéria. Receptores participam do reconhecimento; pseudópodes envolvem o alvo, formando um fagossomo. A maturação desse compartimento e sua interação com lisossomos favorecem a destruição do material ingerido. Reconhecimento, internalização e morte microbiana são etapas distintas.',game:'É o perseguidor principal. Sua aproximação representa pressão imune agregada; não é uma medida de velocidade, força ou probabilidade real. A cena final representa englobamento, não uma confirmação experimental da morte da bactéria.',limit:'Não tem boca, dentes, olhos ou intenção. Pode reconhecer alvos sem anticorpos; opsoninas facilitam certas formas de reconhecimento, mas não são uma exigência universal.',sources:['c3b','bio','phago']},
 {id:'neut',art:'neut',name:'Neutrófilo',tag:'Célula · imunidade inata',short:'Outro fagócito: não é apenas uma barreira no caminho.',body:'Neutrófilos são geralmente os leucócitos mais abundantes no sangue de adultos humanos saudáveis e estão entre os primeiros leucócitos recrutados em muitas inflamações agudas. Isso não significa que sejam as primeiras células presentes no tecido. Migram guiados por sinais e podem fagocitar e usar mecanismos antimicrobianos. Seu núcleo é segmentado em lóbulos conectados.',game:'Neutrófilos nas faixas baixa e alta exigem pular ou abaixar. Um contato aumenta a pressão da perseguição. O jogo tolera alguns contatos para não encerrar cada tentativa imediatamente.',limit:'Na biologia, o próprio neutrófilo pode fagocitar. As duas faixas não são posições anatômicas; o macrófago não executa sozinho toda a defesa.',sources:['neut','igg']},
 {id:'ab',art:'ab',name:'Anticorpo IgG',tag:'Proteína · imunidade adaptativa',short:'Pode marcar um alvo reconhecido para facilitar sua captura.',body:'Anticorpos secretados são produzidos por células B diferenciadas em células secretoras, como plasmócitos. A região Fab reconhece um epítopo; a região Fc pode interagir com receptores Fcγ em fagócitos. IgG ligada à superfície pode favorecer fagocitose. Outros efeitos, como neutralização ou ativação do complemento, dependem do anticorpo e do contexto.',game:'O contato acrescenta um pequeno Y à bactéria e aumenta a pressão de captura. Assumimos que as IgG mostradas reconhecem esta bactéria e já estavam disponíveis antes da rodada.',limit:'IgG não é um projétil e não causa dano por impacto. O jogo não simula afinidade, subclasses, concentração, origem dos anticorpos nem o tempo necessário para uma nova resposta adaptativa.',sources:['igg']},
 {id:'c3b',art:'c3b',name:'C3b',tag:'Fragmento proteico · complemento',short:'Marca superfícies e participa da amplificação do complemento.',body:'A clivagem de C3 gera C3a e C3b. C3b pode se ligar a superfícies e participar da formação de convertases. C3b e seus derivados têm funções diferentes: iC3b, por exemplo, é reconhecido por CR3/CR4; C3b pode ser reconhecido por CR1 e CRIg. Receptores e estado de ativação do fagócito influenciam a captura.',game:'Acrescenta uma marca turquesa à bactéria. O jogo reúne várias etapas de opsonização em uma só interação.',limit:'C3b não é o poro que perfura a bactéria. Essa função é do complexo de ataque à membrana, C5b–9 (MAC), em alvos suscetíveis. Não confunda C3b, iC3b e C5a. Há vias de ativação do complemento que não dependem de anticorpos.',sources:['c3b','ic3b','mac']},
 {id:'tnf',art:'tnf',name:'TNF-α',tag:'Citocina · sinalização',short:'Um sinal para células do hospedeiro, não uma pedra contra a bactéria.',body:'TNF atua por receptores em células do hospedeiro. Pode ativar o endotélio e favorecer a adesão e o recrutamento de leucócitos, em conjunto com outros mediadores. Quimiocinas, como CXCL8, ajudam a orientar neutrófilos. TNF não deve ser apresentado como se fosse equivalente a uma quimiocina ou a um antibiótico.',game:'O sinal sobe até o endotélio ilustrado e é captado ali; em seguida chegam mais neutrófilos. Ele nunca alcança a bactéria. Não colide com a bactéria, não gera tombo e não é bloqueado pelo bônus de biofilme. O efeito do jogo não depende de encostar na bactéria.',limit:'A sequência rápida TNF → reforços comprime várias etapas. Nem toda citocina recruta, nem toda inflamação é benéfica; contexto, intensidade e duração importam. O trímero desenhado é estilizado.',sources:['tnf','cxcl8']},
 {id:'bio',art:'bio',name:'Biofilme',tag:'Comunidade microbiana + matriz',short:'Pode dificultar a eliminação de microrganismos; não é invulnerabilidade.',body:'Biofilmes contêm microrganismos associados a uma matriz extracelular. A organização da comunidade e a matriz podem dificultar a ação de defesas do hospedeiro e de alguns tratamentos. Isso depende do microrganismo, da matriz e do ambiente; não vale como proteção absoluta.',game:'O coletável concede uma proteção temporária contra uma interação direta. É um bônus inspirado em biofilme, não a formação instantânea de um biofilme verdadeiro. O efeito de TNF sobre o hospedeiro continua ativo.',limit:'Uma bactéria não coleta uma comunidade pronta e a veste como uma bolha. Biofilme não é sinônimo de cápsula, nem de resistência genética a antibióticos. O bônus não apaga marcas já ligadas à bactéria.',sources:['bio']}
];
const EDU_LIMITS = [
 {title:'TNF não atinge a bactéria como um projétil',status:'Representado na mecânica',game:'TNF não colide com a bactéria: ele sinaliza ao endotélio ilustrado e favorece a chegada de neutrófilos.',body:'O alvo da sinalização são células do hospedeiro. O recrutamento envolve adesão, migração e vários mediadores; a sequência do jogo é uma compressão, não uma cinética real.',refs:['tnf','cxcl8']},
 {title:'IgG e C3b marcam; não dão uma pancada',status:'Representado na mecânica',game:'O contato deixa marcas persistentes na bactéria, sem a reação de impacto do neutrófilo.',body:'Marcas favorecem reconhecimento por receptores apropriados. Opsonização não equivale a neutralização, morte por impacto ou garantia de fagocitose. C3b e iC3b não têm os mesmos receptores.',refs:['igg','c3b','ic3b']},
 {title:'C3b não é o complexo de ataque à membrana',status:'Distinção explícita',game:'C3b representa opsonização. Não há lise pelo MAC simulada nesta versão.',body:'O MAC é C5b–9. A deposição de C3b pode participar da cascata que leva à montagem do MAC, mas C3b isoladamente não é um poro. A suscetibilidade à lise varia entre alvos.',refs:['mac']},
 {title:'Neutrófilos também fagocitam',status:'Simplificação mantida e explicada',game:'Contatos aumentam o perigo; somente o macrófago encerra a rodada por captura.',body:'A tolerância a contatos é uma regra arcade. Neutrófilos não são objetos passivos. “Entre os primeiros recrutados” não significa “sempre os primeiros presentes”; macrófagos residentes e outras células já estão no tecido.',refs:['neut','igg']},
 {title:'Biofilme não é um escudo portátil',status:'Bônus identificado como metáfora',game:'O bônus tem duração curta e absorve uma interação direta; não impede a sinalização de TNF nem remove opsoninas já aderidas.',body:'Matriz, comunidade e tempo de formação foram omitidos. Biofilme e cápsula são conceitos diferentes. O jogo não ensina que a matriz protege de tudo ou que um único contato destrói um biofilme real.',refs:['bio']},
 {title:'Não é preciso anticorpo para toda fagocitose',status:'Distinção explícita',game:'O macrófago pode capturar a bactéria mesmo sem marcas.',body:'Fagócitos reconhecem diferentes alvos por mecanismos distintos. Opsoninas aumentam a eficiência em muitos contextos; não constituem uma autorização obrigatória para toda captura.',refs:['c3b','bio']},
 {title:'Apresentação de antígeno não é ativação automática de T',status:'Distinção explícita',game:'O jogo não afirma que o macrófago, sozinho, ativa células T.',body:'Macrófagos podem apresentar peptídeos em MHC II a T CD4+. A ativação de T virgens depende de sinais adicionais e é tipicamente iniciada por células dendríticas. Capturar antígeno, apresentá-lo e ativar uma célula T não são o mesmo evento.',refs:['dc']},
 {title:'M1/M2 não são dois tipos fixos de macrófago',status:'Distinção explícita',game:'A regra binária M1 = inflamação / M2 = reparo não é usada para explicar o perseguidor.',body:'M1/M2 são rótulos simplificados de condições e programas de ativação. Macrófagos apresentam estados diversos, influenciados pelos estímulos e pelo tecido; suas funções não cabem em duas caixas.',refs:['spectrum']},
 {title:'Englobar não confirma eliminação',status:'Desfecho explicado',game:'“Fagocitado” significa que o macrófago englobou a bactéria. O jogo não mede se ela morreu.',body:'O alvo é internalizado em um compartimento. Processos posteriores participam de sua destruição, e alguns microrganismos conseguem sobreviver no interior de fagócitos. O desaparecimento do sprite é uma animação, não um ensaio de viabilidade.',refs:['phago']},
 {title:'Tempo, distância e tamanho não são reais',status:'Pontos e relógio explicitamente arcade',game:'A pontuação usa “pts”, não metros. Completar o tempo significa escapar nesta rodada; não implica replicação ou infecção estabelecida.',body:'Moléculas são muito menores que bactérias e leucócitos. A escala foi alterada para permitir enxergá-las. O relógio não informa tempos de migração, produção de IgG, formação de biofilme ou divisão bacteriana. As etapas didáticas organizam assuntos, não uma cronologia obrigatória.',refs:[]},
 {title:'Olhos, cores, faixas e movimento são arte',status:'Licença visual mantida',game:'As cores ajudam a distinguir elementos. Pular e abaixar continuam sendo os controles; neutrófilos ocupam duas faixas.',body:'Essas cores não são naturais obrigatórias. Células e moléculas não têm rostos. Bactérias não escapam pulando sobre anticorpos. Pseudópodes, flagelo e domínios das proteínas são estilizações, não modelos anatômicos exatos.',refs:[]},

 {id:'q5',topic:'Sinalização',q:'Depois do sinal de TNF, aparecem mais neutrófilos. Qual mecanismo o jogo está resumindo?',opts:['Ativação de células do hospedeiro e favorecimento do recrutamento de leucócitos.','TNF transformando-se fisicamente em neutrófilos.','TNF atingindo a bactéria como uma pedra.'],answer:0,explain:'TNF pode favorecer a adesão de leucócitos ao endotélio. Outros sinais, incluindo quimiocinas, participam do recrutamento. TNF não se transforma em uma célula.',why:['','Neutrófilos são células preexistentes, não moléculas de TNF transformadas.','Neste jogo TNF não colide com a bactéria: ele atua na representação do hospedeiro.'],sources:['tnf','cxcl8']},
 {id:'q6',topic:'Sinalização',q:'Qual distinção evita confundir uma citocina com um fagócito?',opts:['TNF e neutrófilo são o mesmo tipo de célula, em tamanhos diferentes.','Toda citocina mata diretamente qualquer bactéria.','TNF é um sinal; neutrófilos são células que respondem a sinais e podem fagocitar.'],answer:2,explain:'Moléculas sinalizadoras modificam o comportamento de células que têm os receptores apropriados. Nem toda citocina recruta e nem toda sinalização tem o mesmo efeito.',why:['Uma citocina é uma proteína, não uma célula pequena.','Funções de citocinas dependem de receptor, contexto, dose e tempo.',''],sources:['tnf','neut']},
 {id:'q7',topic:'Biofilme',q:'O bônus de biofilme protege por alguns segundos. Qual conclusão sobre biofilmes reais seria incorreta?',opts:['Sua matriz pode dificultar a ação de defesas do hospedeiro.','Uma bactéria pode vestir uma bolha instantânea que a torna invulnerável.','Microrganismos podem estar associados a uma matriz extracelular.'],answer:1,explain:'A bolha é uma convenção arcade. Biofilme envolve uma comunidade e sua matriz; proteção varia com o contexto e não é absoluta.',why:['Essa afirmação é compatível com o que se sabe sobre biofilmes; não é a conclusão incorreta.','','Essa descrição corresponde à organização real de biofilmes; não é a conclusão incorreta.'],sources:['bio']},
 {id:'q8',topic:'Transferência',q:'Em um experimento, você bloqueia o reconhecimento de opsoninas pelo fagócito. Qual previsão é mais razoável?',opts:['A vantagem da marcação pode diminuir, embora outras vias de reconhecimento possam continuar.','Nenhuma bactéria poderá mais ser fagocitada em qualquer condição.','C3b passará a matar por impacto físico.'],answer:0,explain:'A marca só ajuda se puder ser reconhecida por mecanismos apropriados. Interferir em uma via não equivale a abolir todas as vias de captura. É uma previsão qualitativa, não um efeito quantitativo universal.',why:['','Bloquear uma via não elimina necessariamente todas as formas de fagocitose.','Bloquear receptores não transforma C3b em projétil.'],sources:['igg','c3b','ic3b']}

 <section class="ed-box"><span class="ed-kicker">PARA COMEÇAR</span><h3>Aprender jogando</h3><p>Quatro etapas curtas, uma ideia por vez. Experimente a mecânica e responda a duas perguntas com explicação.</p><p class="ed-small">Sem derrota durante a prática. Sem limite de tempo nas perguntas.</p>${btn('COMEÇAR A TRILHA','intro','0','primary')}${btn('Escolher uma etapa','nav','learn','subtle')}</section>

function eduLearnHTML(){const n=Object.keys(learnProgress.answers).length,correct=Object.values(learnProgress.answers).filter(a=>a.correct).length;

 `<div class="ed-progress"><span>${n}/8 perguntas respondidas</span><span>${correct} corretas na primeira resposta</span><span>${eduStorageOK?'Salvo somente neste navegador':'Só nesta sessão: armazenamento indisponível'}</span></div>`+
 `<div class="ed-stage-grid">${EDU_STAGES.map((s,i)=>{const p=learnProgress.steps[s.id]||{};return `<section class="ed-box ed-stage">${eduImage(s.art)}<div class="ed-kicker">${s.tag}</div><h3>${s.title}</h3><p>${s.body}</p><p class="ed-small">${p.done?'Etapa concluída':p.run?'Prática feita · perguntas pendentes':'Disponível'} · ${s.secs}s de prática</p>${btn(p.done?'REVISAR ETAPA':'ABRIR ETAPA','intro',String(i),'primary')}</section>`;}).join('')}</div>`+

function eduIntroHTML(){const s=EDU_STAGES[learningStage];return eduHeading(s.tag,s.title)+`<div class="ed-feature">${eduImage(s.art)}<div><p>${s.body}</p>${flowHTML(s.flow)}</div></div><section class="ed-callout"><h3>Experimente na corrida</h3><p>${s.mission}</p></section><p class="ed-small">A prática dura ${s.secs}s. Não há derrota nesta trilha; errar o movimento não impede aprender. Depois, duas perguntas sem cronômetro.</p><div class="ed-actions">${btn('COMEÇAR A PRÁTICA','practice','','primary')}${btn('Ir direto às perguntas','skipPractice','','subtle')}${btn('Voltar às etapas','nav','learn','subtle')}</div>`;}

function eduQuizHTML(){const s=EDU_STAGES[learningStage],q=EDU_QUESTIONS[s.q[eduQuizIndex]],a=learnProgress.answers[q.id];return eduHeading(s.tag,'O que explica o que você viu?')+eduObservationHTML(learningStage)+questionHTML(q,`PERGUNTA ${eduQuizIndex+1} DE ${s.q.length}`)+`<div class="ed-actions">${a?btn(eduQuizIndex+1<s.q.length?'PRÓXIMA PERGUNTA':'CONCLUIR ETAPA','nextQuestion','','primary'):''}${btn('Consultar a ficha','guide',s.ids[0],'subtle')}${btn('Sair sem concluir as perguntas','leaveQuiz','','subtle')}</div>`;}
function eduObservationHTML(i){if(!eduFlow||!eduFlow.practice)return '<p class="ed-observation">Você foi direto às perguntas. Nenhum resultado de prática é atribuído a esta etapa.</p>';
 let t='';if(i===0)t=`Nesta prática: ${runStats.contacts.NEUTROFILO} contato(s) com neutrófilos. Contato no jogo não prova fagocitose na biologia.`;
 else if(i===1){const n=runStats.contacts.ANTICORPO+runStats.contacts.COMPLEMENTO;t=n?`Você recebeu ${runStats.contacts.ANTICORPO} marca(s) de IgG e ${runStats.contacts.COMPLEMENTO} de C3b. Observe como o perigo muda com a marcação.`:'Você evitou as opsoninas. Ao repetir, deixe uma encostar para observar a marca; ela não dá uma pancada na bactéria.';}
 else if(i===2)t=`Houve ${runStats.signals} sinal(is) de TNF no endotélio ilustrado, sem colisão de TNF com a bactéria.`;
 else t=`Você coletou ${runStats.collected} bônus e absorveu ${runStats.absorbed} interação(ões). Ocorreram ${runStats.signals} sinal(is) de TNF, independentes da proteção.`;
 return `<p class="ed-observation">${t}</p>`;}
function eduDoneHTML(){const s=EDU_STAGES[learningStage],c=s.q.filter(i=>learnProgress.answers[EDU_QUESTIONS[i].id]?.correct).length;return eduHeading(s.tag,'Etapa concluída.',`${c} de ${s.q.length} respostas corretas na primeira tentativa. Leia o retorno das que errou e compare os mecanismos.`)+flowHTML(s.flow)+`<section class="ed-callout"><h3>Leve esta distinção para fora do jogo</h3><p>${['Reconhecer, englobar e eliminar não são o mesmo evento. Macrófagos e neutrófilos são fagócitos.','Marcar não é perfurar. IgG e C3b podem facilitar o reconhecimento por fagócitos; C5b–9 é o MAC.','Um sinal muda o comportamento de uma célula que possui receptores apropriados. TNF não é um projétil contra bactérias.','Uma proteção pode ser parcial. A vantagem de uma opsonina depende também do reconhecimento pelo fagócito.'][learningStage]}</p></section><div class="ed-actions">${learningStage<3?btn('PRÓXIMA ETAPA','intro',String(learningStage+1),'primary'):btn('JOGAR NO MODO ARCADE','arcade','','primary')}${btn('Rever perguntas','quizReview','','subtle')}${btn('Ver meu progresso','nav','learn','subtle')}</div>`;}
function eduGuideHTML(){const g=EDU_GUIDE.find(x=>x.id===eduGuideID)||EDU_GUIDE[0];return eduHeading('GUIA IMUNOLÓGICO','Conheça o que aparece na corrida')+`<div class="ed-guide"><nav class="ed-guide-list" aria-label="Personagens e moléculas">${EDU_GUIDE.map(x=>`<button class="ed-guide-item${x.id===g.id?' current':''}" data-act="guide" data-value="${x.id}" aria-pressed="${x.id===g.id}">${eduImage(x.art)}<span>${x.name}</span></button>`).join('')}</nav><article class="ed-guide-detail"><div class="ed-feature">${eduImage(g.art)}<div><div class="ed-kicker">${g.tag}</div><h3>${g.name}</h3><p class="ed-lead">${g.short}</p></div></div><h4>No corpo</h4><p>${g.body}</p><h4>No jogo</h4><p>${g.game}</p><div class="ed-callout"><h4>Não confunda</h4><p>${g.limit}</p></div>${g.sources.length?`<p class="ed-refs">${sourceLinks(g.sources)}</p>`:'<p class="ed-small">Descrição do cenário e das licenças visuais.</p>'}</article></div>`;}
function eduLimitsHTML(){return eduHeading('JOGO × BIOLOGIA','O que o jogo representa. O que ainda é metáfora.','A diversão permite simplificar a representação. Não deve trocar o mecanismo por outro sem avisar.')+EDU_LIMITS.map((x,i)=>`<details class="ed-limit"${i===0?' open':''}><summary><span>${x.title}</span><small>${x.status}</small></summary><div><h4>No jogo</h4><p>${x.game}</p><h4>Na biologia</h4><p>${x.body}</p>${x.refs.length?`<p class="ed-refs">${sourceLinks(x.refs)}</p>`:''}</div></details>`).join('');}
function eduCreditsHTML(){return eduHeading('IMMUNORUN · IMMUNO.GAMES','Créditos')+`<div class="ed-credit-grid">${EDU_CREDITS.map(x=>`<section class="ed-box"><div class="ed-kicker">${x.role}</div><h3>${x.name}</h3><p>${x.text}</p>${x.instagram?'<a class="ed-btn subtle" href="https://www.instagram.com/helder_nakaya/" target="_blank" rel="noopener noreferrer">Instagram · @helder_nakaya ↗</a>':''}</section>`).join('')}</div><p class="ed-small">A atribuição separa a ideia e o primeiro protótipo da finalização e da revisão científica.</p><section class="ed-callout"><h3>Sobre esta versão</h3><p>Jogo educativo sobre fagocitose, opsonização, sinalização inflamatória e evasão bacteriana. As imagens são representações artísticas geradas com auxílio de IA; não são micrografias ou modelos moleculares validados.</p><p>Conteúdo revisado em outubro de 2026. Os estudos usados e o que sustentam estão na aba Fontes. O jogo não é um simulador clínico.</p></section>`;}
function eduSourcesHTML(){return eduHeading('LEITURAS E EVIDÊNCIAS','Fontes da revisão','Estudos de sistemas e condições específicos. Eles fundamentam os mecanismos explicados; não validam as velocidades, probabilidades ou efeitos numéricos do jogo.')+EDU_SOURCES.map((s,i)=>`<section class="ed-source"><span class="ed-source-n">${String(i+1).padStart(2,'0')}</span><div><h3><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.title}</a></h3><p>${s.cite}</p></div></section>`).join('')+`<p class="ed-small">As fichas resumem mecanismos gerais e não substituem um curso de imunologia. Onde há uma licença de jogo, ela está identificada em Jogo × biologia.</p>`;}
function eduControlsHTML(){return eduHeading('CONTROLES','Pule células. Entenda os sinais.')+`<div class="ed-mode-grid"><section class="ed-box"><h3>Teclado e mouse</h3><p><kbd>Espaço</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> ou clique: pular.</p><p><kbd>↓</kbd> / <kbd>S</kbd>, segure: abaixar.</p><p><kbd>P</kbd> / <kbd>Esc</kbd>: pausa. <kbd>G</kbd>: guia. <kbd>M</kbd>: música.</p></section><section class="ed-box"><h3>Celular</h3><p>Toque ou deslize para cima: pular.</p><p>Deslize para baixo e segure: abaixar. Solte para levantar.</p><p>Os botões PULAR e ABAIXAR também ficam disponíveis durante a corrida.</p></section></div><section class="ed-callout"><p><b>Seta ↑ / PULE:</b> neutrófilos baixos, IgG e C3b.</p><p><b>Seta ↓ / ABAIXE:</b> neutrófilos altos.</p><p><b>SINAL TNF:</b> não colide; ativa o endotélio ilustrado e favorece a chegada de neutrófilos.</p><p><b>Biofilme:</b> bônus inspirado em matriz protetora. Não bloqueia TNF e não apaga marcas.</p></section><p class="ed-small">A barra de perigo é risco para a bactéria no jogo. Não é uma medida da saúde do hospedeiro.</p>${btn('VOLTAR','nav','play','primary')}`;}
function eduPauseHTML(){return eduHeading(learningRun?EDU_STAGES[learningStage].tag:'MODO ARCADE','Corrida pausada',`${Math.max(0,Math.ceil((targetFrames-elapsed)/60))}s restantes no relógio do jogo.`)+`<section class="ed-callout"><p>IgG e C3b deixam marcas; TNF sinaliza ao endotélio. Neutrófilos podem aparecer na faixa baixa ou alta. O coletável é uma metáfora de proteção por biofilme.</p></section><div class="ed-actions">${btn('CONTINUAR','close','','primary')}${btn('Abrir o guia','nav','guide','subtle')}${btn('Ver controles','nav','controls','subtle')}${btn('Reiniciar esta corrida','restart','','subtle')}${btn('Sair para o menu','exit','','subtle')}</div>`;}
function chooseReportQuestion(){if(runStats.signals)return EDU_QUESTIONS[4];if(runStats.contacts.COMPLEMENTO)return EDU_QUESTIONS[3];if(runStats.contacts.ANTICORPO)return EDU_QUESTIONS[2];if(runStats.collected)return EDU_QUESTIONS[6];return EDU_QUESTIONS[0];}
function eduReportHTML(){const won=eduReturnState==='won';return eduHeading('SUA RODADA',won?'Você escapou nesta rodada.':'O macrófago englobou a bactéria.',won?'O cronômetro terminou. Isso não demonstra replicação ou infecção estabelecida.':'A captura encerra o runner. Englobar é diferente de comprovar a morte do microrganismo.')+`<div class="ed-progress"><span>${score} pts</span><span>Melhor sequência: ${bestStreak}</span><span>${MODES[mode].label}</span></div><div class="ed-stat-grid"><div><b>${runStats.contacts.ANTICORPO}</b>marca(s) de IgG</div><div><b>${runStats.contacts.COMPLEMENTO}</b>marca(s) de C3b</div><div><b>${runStats.signals}</b>sinal(is) de TNF</div><div><b>${runStats.contacts.NEUTROFILO}</b>contato(s) com neutrófilos</div></div><p class="ed-small">Contagens desta partida, não medidas biológicas. Interações absorvidas pelo bônus não contam como novas marcas.</p><details class="ed-limit"><summary><span>Uma pergunta sobre o que apareceu</span><small>Opcional</small></summary><div>${questionHTML(chooseReportQuestion(),'REVISÃO DA RODADA')}</div></details><div class="ed-actions">${btn('JOGAR NOVAMENTE','replay','','primary')}${btn('Trocar dificuldade','arcade','','subtle')}${btn('Aprender jogando','nav','learn','subtle')}</div>`;}
const EDU_TABS=[['play','Jogar'],['learn','Aprender'],['guide','Guia'],['limits','Jogo × biologia'],['credits','Créditos'],['sources','Fontes']];
function renderLearning(){const pages={play:eduPlayHTML,learn:eduLearnHTML,intro:eduIntroHTML,quiz:eduQuizHTML,done:eduDoneHTML,guide:eduGuideHTML,limits:eduLimitsHTML,credits:eduCreditsHTML,sources:eduSourcesHTML,controls:eduControlsHTML,pause:eduPauseHTML,report:eduReportHTML};
 const active=['intro','quiz','done'].includes(eduView)?'learn':['controls','pause','report'].includes(eduView)?'play':eduView;
 document.getElementById('edTabs').innerHTML=EDU_TABS.map(([id,label])=>`<button id="ed-tab-${id}" role="tab" aria-selected="${id===active}" aria-controls="edBody" tabindex="${id===active?'0':'-1'}" data-act="nav" data-value="${id}">${label}</button>`).join('');
 const body=document.getElementById('edBody');body.innerHTML=(pages[eduView]||eduPlayHTML)();body.setAttribute('aria-labelledby','ed-tab-'+active);body.scrollTop=0;
 const ongoing=['playing','countdown','dying'].includes(eduReturnState);
 let foot=ongoing?btn('RETOMAR CORRIDA','close','','primary'):btn('VOLTAR AO JOGO','close','','subtle');
 if(eduFlow&&!['intro','quiz','done'].includes(eduView))foot=btn('VOLTAR À ETAPA','flow','','primary')+foot;
 document.getElementById('edFooter').innerHTML=`<span class="ed-small">${ongoing?'Tempo e partida pausados.':'Pular e abaixar são regras arcade, não mecanismos biológicos.'}</span><div><a class="ed-btn subtle" href="https://immuno.games/">← immuno.games</a>${foot}</div>`;
 document.getElementById('edPanel').focus({preventScroll:true});
}
function showStageIntro(index){if(['playing','countdown','dying'].includes(eduReturnState)){eduReturnState='menu';learningRun=false;}learningStage=Math.max(0,Math.min(3,index));eduFlow={view:'intro',practice:false};openLearning('intro');}
function startLearningPractice(){learningRun=true;eduFlow={view:'quiz',practice:true};initAudio();initGame();targetFrames=EDU_STAGES[learningStage].secs*60;hideLearning('countdown');countdownVal=3;countdownT=0;sndCount();}
function finishLearningPractice(){learnProgress.steps[EDU_STAGES[learningStage].id]={...(learnProgress.steps[EDU_STAGES[learningStage].id]||{}),run:true};saveLearn();eduQuizIndex=0;eduFlow={view:'quiz',practice:true};openLearning('quiz',{returnState:'menu'});}
function eduSpawn(){const st=EDU_STAGES[learningStage],gap=learningStage===0?155:150;
 if(frame===1||frame-lastObsFrame>=gap){const k=st.types[stageSequenceI%st.types.length];spawnObs(k);stageSequenceI++;lastObsFrame=frame;}
 if(learningStage===3&&(frame===1||frame===620))spawnPU();
}
function registerOpsonin(type){player.hitKind='mark';runStats.contacts[type]++;player.tags.push(type);if(player.tags.length>6)player.tags.shift();hitPressure+=MODES[mode].hitDanger*0.62;player.hitCD=22;streak=0;
 const name=type==='ANTICORPO'?'IgG':'C3b';addParticle(player.x+player.w/2,player.y,OBS_TYPES[type].color,8,3);addText(player.x+30,player.y-18,name+' LIGOU: OPSONIZAÇÃO',OBS_TYPES[type].color,11);tone(620,0.13,{slide:820,vol:0.025});
 eduStatusText=name+' no alvo → reconhecimento facilitado';eduStatusUntil=frame+175;
}
function signalHost(o){o.signaled=true;o.passed=true;runStats.signals++;eduInflammation=420;eduSignal={x:o.x+o.w/2,y:o.y+o.h/2,life:90};
 eduStatusText='TNF → endotélio ativado → reforços';eduStatusUntil=frame+180;addText(GW*0.73,150,'ENDOTÉLIO ATIVADO','#FFB27E',11);tone(440,0.12,{slide:540,vol:0.025});}
function drawOpsoninTags(){if(!player.tags||!player.tags.length||state==='dying')return;const cy=player.ducking?GROUND_Y-9:player.y+player.h/2;ctx.save();ctx.translate(player.x+player.w/2,cy);ctx.lineWidth=2;ctx.lineCap='round';
 player.tags.forEach((k,i)=>{const a=Math.PI+0.3+i*0.53,x=Math.cos(a)*25,y=Math.sin(a)*(player.ducking?10:19);ctx.save();ctx.translate(x,y);ctx.rotate(a-Math.PI/2);ctx.strokeStyle=OBS_TYPES[k].color;ctx.fillStyle=OBS_TYPES[k].color;if(k==='ANTICORPO'){ctx.beginPath();ctx.moveTo(0,4);ctx.lineTo(0,-1);ctx.lineTo(-3,-5);ctx.moveTo(0,-1);ctx.lineTo(3,-5);ctx.stroke();}else{ctx.beginPath();ctx.arc(0,0,3.3,0,TAU);ctx.fill();}ctx.restore();});ctx.restore();}
function drawHostSignal(){if(!eduInflammation&&!eduSignal)return;const x=GW*0.72,y=98,w=130;ctx.save();ctx.fillStyle='rgba(50,17,35,.85)';ctx.strokeStyle='#F5B28A';ctx.lineWidth=1.4;ctx.beginPath();ctx.roundRect(x,y,w,30,10);ctx.fill();ctx.stroke();for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(x+i*w/5,y+3);ctx.lineTo(x+i*w/5,y+27);ctx.stroke();}ctx.font='600 10px '+FONT;ctx.textAlign='center';ctx.fillStyle='#FFD8BE';ctx.fillText('ENDOTÉLIO · ESQUEMA',x+w/2,y-9);ctx.fillText('favorece recrutamento',x+w/2,y+44);if(eduSignal){ctx.globalAlpha=Math.min(1,eduSignal.life/30);ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(eduSignal.x,eduSignal.y);ctx.quadraticCurveTo(x-30,y+45,x+w/2,y+30);ctx.stroke();ctx.setLineDash([]);}ctx.restore();}
function drawLearningHUD(){if(!['playing','countdown','dying'].includes(state))return;ctx.save();ctx.textAlign='left';ctx.font='600 11px '+FONT;ctx.fillStyle='rgba(234,237,255,.9)';
 if(learningRun){ctx.fillText('TRILHA '+(learningStage+1)+'/4 · '+EDU_STAGES[learningStage].title,15,65);ctx.font='10px '+FONT;ctx.fillStyle='#A9D4FF';ctx.fillText('Prática sem derrota · perguntas ao terminar',15,81);}else{ctx.font='10px '+FONT;ctx.fillStyle='#B6A9CA';ctx.fillText('IgG já disponível · escala fictícia',15,58);}
 if(player.tags?.length){ctx.fillStyle='#BFE7DE';ctx.font='10px '+FONT;ctx.fillText('Marcas no alvo: '+player.tags.length,15,learningRun?98:74);}
 if(eduStatusUntil>frame){const txt=eduStatusText;ctx.font='600 12px '+FONT;const w=Math.min(GW-220,ctx.measureText(txt).width+26);ctx.fillStyle='rgba(10,8,27,.86)';ctx.beginPath();ctx.roundRect(GW/2-w/2,GH-53,w,25,9);ctx.fill();ctx.fillStyle='#EADFFD';ctx.textAlign='center';ctx.fillText(txt,GW/2,GH-36);}
 ctx.restore();}
function eduSyncDock(){const open=learningIsOpen(),play=['playing','countdown'].includes(state);document.getElementById('eduDock').hidden=open||(COARSE&&play);document.getElementById('edCreditsDock').hidden=play;document.getElementById('touchControls').hidden=open||!play;}
function setupEducation(){saveLearn();const ov=document.getElementById('learnOverlay');
 ov.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.value||'';
  if(a==='nav'){eduView=v;renderLearning();}
  else if(a==='close')closeLearning();
  else if(a==='guide'){eduGuideID=v;eduView='guide';renderLearning();}
  else if(a==='intro')showStageIntro(Number(v));
  else if(a==='practice')startLearningPractice();
  else if(a==='skipPractice'){eduQuizIndex=0;eduFlow={view:'quiz',practice:false};eduView='quiz';renderLearning();}
  else if(a==='answer'){const [id,sel]=v.split(':'),q=EDU_QUESTIONS.find(x=>x.id===id);if(!q||learnProgress.answers[id])return;learnProgress.answers[id]={selected:Number(sel),correct:Number(sel)===q.answer};saveLearn();renderLearning();if(eduView==='report'){const d=document.querySelector('#edBody details');if(d)d.open=true;}document.querySelector('.ed-feedback')?.scrollIntoView({block:'nearest'});}
  else if(a==='nextQuestion'){const st=EDU_STAGES[learningStage];if(!learnProgress.answers[EDU_QUESTIONS[st.q[eduQuizIndex]].id])return;if(eduQuizIndex+1<st.q.length)eduQuizIndex++;else{learnProgress.steps[st.id]={...(learnProgress.steps[st.id]||{}),done:true};saveLearn();eduFlow={...eduFlow,view:'done'};eduView='done';}renderLearning();}
  else if(a==='quizReview'){eduQuizIndex=0;eduFlow={...eduFlow,view:'quiz'};eduView='quiz';renderLearning();}
  else if(a==='flow'){eduView=eduFlow.view;renderLearning();}
  else if(a==='leaveQuiz'){eduFlow=null;learningRun=false;eduView='learn';renderLearning();}
  else if(a==='arcade'){learningRun=false;eduFlow=null;hideLearning('modeselect');}

// --- Init ---
function initGame() {
  runStats=newRunStats();stageSequenceI=0;eduInflammation=0;eduSignal=null;eduStatusText='';eduStatusUntil=0;

  score = 0; speed = BASE_SPEED; frame = 0; lastObsFrame = -60;
  shakeTimer = 0; flashAlpha = 0; streak = 0; bestStreak = 0;
  elapsed = 0; danger = 0; hitPressure = 0; targetFrames = MODES[mode].secs * 60;
  obstacles = []; particles = []; dust = []; lines = []; texts = []; powerUps = [];

  player = {
    x: 140, y: GROUND_Y - PLAYER_H, w: PLAYER_W, h: PLAYER_H,
    vy: 0, grounded: true, jumping: false,
    ducking: false, duckTimer: 0, duckHold: false, landT: 0,
    wobble: 0, flagella: 0, hitCD: 0,
    shield: 0, shieldPulse: 0, tags: [], hitKind: null,
  };

  macro = {
    x: -120, targetX: -120,
    y: GROUND_Y - MACRO_H * 0.9,
    w: MACRO_W, h: MACRO_H,
    pulse: 0, pseudo: 0,
  };

  bgCells = [];
  for (let i = 0; i < 16; i++)
    bgCells.push({ x: Math.random()*GW*2, y: Math.random()*(GROUND_Y-40)+15,
      r: 18+Math.random()*40, spd: 0.15+Math.random()*0.35, a: 0.04+Math.random()*0.07 });

  vessels = [];
  for (let i = 0; i < 3; i++)
    vessels.push({ x: GW*0.3+Math.random()*GW, y1: Math.random()*GROUND_Y*0.3,
      y2: GROUND_Y*(0.5+Math.random()*0.5), w: 7+Math.random()*10,
      spd: 0.1+Math.random()*0.2, curve: Math.random()*40-20 });

  bumps = [];
  for (let i = 0; i < 45; i++)
    bumps.push({ x: Math.random()*GW*2, r: 2+Math.random()*4 });
}

// --- Spawners ---
function spawnObs(forcedType) {
  let k=forcedType||obsKeys[Math.floor(Math.random()*obsKeys.length)];
  if(!forcedType&&eduInflammation>0&&Math.random()<0.65)k='NEUTROFILO';
  const t={...OBS_TYPES[k]};
  if(k==='NEUTROFILO')t.ground=learningRun?stageSequenceI%2===0:Math.random()<0.6;
  let w,h,y;
  if(k==='CITOCINA'){w=34;h=32;y=214;}
  else if(t.ground){w=PLAYER_W*(0.75+Math.random()*0.25);h=PLAYER_H*(0.85+Math.random()*0.2);y=GROUND_Y-h;}
  else {w=44;h=36;y=GROUND_Y-60;}
  runStats.seen[k]=(runStats.seen[k]||0)+1;
  obstacles.push({x:GW+40,y,w,h,type:k,cfg:t,passed:false,signaled:false});
}

function spawnPU() {
  powerUps.push({ x:GW+40, y:GROUND_Y-PLAYER_H*1.8-Math.random()*30,
    w:28, h:28, pulse:0, collected:false });
}

function addParticle(x,y,color,count=8,sp=5) {
  for (let i=0;i<count;i++)
    particles.push({ x,y, vx:(Math.random()-0.5)*sp, vy:(Math.random()-0.8)*sp*0.7,
      life:1, decay:0.015+Math.random()*0.025, r:2+Math.random()*3.5, color });
}

function addDust(x,y) {
  dust.push({ x:x+(Math.random()-0.5)*5, y:y+Math.random()*2,
    vx:-(speed*0.3+Math.random()), vy:-(0.3+Math.random()*0.7),
    life:1, decay:0.03+Math.random()*0.02, r:1.5+Math.random()*2 });
}

function addLine() {
  lines.push({ x:GW+5, y:Math.random()*GROUND_Y, len:15+Math.random()*30+speed*5,
    a:0.08+Math.random()*0.12, spd:speed*(1.5+Math.random()) });
}

function addText(x,y,txt,color='#FFF',size=13) {
  texts.push({ x,y,txt,color,size,life:1,vy:-1.3 });
}

// --- Collision ---
function hit(a,b) {
  const m=5;
  return a.x+m<b.x+b.w-m && a.x+a.w-m>b.x+m && a.y+m<b.y+b.h-m && a.y+a.h-m>b.y+m;
}

// --- UPDATE (1 tick = 1/60s) ---
function update() {
  // Countdown
  if (state==='countdown') {
    countdownT++;
    if (countdownT>=50) {
      countdownT=0; countdownVal--;
      if (countdownVal<=0) { state='playing'; sndGo(); }
      else sndCount();
    }
    player.wobble+=0.1; player.flagella+=0.15;
    macro.pulse+=0.03; macro.pseudo+=0.02;
    return;
  }

  // Dying
  if (state==='dying') {
    dyingT++;
    macro.x += (player.x - macro.w*0.3 - macro.x)*0.08;
    macro.pulse+=0.08; macro.pseudo+=0.06; player.wobble+=0.3;
    if (dyingT%5===0) addParticle(player.x+player.w/2, player.y+player.h/2, '#9955BB',3,3);
    if (dyingT>=80) {
      state='gameover'; gameOverTime=Date.now();
      if (!learningRun&&score>highScore) { highScore=score; lsSet('immunorun_hs',highScore+''); }
      sndDie();
      openLearning('report',{returnState:'gameover'});
    }
    return;
  }

  if (state!=='playing') return;

  frame++; elapsed++;
  if(eduInflammation>0)eduInflammation--;
  if(eduSignal&&--eduSignal.life<=0)eduSignal=null;
  const M = MODES[mode];
  const progress = Math.min(1, elapsed/targetFrames);

  // Velocidade sobe suavemente ao longo da sessão (por modo)
  speed = learningRun?4.4:BASE_SPEED*M.speedMul*(1+progress*M.ramp); // ramp menor no Fácil: o fim não aperta tanto

  // Pontos arcade: não representam distância física
  if (frame%3===0) { score++; if (score%100===0) sndScore(); }

  // --- Player ---
  player.wobble += 0.15;
  player.flagella += 0.2 + speed*0.015;
  if (player.hitCD > 0) player.hitCD--;
  if (player.landT > 0) player.landT--;
  if (player.shield > 0) { player.shield--; player.shieldPulse+=0.15; }

  if (player.ducking) {
    if (!player.duckHold) {
      player.duckTimer--;
      if (player.duckTimer<=0) {
        player.ducking=false; player.h=PLAYER_H; player.y=GROUND_Y-PLAYER_H;
      }
    }
  }

  if (!player.grounded) {
    player.vy += GRAVITY;
    player.y += player.vy;
    const gl = player.ducking ? GROUND_Y-DUCK_H : GROUND_Y-PLAYER_H;
    if (player.y >= gl) {
      player.y=gl; player.vy=0; player.grounded=true; player.jumping=false; player.landT=8;
      for (let i=0;i<4;i++) addDust(player.x+player.w*0.3, GROUND_Y);
    }
  }

  if (player.grounded && !player.ducking && frame%4===0) addDust(player.x, GROUND_Y);
  if (player.ducking && frame%2===0) { addDust(player.x+player.w*0.4, GROUND_Y); addDust(player.x+player.w*0.2, GROUND_Y); }
  if (frame%3===0) addLine();
  if (speed>BASE_SPEED*1.5 && frame%2===0) addLine();

  // --- Macrófago: fecha o cerco conforme o tempo passa (+ toques) ---
  macro.pulse += 0.05;
  macro.pseudo += 0.03;
  hitPressure = Math.max(0, hitPressure - 0.0006); // pressão dos toques decai devagar
  danger = Math.min(learningRun?0.78:1, (learningRun?0.40:M.dangerEnd)*progress + hitPressure + player.tags.length*0.025);
  const catchX = player.x - macro.w*0.55;
  const startX = -120;
  macro.targetX = startX + (catchX - startX)*danger;
  macro.x += (macro.targetX - macro.x) * 0.12;
  macro.y = GROUND_Y - MACRO_H*0.9;

  // Vitória: sobreviveu ao tempo todo
  if (elapsed >= targetFrames) { if(learningRun)finishLearningPractice();else winRun(); return; }
  // Derrota: o macrófago alcançou a bactéria
  if (!learningRun&&(danger >= 1 || macro.x + macro.w*0.55 >= player.x)) {
    state='dying'; dyingT=0; sndPhago(); return;
  }

  // TNF modifies host recruitment, never direct damage to the bacterium.
  if(learningRun)eduSpawn();
  else {
    const gap=Math.max(MIN_GAP,Math.max(26,(58-progress*22*M.ramp)*M.gapMul)*(eduInflammation>0?0.83:1));
    if(frame-lastObsFrame>gap+Math.random()*22){spawnObs();lastObsFrame=frame;}
    if(score>50&&frame%400===0&&player.shield<=0)spawnPU();
  }


  const pHh = player.ducking ? DUCK_H : player.h;
  const pYy = player.ducking ? GROUND_Y-DUCK_H : player.y;
  const pb = { x:player.x, y:pYy, w:player.w, h:pHh };

  for (let i=obstacles.length-1; i>=0; i--) {
    const o = obstacles[i];
    o.x -= speed;
    if(o.type==='CITOCINA'){
      if(o.signaled){                                   // segue até o receptor no endotélio ilustrado
        o.x += speed;                                    // desfaz o deslocamento do cenário
        const tx=GW*0.72+65-o.w/2, ty=113-o.h/2;
        o.x += (tx-o.x)*0.10; o.y += (ty-o.y)*0.10;
        o.fade=(o.fade??1)-0.025;
        if(o.fade<=0)obstacles.splice(i,1);
        continue;
      }
      if(!o.signaled&&o.x<GW*0.72)signalHost(o);
      if(o.x+o.w < -40)obstacles.splice(i,1);
      continue; // Host signal: no hit test, mark, shield loss or physical impact.
    }

    if (!o.passed && player.hitCD<=0 && hit(pb, o)) {
      if (player.shield>0) {
        o.passed=true; player.shield=0; shakeTimer=5; flashAlpha=0.12;
        addParticle(player.x+player.w/2,pYy+pHh/2,'#44DDFF',14,7);
        sndShieldHit();runStats.absorbed++;addText(player.x,pYy-18,'BÔNUS CONSUMIDO','#44DDFF',11);
        streak=0;
      } else if(o.type==='ANTICORPO'||o.type==='COMPLEMENTO'){
        o.passed=true;registerOpsonin(o.type);
      } else {
        o.passed=true;player.hitCD=30;player.hitKind='impact';runStats.contacts.NEUTROFILO++;
        hitPressure += M.hitDanger; // tombo aproxima o macrófago
        shakeTimer=12; flashAlpha=0.3;
        addParticle(player.x+player.w/2,pYy+pHh/2,'#FF4444',14,7);
        sndHit();streak=0;addText(player.x,pYy-12,'CONTATO COM FAGÓCITO','#FFAAAA',11);
      }
    }

    if (!o.passed && o.x+o.w < player.x) {
      o.passed=true; streak++;
      hitPressure = Math.max(0, hitPressure - 0.008); // desvio limpo alivia a pressão
      if (streak>bestStreak) bestStreak=streak;
      addParticle(o.x+o.w/2, o.y+o.h/2, o.cfg.color, 3);
      sndDodge();
      if (streak>=10 && streak%5===0) addText(player.x+player.w,pYy-22,streak+'x COMBO!','#FFD700',16);
      else if (streak===5) addText(player.x+player.w,pYy-18,'5x COMBO!','#FFAA00',14);
    }

    if (o.x+o.w < -40) obstacles.splice(i,1);
  }

  // Power-ups
  for (let i=powerUps.length-1; i>=0; i--) {
    const p = powerUps[i]; p.x -= speed; p.pulse+=0.1;
    if (!p.collected && hit(pb, p)) {
      p.collected=true;player.shield=300;player.shieldPulse=0;runStats.collected++;
      addParticle(p.x+p.w/2,p.y+p.h/2,'#44FFDD',18,9);
      sndPowerUp(); addText(p.x,p.y-18,'BÔNUS DE BIOFILME','#44FFDD',13);
    }
    if (p.x+p.w < -40) powerUps.splice(i,1);
  }

  // BG scroll
  for (const c of bgCells) { c.x-=speed*c.spd; if(c.x+c.r<0){c.x=GW+c.r+Math.random()*200; c.y=Math.random()*(GROUND_Y-40)+15;} }
  for (const v of vessels) { v.x-=speed*v.spd; if(v.x<-40){v.x=GW+40+Math.random()*200; v.curve=Math.random()*40-20;} }
  for (const b of bumps)   { b.x-=speed; if(b.x<-10) b.x=GW+Math.random()*200; }

  // Particles
  for (let i=particles.length-1;i>=0;i--) { const p=particles[i]; p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=p.decay; if(p.life<=0)particles.splice(i,1); }
  for (let i=dust.length-1;i>=0;i--)      { const d=dust[i]; d.x+=d.vx;d.y+=d.vy;d.life-=d.decay; if(d.life<=0)dust.splice(i,1); }
  for (let i=lines.length-1;i>=0;i--)     { lines[i].x-=lines[i].spd; if(lines[i].x+lines[i].len<0)lines.splice(i,1); }
  for (let i=texts.length-1;i>=0;i--)     { const t=texts[i]; t.y+=t.vy;t.life-=0.015; if(t.life<=0)texts.splice(i,1); }

  if (shakeTimer>0) shakeTimer--;
  if (flashAlpha>0) flashAlpha-=0.012;
}

// ===========================
// DRAWING
// ===========================

function drawBG() {
  const g = ctx.createLinearGradient(0,0,0,GROUND_Y);
  g.addColorStop(0,'#1E0E36'); g.addColorStop(0.35,'#3A1852');
  g.addColorStop(0.65,'#5C2D6B'); g.addColorStop(1,'#7A4060');
  ctx.fillStyle=g; ctx.fillRect(0,0,GW,GROUND_Y);
  // O céu esquenta conforme o perigo cresce
  if(state==='playing'&&danger>0.2){const dg2=ctx.createLinearGradient(0,0,0,GROUND_Y);dg2.addColorStop(0,`rgba(255,40,80,${(danger-0.2)*0.3})`);dg2.addColorStop(1,'rgba(255,40,80,0)');ctx.fillStyle=dg2;ctx.fillRect(0,0,GW,GROUND_Y);}

  // Vessels
  for (const v of vessels) {
    ctx.beginPath(); ctx.moveTo(v.x,v.y1);
    ctx.quadraticCurveTo(v.x+v.curve,(v.y1+v.y2)/2,v.x-v.curve*0.5,v.y2);
    ctx.strokeStyle='rgba(180,50,70,0.1)'; ctx.lineWidth=v.w; ctx.lineCap='round'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(v.x,v.y1);
    ctx.quadraticCurveTo(v.x+v.curve,(v.y1+v.y2)/2,v.x-v.curve*0.5,v.y2);
    ctx.strokeStyle='rgba(220,80,100,0.05)'; ctx.lineWidth=v.w*0.5; ctx.stroke();
  }

  for (const c of bgCells) { // células de fundo com volume suave
    const cg=ctx.createRadialGradient(c.x-c.r*0.25,c.y-c.r*0.25,c.r*0.1,c.x,c.y,c.r);
    cg.addColorStop(0,`rgba(255,210,225,${c.a*1.7})`);cg.addColorStop(0.7,`rgba(255,150,190,${c.a})`);cg.addColorStop(1,'rgba(255,150,190,0)');
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fillStyle=cg; ctx.fill();
    ctx.beginPath(); ctx.arc(c.x-c.r*0.1,c.y-c.r*0.1,c.r*0.3,0,Math.PI*2); ctx.fillStyle=`rgba(255,120,170,${c.a*0.9})`; ctx.fill();
  }

  // Speed lines
  for (const s of lines) {
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x+s.len,s.y);
    ctx.strokeStyle=`rgba(255,200,255,${s.a})`; ctx.lineWidth=1; ctx.stroke();
  }

  // Ground
  const gg = ctx.createLinearGradient(0,GROUND_Y,0,GH);
  gg.addColorStop(0,'#C4596A'); gg.addColorStop(0.1,'#B44D5E');
  gg.addColorStop(0.5,'#943D4E'); gg.addColorStop(1,'#6B2A3A');
  ctx.fillStyle=gg; ctx.fillRect(0,GROUND_Y,GW,GH-GROUND_Y);

  ctx.strokeStyle='rgba(255,160,180,0.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(GW,GROUND_Y); ctx.stroke();

  for (const b of bumps) {
    ctx.beginPath(); ctx.arc(b.x,GROUND_Y+5+b.r,b.r,0,Math.PI*2);
    ctx.fillStyle='rgba(140,50,65,0.2)'; ctx.fill();
  }
  // brilho úmido na superfície do tecido
  const gl=ctx.createLinearGradient(0,GROUND_Y,0,GROUND_Y+20);gl.addColorStop(0,'rgba(255,225,235,0.4)');gl.addColorStop(1,'rgba(255,225,235,0)');ctx.fillStyle=gl;ctx.fillRect(0,GROUND_Y,GW,20);
}

function drawDust() {
  for (const d of dust) {
    ctx.globalAlpha=d.life*0.45;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r*d.life,0,Math.PI*2);
    ctx.fillStyle='#D4A0A0'; ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ===========================
// SPRITES 3D "VINIL" (pré-renderizados em folhas de quadros)
// Cada personagem é desenhado uma vez no início, quadro a quadro, em canvas
// fora da tela (supersampling). No jogo, só fazemos drawImage: mais bonito e mais leve.
// ===========================
const TAU = Math.PI*2;
const SPR_SCALE = Math.min(3, Math.max(2, DPR*1.5));
const SPR = {};

function bake(n, w, h, ox, oy, fn){
  const frames=[];
  for(let i=0;i<n;i++){
    const c=document.createElement('canvas');
    c.width=Math.ceil(w*SPR_SCALE); c.height=Math.ceil(h*SPR_SCALE);
    const x=c.getContext('2d');
    x.scale(SPR_SCALE,SPR_SCALE); x.translate(ox,oy);
    x.lineCap='round'; x.lineJoin='round';
    fn(x, i/n, i);
    frames.push(c);
  }
  return {frames,w,h,ox,oy,n};
}
function drawSprite(s, idx, x, y, sx=1, sy=sx){
  const f=s.frames[((Math.floor(idx)%s.n)+s.n)%s.n];
  ctx.save(); ctx.translate(x,y); ctx.scale(sx,sy);
  ctx.drawImage(f,-s.ox,-s.oy,s.w,s.h);
  ctx.restore();
}

// --- Material "brinquedo de vinil": volume + oclusão + luz de recorte + brilho + contorno ---
function shade3D(x, path, w, h, c, inner){
  const R=Math.max(w,h)/2;
  x.beginPath(); path(x);
  const g=x.createRadialGradient(-w*0.2,-h*0.32,R*0.05,-w*0.05,-h*0.05,R*1.12);
  g.addColorStop(0,c.hi); g.addColorStop(0.5,c.mid); g.addColorStop(1,c.dark);
  x.fillStyle=g; x.fill();
  x.save(); x.beginPath(); path(x); x.clip();
  if(inner) inner(x);
  const ao=x.createLinearGradient(0,-h/2,0,h/2);           // sombra de contato interna (base)
  ao.addColorStop(0.45,'rgba(0,0,0,0)'); ao.addColorStop(1,c.ao);
  x.fillStyle=ao; x.fillRect(-w*1.5,-h*1.5,w*3,h*3);
  const d=Math.max(1.6,R*0.11);                             // luz de recorte (rim light)
  x.beginPath(); x.rect(-w*1.5,-h*1.5,w*3,h*3);
  x.save(); x.translate(-d,-d); path(x); x.restore();
  const rg=x.createLinearGradient(-w/2,-h/2,w/2,h/2);
  rg.addColorStop(0.35,'rgba(255,255,255,0)'); rg.addColorStop(1,c.rim);
  x.fillStyle=rg; x.fill('evenodd');
  x.restore();
  x.save(); x.translate(-w*0.2,-h*0.27); x.rotate(-0.25);  // brilho especular
  const sg=x.createRadialGradient(0,0,0,0,0,w*0.22);
  sg.addColorStop(0,'rgba(255,255,255,0.85)'); sg.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=sg; x.beginPath(); x.ellipse(0,0,w*0.22,h*0.14,0,0,TAU); x.fill();
  x.restore();
  x.beginPath(); x.arc(-w*0.3,-h*0.2,Math.max(0.9,R*0.06),0,TAU); x.fillStyle='rgba(255,255,255,0.95)'; x.fill();
  x.beginPath(); path(x); x.strokeStyle=c.line; x.lineWidth=c.lw||1.8; x.stroke();
}
function sphere(x,cx,cy,r,c,inner){ x.save(); x.translate(cx,cy); shade3D(x,q=>q.arc(0,0,r,0,TAU),r*2,r*2,c,inner); x.restore(); }
function tube(x,pts,w,c){
  const run=dy=>{x.beginPath();x.moveTo(pts[0][0],pts[0][1]+dy);for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]+dy);};
  run(0);x.strokeStyle=c.line;x.lineWidth=w+2.2;x.stroke();
  run(0);x.strokeStyle=c.dark;x.lineWidth=w;x.stroke();
  run(-w*0.12);x.strokeStyle=c.mid;x.lineWidth=w*0.7;x.stroke();
  run(-w*0.24);x.globalAlpha=0.85;x.strokeStyle=c.hi;x.lineWidth=w*0.26;x.stroke();x.globalAlpha=1;
}
function smoothPath(q,pts){
  const n=pts.length;
  q.moveTo((pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2);
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];q.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}

}

// --- Peças de rosto (olhos brilhantes, bochechas, gotas) ---
function eye3D(x,cx,cy,rx,ry,o={}){
  const look=o.look||0, pr=o.pupil||0.68, iris=o.iris||['#3A6E96','#101B28'];
  x.beginPath(); x.ellipse(cx,cy,rx,ry,0,0,TAU);
  const sg=x.createLinearGradient(0,cy-ry,0,cy+ry); sg.addColorStop(0,'#FFFFFF'); sg.addColorStop(1,'#D6E2EE');
  x.fillStyle=sg; x.fill();
  const ix=cx+look*rx*0.28, iy=cy+ry*0.08, irx=rx*pr, iry=ry*pr;
  x.save(); x.beginPath(); x.ellipse(cx,cy,rx,ry,0,0,TAU); x.clip();
  const ig=x.createLinearGradient(0,iy-iry,0,iy+iry); ig.addColorStop(0,iris[1]); ig.addColorStop(1,iris[0]);
  x.beginPath(); x.ellipse(ix,iy,irx,iry,0,0,TAU); x.fillStyle=ig; x.fill();
  x.beginPath(); x.ellipse(ix,iy+iry*0.05,irx*0.5,iry*0.52,0,0,TAU); x.fillStyle='rgba(0,0,0,0.6)'; x.fill();
  x.fillStyle='rgba(0,0,0,0.12)'; x.fillRect(cx-rx,cy-ry,rx*2,ry*0.35);   // sombra da pálpebra
  x.restore();
  x.beginPath(); x.ellipse(cx,cy,rx,ry,0,0,TAU); x.lineWidth=o.lw||1.1; x.strokeStyle=o.line||'#222'; x.stroke();
  x.fillStyle='#FFF';
  x.beginPath(); x.arc(ix-irx*0.35,iy-iry*0.42,Math.max(0.8,irx*0.42),0,TAU); x.fill();
  x.beginPath(); x.arc(ix+irx*0.38,iy+iry*0.4,Math.max(0.5,irx*0.2),0,TAU); x.fill();
}
function closedEye(x,cx,cy,r,happy,col,lw=1.8){
  x.beginPath();
  if(happy) x.arc(cx,cy+r*0.55,r*0.85,Math.PI*1.15,Math.PI*1.85);   // ^ ^ feliz
  else      x.arc(cx,cy-r*0.45,r*0.85,Math.PI*0.15,Math.PI*0.85);   // piscada

function blush(x,cx,cy,rx,ry,a=0.55){

function drop(x,cx,cy,s=1){

  const g=x.createLinearGradient(0,-4,0,4); g.addColorStop(0,'#E8FBFF'); g.addColorStop(1,'#62C3FF');
  x.fillStyle=g; x.fill(); x.strokeStyle='rgba(20,80,140,0.8)'; x.lineWidth=0.8; x.stroke();
  x.beginPath(); x.arc(-0.9,1,0.7,0,TAU); x.fillStyle='#FFF'; x.fill(); x.restore();
}
function openMouth(x,cx,cy,w,h,L,lw=1.5){
  const p=()=>{x.beginPath();x.moveTo(cx-w,cy);x.quadraticCurveTo(cx,cy+h*2,cx+w,cy);x.quadraticCurveTo(cx,cy+h*0.35,cx-w,cy);x.closePath();};
  p(); x.fillStyle='#5A1430'; x.fill();
  x.save(); p(); x.clip(); x.beginPath(); x.ellipse(cx,cy+h*1.1,w*0.6,h*0.5,0,0,TAU); x.fillStyle='#FF7FA0'; x.fill(); x.restore();
  p(); x.strokeStyle=L; x.lineWidth=lw; x.stroke();
}

// ===== BACTÉRIA (bacilo verde, você) =====
const BACT_W=54, BACT_H=36;
const COL_BACT  ={hi:'#E8FFCB',mid:'#7FD957',dark:'#2E8B3A',ao:'rgba(8,50,20,0.5)', rim:'rgba(205,255,235,0.95)',line:'#1D5A2A',spot:'rgba(30,110,45,0.28)'};
const COL_SHIELD={hi:'#E4FFFA',mid:'#5ADFC9',dark:'#1C8C86',ao:'rgba(5,50,60,0.5)', rim:'rgba(215,250,255,0.95)',line:'#12545A',spot:'rgba(20,110,110,0.28)'};
function bactParams(t,duck){
  const p=t*TAU;
  if(!duck){
    const s=Math.abs(Math.sin(p*2));                 // 0 = toca o chão, 1 = topo do saltinho
    const k=0.075*(1-s)-0.035*s;                     // achata no contato, estica no ar
    const W=BACT_W*(1+k), H=BACT_H*(1-k);
    return {W,H,yo:-s*3.4+(BACT_H-H)/2,sway:Math.sin(p*2)*2.4,p};
  }
  const k=Math.sin(p*2)*0.03, W=60*(1+k), H=22*(1-k);
  return {W,H,yo:(22-H)/2,sway:-4.5+Math.sin(p*4)*1.3,p};
}
function flagellum(x,x0,y0,p,col,duck){
  const N=22, len=duck?54:46, pts=[];
  for(let i=0;i<=N;i++){const t=i/N; pts.push([x0-t*len, y0+Math.sin(p*2-t*7)*(1.2+t*(duck?3.5:7.5))]);}
  for(let pass=0;pass<3;pass++) for(let i=0;i<N;i++){
    const t=i/N, w=4.4*(1-t)+1.1, dy=pass===2?-w*0.22:0;
    x.beginPath(); x.moveTo(pts[i][0],pts[i][1]+dy); x.lineTo(pts[i+1][0],pts[i+1][1]+dy);
    if(pass===0){x.strokeStyle=col.line;x.lineWidth=w+2.2;}
    else if(pass===1){x.strokeStyle=col.mid;x.lineWidth=w;}
    else {x.strokeStyle='rgba(255,255,255,0.55)';x.lineWidth=w*0.3;}
    x.stroke();
  }
}
function bactBody(x,t,col,duck){
  const {W,H,yo,sway,p}=bactParams(t,duck);
  x.save(); x.translate(0,yo);
  flagellum(x,-W/2+5,duck?1:2,p,col,duck);
  for(let i=0;i<3;i++){                               // topete de fímbrias (pili)
    const bx=-6+i*5.5, by=-H/2+3;
    const tx=bx+sway-(duck?6:1.5)+i*0.6, ty=by-(duck?4.5:8)-i%2;
    x.beginPath(); x.moveTo(bx,by); x.quadraticCurveTo(bx+sway*0.3,by-4,tx,ty);
    x.strokeStyle=col.line; x.lineWidth=2.8; x.stroke();
    x.strokeStyle=col.mid;  x.lineWidth=1.4; x.stroke();
    x.beginPath(); x.arc(tx,ty,1.9,0,TAU); x.fillStyle=col.hi; x.fill(); x.strokeStyle=col.line; x.lineWidth=1; x.stroke();
  }
  shade3D(x,q=>q.roundRect(-W/2,-H/2,W,H,H/2),W,H,col,q=>{
    q.fillStyle=col.spot;
    [[-17,6,2.2],[-10,11,1.5],[-21,-1,1.4],[19,8,1.6],[12,12,1.2],[-3,13,1.3]].forEach(([a,b,r])=>{q.beginPath();q.arc(a*W/54,b*H/36,r,0,TAU);q.fill();});
  });
  x.restore();
}
const BFACE=['happy','jump','worried','panic','hurt','duck'];
function bactFace(x,e,closed){
  const L='#173F20', ex=6.8, ey=-2;

    x.strokeStyle=L; x.lineWidth=1.9;

    x.beginPath();x.moveTo(ex+3.5,ey-3);x.lineTo(ex-2.5,ey);x.lineTo(ex+3.5,ey+3);x.stroke();
  } else if(e==='jump'||closed){
    closedEye(x,-ex,ey,4.6,e==='jump',L); closedEye(x,ex,ey,4.6,e==='jump',L);
  } else {

    eye3D(x,-ex,ey,rx,ry,{pupil,look:0.6,line:L}); eye3D(x,ex,ey,rx,ry,{pupil,look:0.6,line:L});

  } else if(e==='duck'){

    x.beginPath();x.moveTo(ex+4,ey-8);x.lineTo(ex-3,ey-5.5);x.stroke();
  }
  blush(x,-12,5,4,2.4,e==='hurt'?0.8:0.6); blush(x,12,5,4,2.4,e==='hurt'?0.8:0.6);
  if(e==='happy') openMouth(x,0,5,3,2.2,L,1.3);

  else if(e==='worried'){ x.beginPath();x.ellipse(0,7,1.9,2.4,0,0,TAU);x.fillStyle='#5A1430';x.fill();x.strokeStyle=L;x.lineWidth=1.2;x.stroke(); drop(x,15,-8,0.9); }
  else if(e==='panic'){ x.beginPath();x.moveTo(-4,8);for(let i=0;i<=8;i++)x.lineTo(-4+i,8+(i%2?-1.2:1.2));x.strokeStyle=L;x.lineWidth=1.4;x.stroke(); drop(x,16,-9,1); drop(x,-16,-6,0.75); }
  else if(e==='hurt'){ x.beginPath();x.moveTo(-3.5,7);x.quadraticCurveTo(-1.7,4.5,0,7);x.quadraticCurveTo(1.7,9.5,3.5,7);x.strokeStyle=L;x.lineWidth=1.4;x.stroke(); }
  else if(e==='duck'){ x.beginPath();x.moveTo(-2.6,6);x.quadraticCurveTo(0,5,2.6,6);x.strokeStyle=L;x.lineWidth=1.4;x.stroke(); }
}

// ===== MACRÓFAGO (fallback artístico; fagócito do hospedeiro) =====
const MAC_RX=52, MAC_RY=37, MAC_FLOOR=33;
const COL_MAC={hi:'#F7E2FF',mid:'#B27AE8',dark:'#5B2BA0',ao:'rgba(30,5,60,0.5)',rim:'rgba(255,175,235,0.95)',line:'#3A1670',lw:2.2};
function macroPts(p){
  const pts=[], N=84;
  const pods=[{a:-0.32,amp:0.34,ph:0},{a:0.22,amp:0.28,ph:2.8},{a:-1.25,amp:0.16,ph:2.1},{a:2.75,amp:0.14,ph:4},{a:-2.3,amp:0.12,ph:1}];
  for(let i=0;i<N;i++){
    const th=i/N*TAU;
    let r=1+0.045*Math.sin(3*th+p)+0.035*Math.sin(5*th-2*p);
    for(const d of pods){const df=Math.atan2(Math.sin(th-d.a),Math.cos(th-d.a)); r+=d.amp*(0.55+0.45*Math.sin(p+d.ph))*Math.exp(-((df/0.26)**2));}
    pts.push([Math.cos(th)*MAC_RX*r, Math.min(MAC_FLOOR, Math.sin(th)*MAC_RY*r)]);
  }
  return pts;
}
function macroBody(x,t){
  const p=t*TAU, pts=macroPts(p);
  shade3D(x,q=>smoothPath(q,pts),MAC_RX*2,MAC_RY*2,COL_MAC,q=>{
    // núcleo em forma de rim
    q.save(); q.translate(-15,6); q.rotate(0.3);
    q.beginPath(); q.ellipse(0,0,17,11.5,0,0,TAU); q.fillStyle='rgba(75,20,135,0.33)'; q.fill();
    q.beginPath(); q.ellipse(4,-5,7,5,0,0,TAU); q.fillStyle='rgba(190,140,240,0.35)'; q.fill();
    q.beginPath(); q.arc(-5,2,2.6,0,TAU); q.fillStyle='rgba(60,10,110,0.35)'; q.fill();
    q.restore();
    // lisossomos (grânulos que orbitam devagar)
    for(let i=0;i<7;i++){
      const a=i*0.9+p, rr=0.32+0.12*(i%3);
      const gx=Math.cos(a)*MAC_RX*rr-4, gy=Math.sin(a)*MAC_RY*rr*0.8+4, gr=2+(i%3)*0.5;
      const gg=q.createRadialGradient(gx-gr*0.3,gy-gr*0.3,0,gx,gy,gr);
      gg.addColorStop(0,'#FFE1C8'); gg.addColorStop(1,'#E0608A');
      q.beginPath(); q.arc(gx,gy,gr,0,TAU); q.fillStyle=gg; q.globalAlpha=0.8; q.fill(); q.globalAlpha=1;
    }
    // fagossomo com uma bactéria já engolida (didático)
    const fx=-32, fy=-10+Math.sin(p)*2;
    q.beginPath(); q.arc(fx,fy,8.5,0,TAU); q.fillStyle='rgba(255,255,255,0.13)'; q.fill();
    q.strokeStyle='rgba(255,255,255,0.4)'; q.lineWidth=1; q.stroke();
    q.save(); q.translate(fx,fy); q.rotate(0.6+p*0.5);
    q.beginPath(); q.roundRect(-5,-2.6,10,5.2,2.6); q.fillStyle='rgba(110,200,90,0.55)'; q.fill(); q.restore();
  });
}
const MFACE=['grin','hungry','chompOpen','chompClosed','yum'];
function macroFace(x,e,closed){
  const L='#3A1670', ex=10, ey=-1, IRIS=['#F25C90','#6E0B36'];
  if(e==='yum'||closed){ closedEye(x,-ex,ey,6.5,e==='yum',L,2.4); closedEye(x,ex,ey,6.5,e==='yum',L,2.4); }

  else if(e==='yum'){ x.beginPath();x.moveTo(-7,9);x.quadraticCurveTo(0,16,7,9);x.strokeStyle=L;x.lineWidth=2.2;x.stroke();
    x.beginPath();x.ellipse(4.5,13.5,2.6,3,0.3,0,TAU);x.fillStyle='#FF7FA0';x.fill();x.strokeStyle=L;x.lineWidth=1.2;x.stroke(); }
}

const COL_AB ={hi:'#FFF7C9',mid:'#FFC93C',dark:'#B07A0E',ao:'rgba(80,40,0,0.45)',rim:'rgba(255,255,220,0.9)',line:'#6E4A06',lw:1.5};

function miniFace(x,cx,cy,s,L,mood){                     // olham para a esquerda, na direção da bactéria

function antibody(x,t){

    q.strokeStyle='rgba(80,55,160,0.3)';q.lineWidth=2.4;q.beginPath();q.moveTo(-8,10);q.lineTo(1,13);q.lineTo(9,8);q.stroke();
    q.fillStyle='rgba(255,200,235,0.55)';               // grânulos
    for(let i=0;i<9;i++){const a=i*2.4+p*0.5,r=6+(i%3)*4;q.beginPath();q.arc(Math.cos(a)*r,Math.sin(a)*r,1,0,TAU);q.fill();}
  });
  miniFace(x,-3,-4,1.3,COL_NEU.line,'grr');
  x.restore();
}
function cytokine(x,t){
  const p=t*TAU, k=Math.sin(p)*0.06;
  x.save(); x.scale(1-k,1+k);
  sphere(x,0,0,11,COL_CIT);
  miniFace(x,-1,-0.5,0.95,COL_CIT.line,'o');
  x.restore();
}
function complement(x,t){
  const p=t*TAU;
  const pos=[[-8,-6.5,5.6],[8,-4.5,5.2],[-4.5,8,5],[9,6,5.4],[-8.5,2.5,4.6],[3.5,-9,4.8]];
  x.strokeStyle='rgba(14,90,69,0.35)'; x.lineWidth=1.4; x.beginPath(); x.moveTo(0,0);
  pos.forEach(([a,b])=>{x.lineTo(a,b);x.moveTo(0,0);}); x.stroke();
  pos.map((v,i)=>[v[0]+Math.sin(p+i*1.7)*1.1, v[1]+Math.cos(p*2+i)*0.9, v[2]]).sort((a,b)=>a[1]-b[1])
     .forEach(([a,b,r])=>sphere(x,a,b,r,COL_C3));
  sphere(x,0,0,8,COL_C3);
  miniFace(x,-0.5,0,0.95,COL_C3.line,'grr');
}
// bw/bh = caixa visual de referência; bottom = y local da base (para apoiar no chão)
const OBS_SPR={};

function initSprites(){
  SPR.run  =bake(12,130,84,86,44,(x,t)=>bactBody(x,t,COL_BACT,false));
  SPR.runS =bake(12,130,84,86,44,(x,t)=>bactBody(x,t,COL_SHIELD,false));
  SPR.duck =bake(6,140,60,92,34,(x,t)=>bactBody(x,t,COL_BACT,true));
  SPR.duckS=bake(6,140,60,92,34,(x,t)=>bactBody(x,t,COL_SHIELD,true));
  SPR.bface={}; for(const e of BFACE) SPR.bface[e]=bake(2,44,34,22,17,(x,t,i)=>bactFace(x,e,i===1));
  SPR.macro=bake(12,180,130,84,72,macroBody);
  SPR.mface={}; for(const e of MFACE) SPR.mface[e]=bake(2,64,50,32,22,(x,t,i)=>macroFace(x,e,i===1));
  OBS_SPR.ANTICORPO  ={spr:bake(8,60,60,30,32,antibody),  bw:40,bh:46,bottom:24};
  OBS_SPR.NEUTROFILO ={spr:bake(8,56,56,28,28,neutrophil),bw:40,bh:40,bottom:19.5};
  OBS_SPR.CITOCINA   ={spr:bake(8,40,40,20,20,cytokine),  bw:26,bh:26,bottom:12};
  OBS_SPR.COMPLEMENTO={spr:bake(8,50,50,25,25,complement),bw:36,bh:34,bottom:16};
}
initSprites();

// Sombra de contato no chão: encolhe e some quanto mais alto o personagem
function groundShadow(cx,w,lift,a=0.4){
  const k=Math.max(0.3,1-Math.max(0,lift)/150);
  ctx.save(); ctx.translate(cx,GROUND_Y+2); ctx.scale(1,0.22); ctx.globalAlpha=a*k;
  const g=ctx.createRadialGradient(0,0,0,0,0,w*k);
  g.addColorStop(0,'rgba(45,0,30,0.95)'); g.addColorStop(1,'rgba(45,0,30,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,w*k,0,TAU); ctx.fill(); ctx.restore();
}
const blinkAt=(off=0,per=3400)=>((performance.now()+off)%per)<130;

function bactExpr(){
  if(state==='dying') return 'panic';
  if(player.hitCD>0&&player.hitKind==='impact') return 'hurt';
  const d=Math.max(0,macro.x+macro.w*0.55)/(player.x||1);
  if(player.ducking) return 'duck';
  if(!player.grounded) return d>0.6?'panic':'jump';
  return d>0.6?'panic':d>0.3?'worried':'happy';
}

function drawBact(){
  if(artReady) return drawBactArt();
  const pw=player.w, duck=player.ducking;
  let sc=1; if(state==='dying'){ sc=1-Math.min(1,dyingT/80)*0.85; if(sc<0.1) return; }
  const cx=player.x+pw/2, cy=duck?GROUND_Y-11:player.y+player.h/2;
  groundShadow(cx-6, duck?32:28, GROUND_Y-(cy+(duck?11:18)));
  ctx.save();
  ctx.translate(cx,cy);
  if(sc!==1){ ctx.scale(sc,sc); ctx.rotate((1-sc)*5); }
  let ssx=1,ssy=1,rot=0;
  if(!player.grounded){const v=Math.max(-1,Math.min(1,player.vy/12));ssx=1-Math.abs(v)*0.12;ssy=1+Math.abs(v)*0.18;rot=Math.max(-0.28,Math.min(0.32,player.vy*0.028));}
  else if(player.landT>0){const t=player.landT/8;ssx=1+t*0.22;ssy=1-t*0.22;}
  ctx.rotate(rot); ctx.scale(ssx,ssy);
  if(player.hitCD>0&&player.hitKind==='impact'&&Math.floor(player.hitCD/3)%2===0) ctx.globalAlpha=0.4;
  if(state==='dying') ctx.globalAlpha=1-Math.min(1,dyingT/80)*0.7;   // vai sumindo dentro do macrófago
  const shd=player.shield>0;
  const n=duck?6:12, idx=Math.floor(player.flagella*(duck?1.5:(player.grounded?1:1.6)))%n;
  const par=bactParams(idx/n,duck);
  drawSprite(duck?(shd?SPR.duckS:SPR.duck):(shd?SPR.runS:SPR.run), idx, 0, 0);
  drawSprite(SPR.bface[bactExpr()], blinkAt()?1:0, par.W*0.16, par.yo+1, duck?0.82:1);
  if(shd && state!=='dying') drawBubble(duck?36:38);
  ctx.restore();
}
// Escudo de biofilme como bolha de sabão
function drawBubble(r){
  const sp=player.shieldPulse, rr=r+Math.sin(sp)*2;
  const a=player.shield<60?(0.55+Math.sin(sp*3)*0.4):1;
  ctx.save(); ctx.globalAlpha*=a;
  const g=ctx.createRadialGradient(0,0,rr*0.55,0,0,rr);
  g.addColorStop(0,'rgba(120,255,230,0)'); g.addColorStop(0.85,'rgba(120,255,230,0.18)'); g.addColorStop(1,'rgba(180,255,245,0.55)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,rr,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(200,255,250,0.7)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,0,rr*0.8,Math.PI*1.1,Math.PI*1.45); ctx.stroke();
  for(let i=0;i<5;i++){const an=i/5*TAU+sp*0.4; ctx.beginPath(); ctx.arc(Math.cos(an)*rr*0.92,Math.sin(an)*rr*0.92,1.6,0,TAU); ctx.fillStyle='rgba(220,255,250,0.8)'; ctx.fill();}
  ctx.restore();
}

function drawMacro(){
  if(artReady) return drawMacroArt();
  const mw=macro.w;
  let es=1; if(state==='dying') es=1+Math.min(1,dyingT/80)*0.3;
  const cx=macro.x+mw/2;
  const dangerL=Math.max(0,macro.x+mw*0.55)/(player.x||1);
  if(dangerL>0.15){                                     // aura ameaçadora que cresce com a proximidade
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const ay=GROUND_Y-33*es, ar=mw*0.95+dangerL*30;
    const ag=ctx.createRadialGradient(cx,ay,mw*0.3,cx,ay,ar);
    ag.addColorStop(0,`rgba(255,60,120,${dangerL*0.25})`); ag.addColorStop(1,'rgba(255,60,120,0)');
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(cx,ay,ar,0,TAU); ctx.fill(); ctx.restore();
  }
  groundShadow(cx+4, 62*es, 0, 0.5);
  const b=Math.sin(macro.pulse)*0.025;
  ctx.save(); ctx.translate(cx,GROUND_Y+1); ctx.scale(es*(1+b),es*(1-b));
  drawSprite(SPR.macro, macro.pseudo*5.5, 0, -MAC_FLOOR);
  let e='grin';
  if(state==='dying') e=dyingT<45?(Math.floor(dyingT/6)%2?'chompOpen':'chompClosed'):'yum';
  else if(dangerL>0.7) e=Math.floor(frame/9)%2?'chompOpen':'chompClosed';
  else if(dangerL>0.4) e='hungry';
  drawSprite(SPR.mface[e], blinkAt(1700,4100)?1:0, 18, -MAC_FLOOR-6);
  ctx.restore();
}

function drawObsSprite(o){
  if(artReady) return drawObsArt(o);
  const S=OBS_SPR[o.type];
  if(o.seed===undefined) o.seed=Math.random();
  const idx=frame*0.16+o.seed*8, cx=o.x+o.w/2;
  if(o.type==='CITOCINA'){
    const s=Math.min(o.w,o.h)/30, cy=o.y+o.h/2+Math.sin(frame*0.08+o.seed*6)*2.5, cr=11*s;
    groundShadow(cx,o.w*0.35,GROUND_Y-cy,0.3);
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const hg=ctx.createRadialGradient(cx,cy,cr*0.6,cx,cy,cr*2.2); hg.addColorStop(0,'rgba(255,140,70,0.25)'); hg.addColorStop(1,'rgba(255,140,70,0)');
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(cx,cy,cr*2.2,0,TAU); ctx.fill(); ctx.restore();
    for(let i=1;i<=3;i++){                              // ondas de sinalização
      const wr=cr+i*6+Math.sin(frame*0.08+i)*2.5;
      ctx.strokeStyle=`rgba(255,150,90,${0.45-i*0.11})`; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(cx,cy,wr,-0.5,0.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,wr,Math.PI-0.4,Math.PI+0.4); ctx.stroke();
    }
    drawSprite(S.spr, idx, cx, cy, s);
  } else {
    const s=(o.w/S.bw+o.h/S.bh)*0.5*1.15;
    groundShadow(cx, o.w*0.55, 0, 0.42);
    drawSprite(S.spr,idx,cx,o.y+o.h-S.bottom*s+1,s);
  }
}

  // macrófago: âncora no centro do corpo, rente à base; pseudópodes da frente avançam e recolhem
  macro:{n:10, gw:140.2, gh:71, ax:50, ay:71, mxL:4, mxR:16, my:7,
         col:(f,p)=>{

           if(f<0.18){ const u=(0.18-f)/0.18; return {y:Math.sin(p*2+u*4)*2.5*u}; }
           return {}; }},
  neut: {n:8, gw:48, gh:39, ax:24, ay:39, my:4, col:(f,p)=>({y:Math.sin(p+f*TAU)*0.9})},
  ab:   {n:8, gw:44, gh:40.3, ax:22, ay:40.3, my:5, col:(f,p)=>{const c=(f-0.5)/0.5; return {y:-Math.sin(p)*2.4*c*c};}},
  tnf:  {n:1, gw:32, gh:31.8, ax:16, ay:15.9, my:2},

};
