function liveDrop(cx,cy,s){ ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s);
  ctx.beginPath(); ctx.moveTo(0,-4.2); ctx.bezierCurveTo(1.2,-1.8,2.6,-0.4,2.6,1.3); ctx.arc(0,1.3,2.6,0,Math.PI); ctx.bezierCurveTo(-2.6,-0.4,-1.2,-1.8,0,-4.2); ctx.closePath();
  const g=ctx.createLinearGradient(0,-4,0,4); g.addColorStop(0,'#E8FBFF'); g.addColorStop(1,'#62C3FF');
  ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='rgba(20,80,140,0.8)'; ctx.lineWidth=0.8; ctx.stroke(); ctx.restore(); }

function drawBactArt(){
  const pw=player.w, duck=player.ducking;
  let sc=1; if(state==='dying'){ sc=1-Math.min(1,dyingT/80)*0.85; if(sc<0.1) return; }
  const cx=player.x+pw/2;
  // de pé: os pili de baixo tocam o chão; abaixada: corpo achatado rente ao chão
  const cy=duck?GROUND_Y-10:player.y+player.h/2-0.5;
  groundShadow(cx-4, duck?34:30, GROUND_Y-(cy+(duck?9:18)));
  ctx.save(); ctx.translate(cx,cy);
  if(sc!==1){ ctx.scale(sc,sc); ctx.rotate((1-sc)*5); }
  let ssx=1,ssy=1,rot=0;
  if(duck){ ssx=1.12; ssy=0.58; }
  else if(!player.grounded){const v=Math.max(-1,Math.min(1,player.vy/12));ssx=1-Math.abs(v)*0.1;ssy=1+Math.abs(v)*0.14;rot=Math.max(-0.26,Math.min(0.3,player.vy*0.026));}
  else { const ph=player.flagella*1.1; const s=Math.abs(Math.sin(ph)); ctx.translate(0,-s*2.6); ssx=1+0.05*(1-s); ssy=1-0.05*(1-s);
         if(player.landT>0){const t=player.landT/8;ssx+=t*0.2;ssy-=t*0.2;} }
  ctx.rotate(rot); ctx.scale(ssx,ssy);
  if(player.hitCD>0&&player.hitKind==='impact'&&Math.floor(player.hitCD/3)%2===0) ctx.globalAlpha=0.4;
  if(state==='dying') ctx.globalAlpha=1-Math.min(1,dyingT/80)*0.7;
  drawSprite(ASPR.bact, player.flagella*(duck?1.5:1.1), 0, 0);
  const e=bactExpr();
  if(e==='worried'||e==='panic'){ const b=Math.sin(performance.now()*0.012)*1.2; liveDrop(25,-17+b,0.9); if(e==='panic') liveDrop(14,-19-b,0.7); }
  if(player.shield>0 && state!=='dying') drawBubble(duck?40:42);
  ctx.restore();
}

function drawMacroArt(){
  const mw=macro.w, cx=macro.x+mw/2-10;
  let es=1; if(state==='dying') es=1+Math.min(1,dyingT/80)*0.3;
  const dangerL=Math.max(0,macro.x+mw*0.55)/(player.x||1);
  if(dangerL>0.15){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const ay=GROUND_Y-35*es, ar=mw*1.05+dangerL*30;
    const ag=ctx.createRadialGradient(cx+10,ay,mw*0.3,cx+10,ay,ar);
    ag.addColorStop(0,`rgba(255,60,120,${dangerL*0.25})`); ag.addColorStop(1,'rgba(255,60,120,0)');
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(cx+10,ay,ar,0,TAU); ctx.fill(); ctx.restore();
  }
  groundShadow(cx+18, 70*es, 0, 0.5);
  const b=Math.sin(macro.pulse)*0.025;
  const lunge=dangerL>0.7?Math.max(0,Math.sin(frame*0.35))*0.06:0;   // bote quando está perto
  ctx.save(); ctx.translate(cx,GROUND_Y+3); ctx.scale(es*(1+b+lunge),es*(1-b));
  drawSprite(ASPR.macro, macro.pseudo*5, 0, 0);
  ctx.restore();
}

function drawObsArt(o){
  const S=ASPR[OBS_ART[o.type]], D=ART_DEF[OBS_ART[o.type]];
  if(o.seed===undefined) o.seed=Math.random();
  const idx=frame*0.14+o.seed*8, cx=o.x+o.w/2;
  if(o.type==='CITOCINA'){
    const s=Math.min(o.w,o.h)*0.95/D.gw, cy=o.y+o.h/2+Math.sin(frame*0.08+o.seed*6)*2.5, cr=13*s;
    groundShadow(cx,o.w*0.35,GROUND_Y-cy,0.3);
    for(let i=1;i<=3;i++){                              // ondas de sinalização
      const wr=cr+i*6+Math.sin(frame*0.08+i)*2.5;
      ctx.strokeStyle=`rgba(255,150,110,${0.45-i*0.11})`; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(cx,cy,wr,-0.5,0.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,wr,Math.PI-0.4,Math.PI+0.4); ctx.stroke();
    }
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.sin(frame*0.05+o.seed*9)*0.18);
    drawSprite(S, 0, 0, 0, s); ctx.restore();
  } else {
    const s=Math.min(o.h*1.2/D.gh, o.w*1.4/D.gw);
    groundShadow(cx, o.w*0.55, 0, 0.42);
    drawSprite(S,idx,cx,o.y+o.h+1,s);
  }
}

  ctx.font='bold 26px Fredoka,Arial,sans-serif';
  ctx.shadowColor='#BB66FF';ctx.shadowBlur=16;ctx.fillStyle='#F0E0FF';
  ctx.fillText('IMMUNO RUN · COMO JOGAR',GW/2,44);ctx.shadowBlur=0;

  // Legenda dos elementos (3 regras)
  const rules=[
    ['#8CFF8C','Seta ↑: PULE. IgG/C3b deixam marcas; neutrófilos baixos aumentam a pressão de captura.'],
    ['#FFD34D','Seta ↓: ABAIXE sob o neutrófilo alto. TNF é um SINAL ao hospedeiro: não precisa desviar.'],
    ['#FF6B6B','PERIGO é risco para a bactéria no jogo. Marcas e contatos aumentam a pressão; TNF traz reforços.'],
  ];
  const lx=GW*0.09, lw=GW*0.82, ly=70;
  ctx.fillStyle='rgba(40,20,60,0.55)';ctx.beginPath();ctx.roundRect(lx,ly,lw,150,12);ctx.fill();
  ctx.strokeStyle='rgba(150,100,200,0.35)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(lx,ly,lw,150,12);ctx.stroke();
  ctx.textAlign='left';
  let yy=ly+22;
  for(const [col,txt] of rules){
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(lx+20,yy-4,5,0,Math.PI*2);ctx.fill();
    ctx.font='12px Fredoka,Arial,sans-serif';ctx.fillStyle='#E6DAF2';
    const lines=wrapTextR(txt,lw-56);
    for(let j=0;j<lines.length;j++) ctx.fillText(lines[j],lx+34,yy+j*15);
    yy+=Math.max(1,lines.length)*15+16;
  }
  ctx.textAlign='center';
  ctx.font='13px Fredoka,Arial,sans-serif';ctx.fillStyle='#CDBBEE';
  ctx.fillText('IgG já está disponível neste cenário. Tempo, tamanho e pontuação são fictícios.',GW/2,243);

  const descs={FACIL:'Ritmo calmo, poucos obstáculos.',MEDIO:'Equilibrado.',DIFICIL:'Rápido, denso e cerco agressivo.'};
  for(const r of modeButtonRects()){
    const M=MODES[r.key];
    const hov = mouseX>=r.x&&mouseX<=r.x+r.w&&mouseY>=r.y&&mouseY<=r.y+r.h;
    ctx.fillStyle=hov?'rgba(255,255,255,0.10)':'rgba(35,22,55,0.85)';
    ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,12);ctx.fill();
    ctx.strokeStyle=M.col;ctx.lineWidth=hov?3:2;
    ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,12);ctx.stroke();
    ctx.fillStyle=M.col;ctx.font='bold 20px Fredoka,Arial,sans-serif';
    ctx.fillText(M.label,r.x+r.w/2,r.y+28);
    ctx.fillStyle='#FFF';ctx.font="bold 15px 'Rubik Mono One','Courier New',monospace";
    ctx.fillText(M.secs+'s',r.x+r.w/2,r.y+50);
    ctx.fillStyle='rgba(220,210,235,0.6)';ctx.font='9px Fredoka,Arial,sans-serif';
    ctx.fillText(descs[r.key],r.x+r.w/2,r.y+r.h-8);
  }

  const mob='ontouchstart' in window;
  ctx.font='11px Fredoka,Arial,sans-serif';ctx.fillStyle='rgba(200,180,220,0.55)';
  ctx.fillText(mob?'Toque em uma dificuldade':'Clique numa dificuldade  ·  ou tecle 1 / 2 / 3',GW/2,GH*0.86);
  if(highScore>0){ctx.fillStyle='#AA88CC';ctx.fillText('Recorde: '+highScore+' pts',GW/2,GH*0.93);}
}

function drawWin() {
  ctx.fillStyle='rgba(6,20,10,0.85)';ctx.fillRect(0,0,GW,GH);

  ctx.font='bold 40px Fredoka,Arial,sans-serif';ctx.textAlign='center';
  ctx.shadowColor='#55FF99';ctx.shadowBlur=18;ctx.fillStyle='#66FF99';
  ctx.fillText('VOCÊ ESCAPOU!',GW/2,GH*0.13);ctx.shadowBlur=0;

  ctx.font='13px Fredoka,Arial,sans-serif';ctx.fillStyle='#BFE8CC';
  ctx.fillText('Você sobreviveu à rodada. Isso não demonstra replicação ou infecção estabelecida.',GW/2,GH*0.13+30);

  ctx.font="bold 22px 'Rubik Mono One','Courier New',monospace";ctx.fillStyle='#FFF';
  ctx.fillText(MODES[mode].label+' concluído · '+score+' pts',GW/2,GH*0.3);

  if(score>=highScore&&score>0){
    ctx.font='bold 15px Fredoka,Arial,sans-serif';ctx.fillStyle='#FFD700';
    ctx.shadowColor='#FFD700';ctx.shadowBlur=8;ctx.fillText('NOVO RECORDE!',GW/2,GH*0.3+26);ctx.shadowBlur=0;
  }

  const fy=GH*0.48,fh=GH*0.28;
  ctx.fillStyle='rgba(20,60,40,0.4)';ctx.beginPath();ctx.roundRect(GW*0.08,fy-8,GW*0.84,fh,8);ctx.fill();
  ctx.strokeStyle='rgba(102,255,170,0.25)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(GW*0.08,fy-8,GW*0.84,fh,8);ctx.stroke();
  ctx.font='bold 14px Fredoka,Arial,sans-serif';ctx.fillStyle='#88FFBB';ctx.fillText('Mecanismo da rodada',GW/2,fy+12);
  ctx.font='12px Fredoka,Arial,sans-serif';ctx.fillStyle='#CCEEDD';
  const mxW=GW*0.75, fact=chooseReportQuestion().explain;
  const words=fact.split(' '); let ls=[],cl='';
  for(const w of words){const tt=cl?cl+' '+w:w;if(ctx.measureText(tt).width>mxW){ls.push(cl);cl=w;}else cl=tt;}
  if(cl)ls.push(cl);
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],GW/2,fy+30+i*17);

  ctx.font='bold 16px Fredoka,Arial,sans-serif';
  const bl=Math.sin(Date.now()*0.004)*0.5+0.5;
  ctx.fillStyle=`rgba(255,255,255,${0.5+bl*0.5})`;
  const mob='ontouchstart' in window;
  ctx.fillText(mob?'TOQUE PARA CONTINUAR':'ESPAÇO PARA CONTINUAR',GW/2,GH*0.9);
}

// --- RENDER ---
function render() {
  eduSyncDock();
  const screenState=state==='study'?eduReturnState:state;
  ctx.clearRect(0,0,GW,GH);
  if(screenState==='menu'){drawMenu();drawHomeBtn();drawMuteBtn();drawMusicBtn();return;}
  if(screenState==='modeselect'){drawModeSelect();drawHomeBtn();drawMuteBtn();drawMusicBtn();return;}

  ctx.save();
  if(shakeTimer>0){const i=shakeTimer*1.2;ctx.translate((Math.random()-0.5)*i,(Math.random()-0.5)*i);}

  drawBG();drawHostSignal(); drawDust();
  for(const p of powerUps) drawPU(p);
  for(const o of obstacles){ if(o.fade!==undefined){ctx.save();ctx.globalAlpha=Math.max(0,o.fade);drawObs(o);ctx.restore();} else drawObs(o); }
  drawMacro();drawBact();drawOpsoninTags();drawParts(); drawTexts();

  ctx.restore();
  vignette(GW,GH,0.45);

  if(screenState==='playing'||screenState==='dying') drawUI();
  if(screenState==='countdown'){drawUI();drawCountdown();}
  if(screenState==='gameover'){drawGameOver();drawHomeBtn();}
  if(screenState==='won'){drawWin();drawHomeBtn();}
  drawLearningHUD();drawMuteBtn();drawMusicBtn();if(PAUSE_CFG.pausable.includes(state))drawPauseBtn();
}

// --- ACTIONS ---
function startGame() { initAudio(); initGame(); state='countdown'; countdownVal=3; countdownT=0; sndCount(); }
function startWithMode(key){learningRun=false;eduFlow=null;mode=key; targetFrames=MODES[key].secs*60; startGame(); }
function winRun(){
  state='won'; gameOverTime=Date.now();
  if (score>highScore){ highScore=score; lsSet('immunorun_hs',highScore+''); }
  sndWin();openLearning('report',{returnState:'won'});
}
function canvasXY(cx,cy){ const r=canvas.getBoundingClientRect(); return { x:(cx-r.left)*(GW/r.width), y:(cy-r.top)*(GH/r.height) }; }
function modeButtonRects(){
  const bw=200,bh=76,gap=22,total=3*bw+2*gap,x0=(GW-total)/2,y=GH*0.60;
  return modeKeys.map((k,i)=>({key:k,x:x0+i*(bw+gap),y,w:bw,h:bh}));
}
function pickMode(x,y){ for(const r of modeButtonRects()){ if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){ startWithMode(r.key); return; } } }
// Botão "voltar ao hub" (telas fora do jogo)
const HOME_BTN={x:12,y:12,w:82,h:26};
const HOME_STATES=['menu','modeselect','gameover','won'];
function drawHomeBtn(){
  const b=HOME_BTN;
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,7);ctx.stroke();
  ctx.font='bold 11px Fredoka,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fillText('⌂  Menu',b.x+b.w/2,b.y+b.h/2+1);
  ctx.textBaseline='alphabetic';
}
function homeHit(x,y){const b=HOME_BTN;return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
function goHome(){location.href='https://immuno.games/';}

function doJump() {
  if(state!=='playing'||!player.grounded||player.ducking) return;
  player.vy=JUMP_FORCE; player.grounded=false; player.jumping=true;
  sndJump();
  for(let i=0;i<3;i++) addDust(player.x+player.w*0.3,GROUND_Y);
}

function doDuck(hold) {
  if(state!=='playing'||!player.grounded||player.ducking) return;
  player.ducking=true; player.duckTimer=25; player.duckHold=!!hold;
  player.h=DUCK_H; player.y=GROUND_Y-DUCK_H;
  sndSlide();
}
function stopDuck() {
  player.duckHold=false;
  if(player.ducking && player.grounded){
    player.ducking=false; player.h=PLAYER_H; player.y=GROUND_Y-PLAYER_H;
  }
}

// --- INPUT ---
// Toque: gesto estilo Subway Surfers — deslizar para baixo abaixa (e segura), deslizar para cima ou tocar pula
let touchSY=0, touchST=0, gesture=null;

canvas.addEventListener('touchstart',(e)=>{
  if(learningIsOpen())return;
  e.preventDefault();
  touchSY=e.touches[0].clientY; touchST=Date.now(); gesture=null;
  const p=canvasXY(e.touches[0].clientX,e.touches[0].clientY);
  if(PAUSE_CFG.pausable.includes(state)&&pauseHit(p.x,p.y)){gesture='ui';initAudio();togglePause();return;}
  if(muteHit(p.x,p.y)){gesture='ui';initAudio();toggleMute();return;}
  if(musicHit(p.x,p.y)){gesture='ui';initAudio();toggleMusic();return;}
  if(HOME_STATES.includes(state)&&homeHit(p.x,p.y)){gesture='ui';goHome();return;}
  if(state==='menu'){gesture='ui';initAudio();state='modeselect';return;}
  if(state==='modeselect'){gesture='ui';initAudio();pickMode(p.x,p.y);return;}
  if((state==='gameover'||state==='won')&&Date.now()-gameOverTime>600){gesture='ui';state='modeselect';return;}
},{passive:false});

canvas.addEventListener('touchmove',(e)=>{
  e.preventDefault();
  if(state!=='playing'||gesture) return;
  const dy=e.touches[0].clientY-touchSY;
  if(dy>22){gesture='duck';doDuck(true);}       // deslizou para baixo: abaixa enquanto o dedo estiver na tela
  else if(dy<-22){gesture='jump';doJump();}     // deslizou para cima: pula
},{passive:false});

canvas.addEventListener('touchend',(e)=>{
  e.preventDefault();
  if(gesture==='duck'){stopDuck();gesture=null;return;}
  if(gesture===null&&state==='playing') doJump(); // toque simples: pula
  gesture=null;
},{passive:false});

document.addEventListener('keydown',(e)=>{
  if(learningIsOpen()||e.target.closest('button,a,input,textarea,select,summary'))return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    e.preventDefault();
    if(state==='menu'){initAudio();state='modeselect';return;}
    if(state==='modeselect'){startWithMode(mode);return;}
    if(state==='gameover'||state==='won'){state='modeselect';return;}
    doJump();
  }
  if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();doDuck(true);}
  if(e.code==='KeyM'){initAudio();toggleMusic();}
  if(state==='modeselect'){
    if(e.code==='Digit1'||e.code==='Numpad1') startWithMode('FACIL');
    if(e.code==='Digit2'||e.code==='Numpad2') startWithMode('MEDIO');
    if(e.code==='Digit3'||e.code==='Numpad3') startWithMode('DIFICIL');
  }
});
document.addEventListener('keyup',(e)=>{
  if(e.code==='ArrowDown'||e.code==='KeyS') stopDuck();
});

canvas.addEventListener('mousedown',(e)=>{
  if(learningIsOpen()||e.button!==0)return;
  const p=canvasXY(e.clientX,e.clientY);
  if(PAUSE_CFG.pausable.includes(state)&&pauseHit(p.x,p.y)){initAudio();togglePause();return;}
  if(muteHit(p.x,p.y)){initAudio();toggleMute();return;}
  if(musicHit(p.x,p.y)){initAudio();toggleMusic();return;}
  if(HOME_STATES.includes(state)&&homeHit(p.x,p.y)){goHome();return;}
  if(state==='menu'){initAudio();state='modeselect';return;}
  if(state==='modeselect'){initAudio();pickMode(p.x,p.y);return;}
  if(state==='gameover'||state==='won'){ if(Date.now()-gameOverTime>400) state='modeselect'; return; }
  doJump();
});
canvas.addEventListener('mousemove',(e)=>{ const p=canvasXY(e.clientX,e.clientY); mouseX=p.x; mouseY=p.y; });
canvas.addEventListener('contextmenu',(e)=>{e.preventDefault();doDuck();});

// --- MAIN LOOP (fixed timestep) ---
function gameLoop(timestamp) {
  if(lastTimestamp===0) lastTimestamp=timestamp;
  accumulator += timestamp - lastTimestamp;
  lastTimestamp = timestamp;
  if(accumulator > FRAME_TIME*5) accumulator = FRAME_TIME*5; // prevent spiral

  while(accumulator >= FRAME_TIME) {
    update();
    accumulator -= FRAME_TIME;
  }

  musicSync();
  render();
  requestAnimationFrame(gameLoop);
}

initGame();
state='menu';
requestAnimationFrame(gameLoop);

const PAUSE_BTN={x:GW-74,y:BTN_Y,w:28,h:24};
const PAUSE_CFG={pausable:['playing','countdown']};


// ===== Pausa com instruções (overlay HTML, estrutura igual à do ImunoTropa) =====
let prevState=null;
function drawPauseBtn(){const b=PAUSE_BTN;ctx.save();ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;ctx.stroke();ctx.font='700 12px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText('II',b.x+b.w/2,b.y+b.h/2+1);ctx.restore();}
function pauseHit(x,y){const b=PAUSE_BTN;return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
function showOvl(html){const c=document.getElementById('card');c.innerHTML=html;const o=document.getElementById('ovl');o.classList.remove('hide');o.scrollTop=0;}
function hideOvl(){document.getElementById('ovl').classList.add('hide');}
function togglePause(){
 if(learningIsOpen()){closeLearning();return;}
 if(PAUSE_CFG.pausable.includes(state))openLearning('pause');
}
document.addEventListener('keydown',e=>{
 if(learningIsOpen()||e.target.closest('button,a,input,textarea,select,summary'))return;
 if((e.code==='Escape'||e.code==='KeyP')&&PAUSE_CFG.pausable.includes(state)){e.preventDefault();togglePause();}
});


document.addEventListener('visibilitychange',()=>{if(document.hidden&&PAUSE_CFG.pausable.includes(state))togglePause();});


// Rotation must not erase an educational session or a paused run.
window.addEventListener('orientationchange',()=>setTimeout(()=>{resizeCanvas();if(window.innerHeight>window.innerWidth&&PAUSE_CFG.pausable.includes(state))togglePause();},100));
canvas.addEventListener('touchcancel',()=>{gesture=null;stopDuck();},{passive:true});
setupEducation();

const eduReducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
let eduMotionPaused=eduReducedMotion.matches||lsGet('immunorun_motion')==='paused';
const eduMotionButton=document.getElementById('edMotion');
function syncEduMotion(){eduMotionButton.textContent=eduMotionPaused?'Animar personagens':'Pausar animações';eduMotionButton.setAttribute('aria-pressed',String(eduMotionPaused));}
eduMotionButton.onclick=()=>{eduMotionPaused=!eduMotionPaused;lsSet('immunorun_motion',eduMotionPaused?'paused':'on');syncEduMotion();};
eduReducedMotion.addEventListener('change',e=>{eduMotionPaused=e.matches;syncEduMotion();});
syncEduMotion();
let eduArtLast=0;
function animateEduArt(t){
 requestAnimationFrame(animateEduArt);
 if(document.hidden||!learningIsOpen()||t-eduArtLast<80)return;
 eduArtLast=t;
 const viewport=document.getElementById('edBody').getBoundingClientRect();
 document.querySelectorAll('#edBody canvas.ed-art').forEach(c=>{
  const r=c.getBoundingClientRect();if(r.bottom<viewport.top||r.top>viewport.bottom||!r.width||!r.height)return;
  const key=c.dataset.art,sprite=ASPR[key],im=IMG[key];if(!im)return;
  const still=eduMotionPaused||!!c.closest('.ed-guide-list');
  const src=sprite?sprite.frames[still?0:Math.floor(t/(key==='bact'?95:145))%sprite.n]:im;
  const ratio=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*ratio),h=Math.round(r.height*ratio);
  if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
  const x=c.getContext('2d');x.clearRect(0,0,w,h);x.imageSmoothingQuality='high';
  const scale=Math.min(w/src.width,h/src.height)*.91;
  const bob=still?0:Math.sin(t/580+(key==='bact'?2:0))*h*.025;
  x.drawImage(src,(w-src.width*scale)/2,(h-src.height*scale)/2+bob,src.width*scale,src.height*scale);
 });
}
requestAnimationFrame(animateEduArt);
